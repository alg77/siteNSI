<p>Écris <code>parentheses_equilibrees(chaine)</code>.</p>\n<div class=\"adm adm-astuce\"><p class=\"adm-titre\">Pour réfléchir</p><p>Exécute <code>parentheses_equilibrees(&quot;([)]&quot;)</code> <strong>en adaptant</strong> ton idée aux crochets (un compteur par type). Que renvoie-t-elle ? Pourquoi ce n&#x27;est pas satisfaisant ? Note ta réponse en commentaire : c&#x27;est la raison d&#x27;être de l&#x27;exercice suivant.</p></div>", "starter": "def parentheses_equilibrees(chaine):\n    \"\"\"True si les parenthèses rondes de chaine sont bien équilibrées, False sinon.\"\"\"\n    pass\n\n\nprint(parentheses_equilibrees(\"(()())\"))\nprint(parentheses_equilibrees(\"())(\"))\n\n# Ma réponse à la question « pour réfléchir » :\n# ...\n", "tests": "\n_cas = [(\"\", True), (\"()\", True), (\"(())\", True), (\"()()\", True), (\"(()())\", True), (\"a(b)c\", True),\n        (\"(()\", False), (\"())\", False), (\")(\", False), (\"((a)\", False), (\"))((\", False), (\"(\", False)]\nfor _s, _att in _cas:\n    egal(\"parentheses_equilibrees(%r)\" % _s, lambda _s=_s: parentheses_equilibrees(_s), _att)\n", "aide_code": null, "visuel": null, "indice_html": "<p>Le compteur ne fait qu&#x27;une addition/soustraction : il ne garde aucune trace de *quel type* d&#x27;ouvrante attend d&#x27;être fermée. C&#x27;est exactement pour ça qu&#x27;il se trompe sur <code>&quot;([)]&quot;</code>.</p>", "solution": "def parentheses_equilibrees(chaine):\n    \"\"\"True si les parenthèses rondes de chaine sont bien équilibrées, False sinon.\"\"\"\n    compteur = 0\n    for c in chaine:\n        if c == \"(\":\n            compteur += 1\n        elif c == \")\":\n            compteur -= 1\n            if compteur < 0:\n                return False\n    return compteur == 0\n\n\nprint(parentheses_equilibrees(\"(()())\"))\nprint(parentheses_equilibrees(\"())(\"))\n\n# Ma réponse à la question « pour réfléchir » :\n# Avec un compteur par type, \"([)]\" est jugée correcte (chaque compteur finit à 0)\n# alors que les paires se chevauchent : le compteur oublie l'ORDRE des ouvrantes.\n", "solution_html": "<span class=\"k\">def</span> <span class=\"f\">parentheses_equilibrees</span>(chaine):\n    <span class=\"s\">&quot;&quot;&quot;True si les parenthèses rondes de chaine sont bien équilibrées, False sinon.&quot;&quot;&quot;</span>\n    compteur = <span class=\"n\">0</span>\n    <span class=\"k\">for</span> c <span class=\"k\">in</span> chaine:\n        <span class=\"k\">if</span> c == <span class=\"s\">&quot;(&quot;</span>:\n            compteur += <span class=\"n\">1</span>\n        <span class=\"k\">elif</span> c == <span class=\"s\">&quot;)&quot;</span>:\n            compteur -= <span class=\"n\">1</span>\n            <span class=\"k\">if</span> compteur &lt; <span class=\"n\">0</span>:\n                <span class=\"k\">return</span> <span class=\"k\">False</span>\n    <span class=\"k\">return</span> compteur == <span class=\"n\">0</span>\n\n\n<span class=\"b\">print</span>(<span class=\"f\">parentheses_equilibrees</span>(<span class=\"s\">&quot;(()())&quot;</span>))\n<span class=\"b\">print</span>(<span class=\"f\">parentheses_equilibrees</span>(<span class=\"s\">&quot;())(&quot;</span>))\n\n<span class=\"c\"># Ma réponse à la question « pour réfléchir » :\n# Avec un compteur par type, &quot;([)]&quot; est jugée correcte (chaque compteur finit à 0)\n# alors que les paires se chevauchent : le compteur oublie l&#x27;ORDRE des ouvrantes.\n</span>", "notes_html": "<p>Point d&#x27;arrivée : le compteur oublie l&#x27;<strong>ordre</strong> dans lequel les ouvrantes ont été rencontrées. <code>&quot;([)]&quot;</code> a autant d&#x27;ouvrantes que de fermantes de chaque type, mais les paires se chevauchent. Il faut mémoriser <strong>quelle</strong> ouvrante est en attente, la dernière ouverte devant être la première fermée : c&#x27;est exactement une pile.</p>"}, {"id": "ex2", "kind": "exercice", "titre": "Avec une pile : `()`, `[]`, `{}`", "abbr": "E2", "enonce_html": "<p>Écris <code>est_bien_parenthese(chaine)</code> qui gère les trois types de délimiteurs. Les autres caractères sont ignorés.</p>\n<p><strong>Algorithme</strong> (à comprendre avant de coder) :</p>\n<ol><li>on parcourt la chaîne caractère par caractère, avec une pile initialement vide ;</li><li><strong>ouvrante</strong> → on l&#x27;empile ;</li><li><strong>fermante</strong> → si la pile est vide, ou si le sommet n&#x27;est pas l&#x27;ouvrante correspondante : <code>False</code> ; sinon on dépile ;</li><li>à la fin, la chaîne est correcte <strong>si et seulement si</strong> la pile est vide.</li></ol>\n<p>Le dictionnaire <code>PAIRES</code> donne, pour chaque fermante, l&#x27;ouvrante attendue.</p>\n<p><strong>Avant de coder</strong>, recopie et complète sur ton brouillon la trace de <code>&quot;([)]&quot;</code> :</p>\n<table><thead><tr><th>caractère</th><th>action</th><th>pile après</th></tr></thead><tbody><tr><td><code>(</code></td><td>empiler</td><td><code>(</code></td></tr><tr><td><code>[</code></td><td>...</td><td>...</td></tr><tr><td><code>)</code></td><td>...</td><td>...</td></tr></tbody></table>", "starter": "OUVRANTES = \"([{\"\nFERMANTES = \")]}\"\nPAIRES = {\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}\n\n\ndef est_bien_parenthese(chaine):\n    \"\"\"True si chaine est bien parenthésée (types et ordre corrects), False sinon.\"\"\"\n    pass\n\n\nfor essai in [\"{[()]}\", \"([)]\", \"\", \")(\", \"a(b[c]d)e\"]:\n    print(repr(essai), est_bien_parenthese(essai))\n", "tests": "\n_cas = [(\"\", True), (\"()\", True), (\"()[]{}\", True), (\"{[()]}\", True), (\"a(b[c]{d}e)f\", True), (\"([{}])\", True),\n        (\"([)]\", False), (\"(]\", False), (\"(()\", False), (\"())\", False), (\")(\", False), (\"]\", False),\n        (\"{[}\", False), (\"((]]\", False), (\"[(])\", False), (\"(((\", False)]\nfor _s, _att in _cas:\n    egal(\"est_bien_parenthese(%r)\" % _s, lambda _s=_s: est_bien_parenthese(_s), _att)\ndef _usage(s):\n    _ops[0] = 0\n    est_bien_parenthese(s)\n    return _ops[0]\nvrai(\"la fonction utilise bien une Pile\", lambda: _usage(\"([{}])\") >= 6, \"Aucune opération de pile : utilise Pile()\")\n", "aide_code": null, "visuel": null, "indice_html": "<p>Suis l&#x27;algorithme pas à pas : ouvrante → <code>empiler</code> ; fermante → si la pile est vide <strong>ou</strong> si <code>depiler()</code> ne correspond pas (via <code>PAIRES</code>), renvoie <code>False</code> immédiatement. À la fin de la boucle, la chaîne n&#x27;est correcte que si la pile est <strong>vide</strong>.</p>", "solution": "OUVRANTES = \"([{\"\nFERMANTES = \")]}\"\nPAIRES = {\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}\n\n\ndef est_bien_parenthese(chaine):\n    \"\"\"True si chaine est bien parenthésée (types et ordre corrects), False sinon.\"\"\"\n    p = Pile()\n    for c in chaine:\n        if c in OUVRANTES:\n            p.empiler(c)\n        elif c in FERMANTES:\n            if p.est_vide() or p.depiler() != PAIRES[c]:\n                return False\n    return p.est_vide()\n\n\nfor essai in [\"{[()]}\", \"([)]\", \"\", \")(\", \"a(b[c]d)e\"]:\n    print(repr(essai), est_bien_parenthese(essai))\n", "solution_html": "OUVRANTES = <span class=\"s\">&quot;([{&quot;</span>\nFERMANTES = <span class=\"s\">&quot;)]}&quot;</span>\nPAIRES = {<span class=\"s\">&quot;)&quot;</span>: <span class=\"s\">&quot;(&quot;</span>, <span class=\"s\">&quot;]&quot;</span>: <span class=\"s\">&quot;[&quot;</span>, <span class=\"s\">&quot;}&quot;</span>: <span class=\"s\">&quot;{&quot;</span>}\n\n\n<span class=\"k\">def</span> <span class=\"f\">est_bien_parenthese</span>(chaine):\n    <span class=\"s\">&quot;&quot;&quot;True si chaine est bien parenthésée (types et ordre corrects), False sinon.&quot;&quot;&quot;</span>\n    p = <span class=\"f\">Pile</span>()\n    <span class=\"k\">for</span> c <span class=\"k\">in</span> chaine:\n        <span class=\"k\">if</span> c <span class=\"k\">in</span> OUVRANTES:\n            p.<span class=\"f\">empiler</span>(c)\n        <span class=\"k\">elif</span> c <span class=\"k\">in</span> FERMANTES:\n            <span class=\"k\">if</span> p.<span class=\"f\">est_vide</span>() <span class=\"k\">or</span> p.<span class=\"f\">depiler</span>() != PAIRES[c]:\n                <span class=\"k\">return</span> <span class=\"k\">False</span>\n    <span class=\"k\">return</span> p.<span class=\"f\">est_vide</span>()\n\n\n<span class=\"k\">for</span> essai <span class=\"k\">in</span> [<span class=\"s\">&quot;{[()]}&quot;</span>, <span class=\"s\">&quot;([)]&quot;</span>, <span class=\"s\">&quot;&quot;</span>, <span class=\"s\">&quot;)(&quot;</span>, <span class=\"s\">&quot;a(b[c]d)e&quot;</span>]:\n    <span class=\"b\">print</span>(<span class=\"b\">repr</span>(essai), <span class=\"f\">est_bien_parenthese</span>(essai))\n", "notes_html": "<p>Erreurs typiques : oublier le test <code>p.est_vide()</code> avant <code>depiler()</code> (IndexError sur <code>&quot;)(&quot;</code>, <code>&quot;]&quot;</code>), oublier de vérifier que la pile est vide <strong>à la fin</strong> (<code>&quot;((&quot;</code> renvoie <code>True</code>), comparer la fermante avec l&#x27;ouvrante au lieu d&#x27;utiliser <code>PAIRES</code>.<br>Trace de <code>&quot;([)]&quot;</code> : <code>(</code> → pile <code>(</code> ; <code>[</code> → pile <code>( [</code> ; <code>)</code> : le sommet est <code>[</code>, attendu <code>(</code> → <code>False</code>.</p>"}, {"id": "ex3", "kind": "exercice", "titre": "Où est l'erreur ?", "abbr": "E3", "enonce_html": "<p>Dire « c&#x27;est faux » ne suffit pas : un éditeur doit <strong>montrer où</strong>. Écris <code>premiere_erreur(chaine)</code> qui renvoie :</p>\n<ul><li><code>-1</code> si la chaîne est bien parenthésée ;</li><li>sinon l&#x27;<strong>indice</strong> (position dans la chaîne, en commençant à 0) du caractère fautif :</li></ul>\n<p>Exemples : <code>premiere_erreur(&quot;(]&quot;)</code> → <code>1</code> ; <code>premiere_erreur(&quot;(()&quot;)</code> → <code>0</code> ; <code>premiere_erreur(&quot;())&quot;)</code> → <code>2</code>.</p>\n<div class=\"adm adm-astuce\"><p class=\"adm-titre\">Astuce</p><p>Il faut empiler plus que le caractère : empile un <strong>tuple</strong> <code>(caractère, indice)</code>.</p></div>\n<p>Les constantes <code>OUVRANTES</code>, <code>FERMANTES</code>, <code>PAIRES</code> de l&#x27;exercice 2 sont disponibles.</p>", "starter": "def premiere_erreur(chaine):\n    \"\"\"-1 si chaine est bien parenthésée, sinon l'indice du caractère fautif.\"\"\"\n    pass\n\n\nprint(premiere_erreur(\"print(len([1, 2, 3])\"))\nprint(premiere_erreur(\"x = (1 + 2]\"))\n", "tests": "\n_cas = [(\"\", -1), (\"([]{})\", -1), (\"(]\", 1), (\")(\", 0), (\"())\", 2), (\"(()\", 0), (\"((\", 1), (\"a[b(c]d)\", 5),\n        (\"{[()]\", 0), (\"print(len([1, 2, 3])\", 5), (\"x = (1 + 2]\", 10), (\"]\", 0), (\"abc\", -1)]\nfor _s, _att in _cas:\n    egal(\"premiere_erreur(%r) == %d\" % (_s, _att), lambda _s=_s: premiere_erreur(_s), _att)\n", "aide_code": "OUVRANTES = \"([{\"\n\nFERMANTES = \")]}\"\n\nPAIRES = {\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}", "visuel": null, "indice_html": "<p>Empile des <strong>tuples</strong> <code>(caractère, indice)</code> plutôt que juste le caractère : ça te permet de retrouver la position même après avoir dépilé.</p>", "solution": "def premiere_erreur(chaine):\n    \"\"\"-1 si chaine est bien parenthésée, sinon l'indice du caractère fautif.\"\"\"\n    p = Pile()\n    for i, c in enumerate(chaine):\n        if c in OUVRANTES:\n            p.empiler((c, i))\n        elif c in FERMANTES:\n            if p.est_vide():\n                return i\n            ouvrante, _ = p.depiler()\n            if ouvrante != PAIRES[c]:\n                return i\n    if p.est_vide():\n        return -1\n    return p.depiler()[1]\n\n\nprint(premiere_erreur(\"print(len([1, 2, 3])\"))\nprint(premiere_erreur(\"x = (1 + 2]\"))\n", "solution_html": "<span class=\"k\">def</span> <span class=\"f\">premiere_erreur</span>(chaine):\n    <span class=\"s\">&quot;&quot;&quot;-1 si chaine est bien parenthésée, sinon l&#x27;indice du caractère fautif.&quot;&quot;&quot;</span>\n    p = <span class=\"f\">Pile</span>()\n    <span class=\"k\">for</span> i, <span class=\"f\">c</span> <span class=\"k\">in</span> <span class=\"b\">enumerate</span>(chaine):\n        <span class=\"k\">if</span> c <span class=\"k\">in</span> OUVRANTES:\n            p.<span class=\"f\">empiler</span>((c, i))\n        <span class=\"k\">elif</span> c <span class=\"k\">in</span> FERMANTES:\n            <span class=\"k\">if</span> p.<span class=\"f\">est_vide</span>():\n                <span class=\"k\">return</span> i\n            ouvrante, _ = p.<span class=\"f\">depiler</span>()\n            <span class=\"k\">if</span> ouvrante != PAIRES[c]:\n                <span class=\"k\">return</span> i\n    <span class=\"k\">if</span> p.<span class=\"f\">est_vide</span>():\n        <span class=\"k\">return</span> -<span class=\"n\">1</span>\n    <span class=\"k\">return</span> p.<span class=\"f\">depiler</span>()[<span class=\"n\">1</span>]\n\n\n<span class=\"b\">print</span>(<span class=\"f\">premiere_erreur</span>(<span class=\"s\">&quot;print(len([1, 2, 3])&quot;</span>))\n<span class=\"b\">print</span>(<span class=\"f\">premiere_erreur</span>(<span class=\"s\">&quot;x = (1 + 2]&quot;</span>))\n", "notes_html": "<p>Choix d&#x27;énoncé assumé : pour des ouvrantes non fermées on renvoie la <strong>dernière</strong> (sommet de pile) ; on aurait pu choisir la première. Ce choix est précisé dans l&#x27;énoncé pour éviter toute ambiguïté.<br>Point technique : empiler des couples <code>(caractère, indice)</code>.</p>"}, {"id": "ex4", "kind": "exercice", "titre": "Les balises HTML", "abbr": "E4", "enonce_html": "<p>Une page HTML est correcte si ses balises sont bien <strong>imbriquées</strong> : <code>&lt;b&gt;&lt;i&gt;texte&lt;/i&gt;&lt;/b&gt;</code> est correct, <code>&lt;b&gt;&lt;i&gt;texte&lt;/b&gt;&lt;/i&gt;</code> ne l&#x27;est pas.</p>\n<p>La fonction <code>extraire_balises(texte)</code> est fournie. Elle renvoie la liste des balises dans l&#x27;ordre, sous la forme <code>(&quot;ouvrante&quot;, nom)</code> ou <code>(&quot;fermante&quot;, nom)</code>, en ignorant les balises auto-fermantes (<code>&lt;br&gt;</code>, <code>&lt;img ...&gt;</code>).</p>\n<p>Écris <code>est_html_correct(texte)</code>. C&#x27;est le <strong>même algorithme</strong> que l&#x27;exercice 2, mais on empile des <strong>noms de balises</strong>.</p>", "starter": "print(extraire_balises(\"<p>Bonjour <b>toi</b><br></p>\"))\n\n\ndef est_html_correct(texte):\n    \"\"\"True si les balises de texte sont bien imbriquées, False sinon.\"\"\"\n    pass\n\n\nprint(est_html_correct(\"<ul><li>a</li><li>b</li></ul>\"))\nprint(est_html_correct(\"<div><p>x</div></p>\"))\n", "tests": "\n_cas = [(\"\", True), (\"<p>Bonjour <b>toi</b></p>\", True), (\"<b><i>x</i></b>\", True), (\"<b><i>x</b></i>\", False),\n        (\"<p>un<br>deux</p>\", True), (\"<div><p>x</div>\", False), (\"</p>\", False), (\"<p>\", False),\n        (\"<ul><li>a</li><li>b</li></ul>\", True), (\"<img src='a.png'>\", True), (\"<a href='x'><b>lien</b></a>\", True),\n        (\"<div><p>x</div></p>\", False)]\nfor _s, _att in _cas:\n    egal(\"est_html_correct(%r)\" % _s, lambda _s=_s: est_html_correct(_s), _att)\n", "aide_code": null, "visuel": null, "indice_html": "<p>C&#x27;est le même algorithme que l&#x27;exercice 2 : seule la nature de ce qu&#x27;on empile change (des noms de balises au lieu de caractères). <code>extraire_balises</code> fait tout le travail de découpage pour toi.</p>", "solution": "print(extraire_balises(\"<p>Bonjour <b>toi</b><br></p>\"))\n\n\ndef est_html_correct(texte):\n    \"\"\"True si les balises de texte sont bien imbriquées, False sinon.\"\"\"\n    p = Pile()\n    for genre, nom in extraire_balises(texte):\n        if genre == \"ouvrante\":\n            p.empiler(nom)\n        else:\n            if p.est_vide() or p.depiler() != nom:\n                return False\n    return p.est_vide()\n\n\nprint(est_html_correct(\"<ul><li>a</li><li>b</li></ul>\"))\nprint(est_html_correct(\"<div><p>x</div></p>\"))\n", "solution_html": "<span class=\"b\">print</span>(<span class=\"f\">extraire_balises</span>(<span class=\"s\">&quot;&lt;p&gt;Bonjour &lt;b&gt;toi&lt;/b&gt;&lt;br&gt;&lt;/p&gt;&quot;</span>))\n\n\n<span class=\"k\">def</span> <span class=\"f\">est_html_correct</span>(texte):\n    <span class=\"s\">&quot;&quot;&quot;True si les balises de texte sont bien imbriquées, False sinon.&quot;&quot;&quot;</span>\n    p = <span class=\"f\">Pile</span>()\n    <span class=\"k\">for</span> genre, nom <span class=\"k\">in</span> <span class=\"f\">extraire_balises</span>(texte):\n        <span class=\"k\">if</span> genre == <span class=\"s\">&quot;ouvrante&quot;</span>:\n            p.<span class=\"f\">empiler</span>(nom)\n        <span class=\"k\">else</span>:\n            <span class=\"k\">if</span> p.<span class=\"f\">est_vide</span>() <span class=\"k\">or</span> p.<span class=\"f\">depiler</span>() != nom:\n                <span class=\"k\">return</span> <span class=\"k\">False</span>\n    <span class=\"k\">return</span> p.<span class=\"f\">est_vide</span>()\n\n\n<span class=\"b\">print</span>(<span class=\"f\">est_html_correct</span>(<span class=\"s\">&quot;&lt;ul&gt;&lt;li&gt;a&lt;/li&gt;&lt;li&gt;b&lt;/li&gt;&lt;/ul&gt;&quot;</span>))\n<span class=\"b\">print</span>(<span class=\"f\">est_html_correct</span>(<span class=\"s\">&quot;&lt;div&gt;&lt;p&gt;x&lt;/div&gt;&lt;/p&gt;&quot;</span>))\n", "notes_html": "<p>Réinvestissement direct de l&#x27;exercice 2 : la pile contient ici des chaînes (noms de balises) au lieu de caractères. La comparaison <code>depiler() != nom</code> remplace le dictionnaire <code>PAIRES</code>.</p>"}, {"id": "defi", "kind": "defi", "titre": "Défi – La notation polonaise inverse", "abbr": "D", "enonce_html": "<p>En <strong>notation polonaise inverse</strong> (NPI, ou postfixée), l&#x27;opérateur suit ses opérandes et <strong>on n&#x27;a plus besoin de parenthèses</strong> : <code>3 4 + 2 *</code> vaut <code>(3 + 4) × 2 = 14</code>. Les vieilles calculatrices HP fonctionnent ainsi.</p>\n<p>Écris <code>evaluer_npi(expression)</code> : les éléments de <code>expression</code> sont séparés par des espaces ; les nombres sont des <strong>entiers</strong> ; les opérateurs sont <code>+</code>, <code>-</code>, <code>*</code>, <code>/</code>.</p>\n<p>Algorithme :</p>\n<ul><li><strong>nombre</strong> → on l&#x27;empile ;</li><li><strong>opérateur</strong> → on dépile <code>b</code>, puis on dépile <code>a</code>, on calcule <code>a opérateur b</code> et on <strong>empile</strong> le résultat ;</li><li>à la fin, il reste un seul élément : le résultat.</li></ul>\n<div class=\"adm adm-attention\"><p class=\"adm-titre\">Attention à l&#x27;ordre</p><p>Le <strong>premier</strong> élément dépilé est l&#x27;opérande de <strong>droite</strong> : <code>7 2 -</code> vaut <code>5</code>, pas <code>-5</code>.</p></div>\n<p><strong>Pour les plus rapides :</strong> écris la conversion d&#x27;une expression infixe (avec parenthèses) en NPI (algorithme *shunting-yard* de Dijkstra) — deux piles ou une pile et une liste de sortie.</p>", "starter": "def evaluer_npi(expression):\n    \"\"\"Évalue une expression en notation polonaise inverse, ex. '3 4 + 2 *' -> 14.\"\"\"\n    pass\n\n\nprint(evaluer_npi(\"3 4 + 2 *\"))\n", "tests": "\n_cas = [(\"3 4 +\", 7), (\"3 4 + 2 *\", 14), (\"7 2 -\", 5), (\"2 7 -\", -5), (\"10 2 /\", 5), (\"5 1 2 + 4 * + 3 -\", 14),\n        (\"2 3 4 * +\", 14), (\"42\", 42), (\"100 5 / 2 /\", 10)]\nfor _s, _att in _cas:\n    egal(\"evaluer_npi(%r) == %r\" % (_s, _att), lambda _s=_s: evaluer_npi(_s), _att)\n", "aide_code": null, "visuel": null, "indice_html": "<p>Pense à l&#x27;ordre : à chaque opérateur, c&#x27;est le <strong>premier</strong> élément dépilé qui est l&#x27;opérande de droite. <code>7 2 -</code> doit valoir <code>5</code>, pas <code>-5</code> — si tu obtiens <code>-5</code>, inverse <code>a</code> et <code>b</code>.</p>", "solution": "def evaluer_npi(expression):\n    \"\"\"Évalue une expression en notation polonaise inverse, ex. '3 4 + 2 *' -> 14.\"\"\"\n    p = Pile()\n    for jeton in expression.split():\n        if jeton in (\"+\", \"-\", \"*\", \"/\"):\n            b = p.depiler()\n            a = p.depiler()\n            if jeton == \"+\":\n                p.empiler(a + b)\n            elif jeton == \"-\":\n                p.empiler(a - b)\n            elif jeton == \"*\":\n                p.empiler(a * b)\n            else:\n                p.empiler(a / b)\n        else:\n            p.empiler(int(jeton))\n    return p.depiler()\n\n\nprint(evaluer_npi(\"3 4 + 2 *\"))\n", "solution_html": "<span class=\"k\">def</span> <span class=\"f\">evaluer_npi</span>(expression):\n    <span class=\"s\">&quot;&quot;&quot;Évalue une expression en notation polonaise inverse, ex. &#x27;3 4 + 2 *&#x27; -&gt; 14.&quot;&quot;&quot;</span>\n    p = <span class=\"f\">Pile</span>()\n    <span class=\"k\">for</span> jeton <span class=\"k\">in</span> expression.<span class=\"f\">split</span>():\n        <span class=\"k\">if</span> <span class=\"f\">jeton</span> <span class=\"k\">in</span> (<span class=\"s\">&quot;+&quot;</span>, <span class=\"s\">&quot;-&quot;</span>, <span class=\"s\">&quot;*&quot;</span>, <span class=\"s\">&quot;/&quot;</span>):\n            b = p.<span class=\"f\">depiler</span>()\n            a = p.<span class=\"f\">depiler</span>()\n            <span class=\"k\">if</span> jeton == <span class=\"s\">&quot;+&quot;</span>:\n                p.<span class=\"f\">empiler</span>(a + b)\n            <span class=\"k\">elif</span> jeton == <span class=\"s\">&quot;-&quot;</span>:\n                p.<span class=\"f\">empiler</span>(a - b)\n            <span class=\"k\">elif</span> jeton == <span class=\"s\">&quot;*&quot;</span>:\n                p.<span class=\"f\">empiler</span>(a * b)\n            <span class=\"k\">else</span>:\n                p.<span class=\"f\">empiler</span>(a / b)\n        <span class=\"k\">else</span>:\n            p.<span class=\"f\">empiler</span>(<span class=\"b\">int</span>(jeton))\n    <span class=\"k\">return</span> p.<span class=\"f\">depiler</span>()\n\n\n<span class=\"b\">print</span>(<span class=\"f\">evaluer_npi</span>(<span class=\"s\">&quot;3 4 + 2 *&quot;</span>))\n", "notes_html": "<p>La conversion infixe → postfixe (shunting-yard) est un excellent sujet de projet ou de prolongement pour les élèves les plus rapides ; elle utilise une pile d&#x27;opérateurs et gère les priorités et les parenthèses.</p>"}], "prof_extra_html": "<h2>Variante « DST / bac » – Parenthésage</h2>\n<p>*Durée conseillée : 20 minutes. Interface d&#x27;une pile rappelée dans l&#x27;énoncé : <code>Pile()</code>, <code>est_vide()</code>, <code>empiler(x)</code>, <code>depiler()</code>, <code>sommet()</code>.*</p>\n<p><strong>Énoncé (élève)</strong></p>\n<p>On considère des chaînes de caractères ne contenant que les caractères <code>(</code>, <code>)</code>, <code>[</code> et <code>]</code>. Une chaîne est *bien parenthésée* si chaque ouvrante est fermée par la fermante du même type, dans le bon ordre.</p>\n<ol><li>Une pile est initialement vide. On effectue : <code>empiler(3)</code>, <code>empiler(8)</code>, <code>depiler()</code>, <code>empiler(5)</code>, <code>depiler()</code>, <code>depiler()</code>. Donner, après chaque opération, le contenu de la pile (sommet à droite).</li><li>Parmi les chaînes <code>&quot;([])&quot;</code>, <code>&quot;([)]&quot;</code>, <code>&quot;(()&quot;</code> et <code>&quot;[]()&quot;</code>, lesquelles sont bien parenthésées ?</li><li>Compléter la fonction suivante pour qu&#x27;elle renvoie <code>True</code> si <code>chaine</code> est bien parenthésée et <code>False</code> sinon.</li></ol>\n<pre><code><span class=\"k\">def</span> <span class=\"f\">bien_parenthese</span>(chaine):\n    p = <span class=\"f\">Pile</span>()\n    <span class=\"k\">for</span> c <span class=\"k\">in</span> chaine:\n        <span class=\"k\">if</span> c == <span class=\"s\">&quot;(&quot;</span> <span class=\"k\">or</span> c == <span class=\"s\">&quot;[&quot;</span>:\n            ...\n        <span class=\"k\">else</span>:\n            ...\n    <span class=\"k\">return</span> ...</code></pre>\n<ol><li>Dérouler l&#x27;algorithme sur <code>&quot;([)]&quot;</code> en donnant l&#x27;état de la pile après chaque caractère.</li><li>Quelle est la complexité de cette fonction en fonction de <code>n = len(chaine)</code> ? Justifier.</li><li>Donner une chaîne, mal parenthésée, pour laquelle un simple <strong>compteur</strong> (un compteur pour les parenthèses, un pour les crochets) répondrait à tort « bien parenthésée ».</li></ol>\n<p><strong>Corrigé</strong></p>\n<ol><li><code>[3]</code>, <code>[3, 8]</code>, <code>[3]</code>, <code>[3, 5]</code>, <code>[3]</code>, <code>[]</code>.</li><li><code>&quot;([])&quot;</code> : oui ; <code>&quot;([)]&quot;</code> : non ; <code>&quot;(()&quot;</code> : non ; <code>&quot;[]()&quot;</code> : oui.</li><li>Solution :</li></ol>\n<pre><code><span class=\"k\">def</span> <span class=\"f\">bien_parenthese</span>(chaine):\n    p = <span class=\"f\">Pile</span>()\n    <span class=\"k\">for</span> c <span class=\"k\">in</span> chaine:\n        <span class=\"k\">if</span> c == <span class=\"s\">&quot;(&quot;</span> <span class=\"k\">or</span> c == <span class=\"s\">&quot;[&quot;</span>:\n            p.<span class=\"f\">empiler</span>(c)\n        <span class=\"k\">else</span>:\n            <span class=\"k\">if</span> p.<span class=\"f\">est_vide</span>():\n                <span class=\"k\">return</span> <span class=\"k\">False</span>\n            o = p.<span class=\"f\">depiler</span>()\n            <span class=\"k\">if</span> (c == <span class=\"s\">&quot;)&quot;</span> <span class=\"k\">and</span> o != <span class=\"s\">&quot;(&quot;</span>) <span class=\"k\">or</span> (c == <span class=\"s\">&quot;]&quot;</span> <span class=\"k\">and</span> o != <span class=\"s\">&quot;[&quot;</span>):\n                <span class=\"k\">return</span> <span class=\"k\">False</span>\n    <span class=\"k\">return</span> p.<span class=\"f\">est_vide</span>()</code></pre>\n<ol><li><code>(</code> → <code>[(]</code> ; <code>[</code> → <code>[(, []</code> ; <code>)</code> : sommet <code>[</code> ≠ <code>(</code> → arrêt, <code>False</code>.</li><li>Complexité <strong>linéaire</strong> en <code>O(n)</code> : une boucle de <code>n</code> tours, chaque opération de pile étant en temps constant (<code>empiler</code>/<code>depiler</code> sur une liste Python en fin de liste).</li><li><code>&quot;([)]&quot;</code> (ou <code>&quot;[(])&quot;</code>) : chaque compteur finit à 0 et ne devient jamais négatif, alors que les paires se chevauchent.</li></ol>\n<p><strong>Barème indicatif (/8)</strong> : Q1 1 pt · Q2 1 pt · Q3 3 pts (cas pile vide 1 pt, comparaison des types 1 pt, pile vide à la fin 1 pt) · Q4 1 pt · Q5 1 pt · Q6 1 pt.</p>\n<p><strong>Erreurs à surveiller</strong> : oubli du test <code>est_vide()</code> avant <code>depiler()</code> ; oubli du test « pile vide à la fin » ; confusion entre <code>sommet()</code> et <code>depiler()</code>.</p>"}, {"id": "tp3", "num": 3, "slug": "bataille", "titre": "La bataille", "titre_court": "La bataille", "sous_titre": "Files : jeu de cartes, terminaison, statistiques", "duree": "2 h – 2 h 30", "emoji": "🃏", "accent": "#b3453d", "objectifs": ["Implémenter une file (liste Python) et la manipuler par son interface (`enfiler`, `defiler`, `est_vide`).", "Modéliser un jeu avec deux files et écrire une simulation complète.", "Découvrir qu'une boucle `while` peut ne jamais se terminer : notion de **terminaison** et de variant.", "Défis : file avec deux piles ; réutilisation d'une pile dans le jeu « 6 qui prend »."], "intro_html": "<h2>Rappel : la file (FIFO)</h2>\n<p>Une <strong>file</strong> est une structure de données où l&#x27;on <strong>ajoute à un bout</strong> (la queue) et où l&#x27;on <strong>retire à l&#x27;autre</strong> (la tête) : premier arrivé, premier sorti (*First In, First Out*). Comme la file d&#x27;attente d&#x27;une caisse.</p>\n<table><thead><tr><th>Opération</th><th>Effet</th></tr></thead><tbody><tr><td><code>f = File()</code></td><td>crée une file vide</td></tr><tr><td><code>f.est_vide()</code></td><td>renvoie <code>True</code> si la file est vide</td></tr><tr><td><code>f.enfiler(x)</code></td><td>ajoute <code>x</code> à la queue</td></tr><tr><td><code>f.defiler()</code></td><td>retire l&#x27;élément de <strong>tête</strong> et le renvoie (erreur si vide)</td></tr><tr><td><code>f.taille()</code></td><td>nombre d&#x27;éléments</td></tr></tbody></table>\n<h2>Les règles de la bataille (version du TP)</h2>\n<ul><li>Un jeu de 52 cartes est mélangé puis distribué <strong>une carte sur deux</strong> à chaque joueur : chaque joueur a une <strong>file</strong> de 26 cartes.</li><li>À chaque <strong>tour</strong>, les deux joueurs défilent leur carte du dessus. La plus forte gagne (2 &lt; 3 &lt; … &lt; 10 &lt; Valet &lt; Dame &lt; Roi &lt; As).</li><li>Le gagnant <strong>enfile</strong> les cartes gagnées à la queue de sa file : pour chaque <strong>paire</strong> de cartes jouées (une de chaque joueur), il enfile <strong>d&#x27;abord sa propre carte, puis celle de son adversaire</strong>. Les paires sont enfilées dans l&#x27;ordre où elles ont été jouées.</li><li><strong>Égalité (« bataille »)</strong> : les deux cartes vont dans un <strong>pot</strong> ; chaque joueur défile aussitôt une nouvelle carte, et ainsi de suite jusqu&#x27;à ce que l&#x27;une l&#x27;emporte ; le vainqueur enfile <strong>tout le pot</strong> selon la règle ci-dessus. Si, après une égalité, un joueur n&#x27;a plus de carte, il perd le pot (J1 est vérifié en premier).</li><li>La partie s&#x27;arrête quand un joueur n&#x27;a plus de carte.</li></ul>\n<p>Une carte est un tuple <code>(valeur, couleur)</code> : <code>(14, &quot;♠&quot;)</code> est l&#x27;As de pique. Les valeurs vont de 2 à 14 (11 = Valet, 12 = Dame, 13 = Roi, 14 = As).</p>\n<p>Sont fournis : <code>creer_paquet()</code>, <code>melanger(paquet, graine)</code> (mélange <strong>reproductible</strong> : la même <code>graine</code> donne toujours le même mélange), <code>nom_carte(carte)</code>, <code>fabrique(liste)</code> (crée une file contenant les éléments de la liste) et <code>contenu_file(f)</code> (la liste des éléments d&#x27;une file, sans la vider).</p>", "prelude": "\nimport random\n\n_ops = [0]\nVALEURS = list(range(2, 15))\nCOULEURS = [\"♠\", \"♥\", \"♦\", \"♣\"]\n_NOMS = {11: \"V\", 12: \"D\", 13: \"R\", 14: \"As\"}\n\n\ndef creer_paquet():\n    \"\"\"Les 52 cartes, dans l'ordre : chaque carte est (valeur, couleur).\"\"\"\n    return [(v, c) for c in COULEURS for v in VALEURS]\n\n\ndef melanger(paquet, graine):\n    \"\"\"Renvoie une NOUVELLE liste mélangée. Même graine -> même mélange.\"\"\"\n    p = list(paquet)\n    random.Random(graine).shuffle(p)\n    return p\n\n\ndef nom_carte(carte):\n    \"\"\"Ex. (14, '♠') -> 'As♠', (10, '♥') -> '10♥'.\"\"\"\n    v, c = carte\n    return str(_NOMS.get(v, v)) + c\n\n\nclass Pile:\n    \"\"\"Pile (LIFO). Interface : est_vide, empiler, depiler, sommet, taille.\"\"\"\n\n    def __init__(self):\n        self._elts = []\n\n    def est_vide(self):\n        return len(self._elts) == 0\n\n    def empiler(self, x):\n        _ops[0] += 1\n        self._elts.append(x)\n\n    def depiler(self):\n        if len(self._elts) == 0:\n            raise IndexError(\"depiler : la pile est vide\")\n        _ops[0] += 1\n        return self._elts.pop()\n\n    def sommet(self):\n        if len(self._elts) == 0:\n            raise IndexError(\"sommet : la pile est vide\")\n        return self._elts[-1]\n\n    def taille(self):\n        return len(self._elts)\n\n    def __repr__(self):\n        return \"Pile(\" + \", \".join(repr(x) for x in self._elts) + \" <- sommet)\" if self._elts else \"Pile(vide)\"\n\n\nclass File:\n    \"\"\"File (FIFO). Interface : est_vide, enfiler, defiler, taille.\"\"\"\n\n    def __init__(self):\n        self._elts = []\n\n    def est_vide(self):\n        return len(self._elts) == 0\n\n    def enfiler(self, x):\n        self._elts.append(x)\n\n    def defiler(self):\n        if len(self._elts) == 0:\n            raise IndexError(\"defiler : la file est vide\")\n        return self._elts.pop(0)\n\n    def taille(self):\n        return len(self._elts)\n\n    def __repr__(self):\n        return \"File(tête -> \" + \", \".join(repr(x) for x in self._elts) + \")\" if self._elts else \"File(vide)\"\n\n\ndef fabrique(elements):\n    \"\"\"Renvoie une file contenant les éléments de la liste (le premier de la liste en tête).\"\"\"\n    f = File()\n    for x in elements:\n        f.enfiler(x)\n    return f\n\n\ndef contenu_file(f):\n    \"\"\"Liste des éléments de f (tête -> queue), sans modifier f. N'utilise que l'interface de la file.\"\"\"\n    res = []\n    for _ in range(f.taille()):\n        x = f.defiler()\n        res.append(x)\n        f.enfiler(x)\n    return res\n\n\ndef tetes(carte):\n    \"\"\"Nombre de têtes de bœuf d'une carte (jeu « 6 qui prend »).\"\"\"\n    if carte == 55:\n        return 7\n    if carte % 11 == 0:\n        return 5\n    if carte % 10 == 0:\n        return 3\n    if carte % 5 == 0:\n        return 2\n    return 1\n", "exercices": [{"id": "ex1", "kind": "exercice", "titre": "Écrire une file, avec des fonctions", "abbr": "E1", "enonce_html": "<p>Une classe <code>File</code> est fournie plus loin dans ce TP, mais pour ce premier exercice <strong>tu écris ta propre file</strong>, sans classe : avec des fonctions, exactement comme dans ton cours (<code>pileVide</code>, <code>empiler</code>, <code>depiler</code>...). Tu n&#x27;as pas encore vu la programmation orientée objet (<code>class</code>, <code>self</code>) — tu n&#x27;en as pas besoin ici.</p>\n<p>Une file, c&#x27;est une <strong>liste Python</strong> : la <strong>tête</strong> de la file est le <strong>premier</strong> élément de la liste (indice 0), la <strong>queue</strong> est la fin.</p>\n<p>Écris cinq fonctions :</p>\n<ul><li><code>fileVide()</code> renvoie une <strong>nouvelle</strong> liste vide (deux appels ne doivent pas renvoyer la même liste) ;</li><li><code>estVide(F)</code> renvoie <code>True</code> si <code>F</code> est vide ;</li><li><code>enfiler(F, x)</code> ajoute <code>x</code> à la queue de <code>F</code> (ne renvoie rien) ;</li><li><code>defiler(F)</code> retire et renvoie l&#x27;élément de <strong>tête</strong> ; elle lève <code>IndexError</code> si <code>F</code> est vide ;</li><li><code>taille(F)</code> renvoie le nombre d&#x27;éléments de <code>F</code>.</li></ul>\n<div class=\"adm adm-astuce\"><p class=\"adm-titre\">Réflexion</p><p><code>liste.pop(0)</code> doit décaler tous les éléments restants. Est-ce grave pour 26 cartes ? Et pour un million d&#x27;éléments ? (Tu verras dans le défi A une autre solution, avec deux piles.)</p></div>", "starter": "def fileVide():\n    \"\"\"Renvoie une nouvelle file vide.\"\"\"\n    pass\n\n\ndef estVide(F):\n    \"\"\"True si F est vide.\"\"\"\n    pass\n\n\ndef enfiler(F, x):\n    \"\"\"Ajoute x à la queue de F.\"\"\"\n    pass\n\n\ndef defiler(F):\n    \"\"\"Retire et renvoie l'élément de tête de F. Lève IndexError si F est vide.\"\"\"\n    pass\n\n\ndef taille(F):\n    \"\"\"Nombre d'éléments de F.\"\"\"\n    pass\n\n\nF = fileVide()\nenfiler(F, \"a\")\nenfiler(F, \"b\")\nenfiler(F, \"c\")\nprint(defiler(F))\nprint(taille(F))\n", "tests": "\nF = fileVide()\negal(\"une file neuve est vide\", lambda: estVide(F), True)\negal(\"taille 0\", lambda: taille(F), 0)\nenfiler(F, 1); enfiler(F, 2); enfiler(F, 3)\negal(\"après 3 enfiler : pas vide\", lambda: estVide(F), False)\negal(\"taille 3\", lambda: taille(F), 3)\negal(\"defiler(F) renvoie 1 (premier arrivé)\", lambda: defiler(F), 1)\negal(\"taille 2\", lambda: taille(F), 2)\nenfiler(F, 4)\negal(\"defiler(F) renvoie 2\", lambda: defiler(F), 2)\negal(\"defiler(F) renvoie 3\", lambda: defiler(F), 3)\negal(\"defiler(F) renvoie 4\", lambda: defiler(F), 4)\negal(\"la file est vide\", lambda: estVide(F), True)\nleve(\"defiler(F) sur file vide lève IndexError\", lambda: defiler(F), IndexError)\n_a, _b = fileVide(), fileVide()\nenfiler(_a, \"x\")\negal(\"deux files sont indépendantes\", lambda: estVide(_b), True)\negal(\"fonctionne avec fabrique/contenu_file (mêmes conventions)\", lambda: (lambda F: [defiler(F) for _ in range(taille(F))])(\n    (lambda F: (enfiler(F, 7), enfiler(F, 8), enfiler(F, 9), F)[-1])(fileVide())), [7, 8, 9])\n", "aide_code": null, "visuel": null, "indice_html": "<p><code>estVide</code>, <code>enfiler</code>, <code>defiler</code>, <code>taille</code> : chaque fonction est courte (une ou deux lignes). <code>defiler</code> doit vérifier que <code>F</code> n&#x27;est pas vide *avant* d&#x27;appeler <code>F.pop(0)</code>, sinon Python lèverait sa propre erreur au lieu de ton <code>IndexError</code>.</p>", "solution": "def fileVide():\n    \"\"\"Renvoie une nouvelle file vide.\"\"\"\n    return []\n\n\ndef estVide(F):\n    \"\"\"True si F est vide.\"\"\"\n    return len(F) == 0\n\n\ndef enfiler(F, x):\n    \"\"\"Ajoute x à la queue de F.\"\"\"\n    F.append(x)\n\n\ndef defiler(F):\n    \"\"\"Retire et renvoie l'élément de tête de F. Lève IndexError si F est vide.\"\"\"\n    if estVide(F):\n        raise IndexError(\"defiler : file vide\")\n    return F.pop(0)\n\n\ndef taille(F):\n    \"\"\"Nombre d'éléments de F.\"\"\"\n    return len(F)\n\n\nF = fileVide()\nenfiler(F, \"a\")\nenfiler(F, \"b\")\nenfiler(F, \"c\")\nprint(defiler(F))\nprint(taille(F))\n", "solution_html": "<span class=\"k\">def</span> <span class=\"f\">fileVide</span>():\n    <span class=\"s\">&quot;&quot;&quot;Renvoie une nouvelle file vide.&quot;&quot;&quot;</span>\n    <span class=\"k\">return</span> []\n\n\n<span class=\"k\">def</span> <span class=\"f\">estVide</span>(F):\n    <span class=\"s\">&quot;&quot;&quot;True si F est vide.&quot;&quot;&quot;</span>\n    <span class=\"k\">return</span> <span class=\"b\">len</span>(F) == <span class=\"n\">0</span>\n\n\n<span class=\"k\">def</span> <span class=\"f\">enfiler</span>(F, x):\n    <span class=\"s\">&quot;&quot;&quot;Ajoute x à la queue de F.&quot;&quot;&quot;</span>\n    F.<span class=\"f\">append</span>(x)\n\n\n<span class=\"k\">def</span> <span class=\"f\">defiler</span>(F):\n    <span class=\"s\">&quot;&quot;&quot;Retire et renvoie l&#x27;élément de tête de F. Lève IndexError si F est vide.&quot;&quot;&quot;</span>\n    <span class=\"k\">if</span> <span class=\"f\">estVide</span>(F):\n        <span class=\"k\">raise</span> <span class=\"f\">IndexError</span>(<span class=\"s\">&quot;defiler : file vide&quot;</span>)\n    <span class=\"k\">return</span> F.<span class=\"f\">pop</span>(<span class=\"n\">0</span>)\n\n\n<span class=\"k\">def</span> <span class=\"f\">taille</span>(F):\n    <span class=\"s\">&quot;&quot;&quot;Nombre d&#x27;éléments de F.&quot;&quot;&quot;</span>\n    <span class=\"k\">return</span> <span class=\"b\">len</span>(F)\n\n\nF = <span class=\"f\">fileVide</span>()\n<span class=\"f\">enfiler</span>(F, <span class=\"s\">&quot;a&quot;</span>)\n<span class=\"f\">enfiler</span>(F, <span class=\"s\">&quot;b&quot;</span>)\n<span class=\"f\">enfiler</span>(F, <span class=\"s\">&quot;c&quot;</span>)\n<span class=\"b\">print</span>(<span class=\"f\">defiler</span>(<span class=\"f\">F</span>))\n<span class=\"b\">print</span>(<span class=\"f\">taille</span>(F))\n", "notes_html": "<p><strong>Correction du problème POO signalé par Amara</strong> : cet exercice demandait auparavant d&#x27;écrire une <code>class File</code> — trop tôt, la POO n&#x27;est que le premier chapitre de l&#x27;année et n&#x27;a pas encore été vue. Version corrigée : cinq fonctions libres sur une liste Python, exactement le vocabulaire du cours (<code>pileVide</code>/<code>empiler</code>/<code>depiler</code> deviennent ici <code>fileVide</code>/<code>enfiler</code>/<code>defiler</code>). La classe <code>File</code> utilisée à partir de l&#x27;exercice 2 reste fournie par le prélude (jamais montrée aux élèves) : ils ne font qu&#x27;appeler ses méthodes (<code>f.enfiler(...)</code>), ce qui ne suppose aucune connaissance de la syntaxe <code>class</code>.<br>Le test d&#x27;indépendance (<code>_a</code>/<code>_b</code>) attrape l&#x27;erreur classique <code>return []</code> partagée par erreur (rare en Python, mais on vérifie que chaque appel à <code>fileVide()</code> crée bien une nouvelle liste).</p>"}, {"id": "ex2", "kind": "exercice", "titre": "Distribuer les cartes", "abbr": "E2", "enonce_html": "<p>Écris <code>distribuer(paquet)</code> qui reçoit une liste de cartes (déjà mélangée) et renvoie <strong>deux files</strong> <code>(f1, f2)</code> : la carte d&#x27;indice pair va à <code>f1</code>, la carte d&#x27;indice impair à <code>f2</code>. Chaque file doit contenir les cartes <strong>dans l&#x27;ordre du paquet</strong> (la première du paquet est en tête de <code>f1</code>).</p>\n<p>Une classe <code>File</code> est fournie pour la suite du TP (mêmes méthodes qu&#x27;à l&#x27;exercice 1, avec <code>.enfiler(x)</code>, <code>.defiler()</code>, <code>.est_vide()</code>, <code>.taille()</code>) : tu peux l&#x27;utiliser sans la connaître en détail, un peu comme tu utilises déjà <code>liste.append(x)</code>.</p>", "starter": "def distribuer(paquet):\n    \"\"\"Renvoie (f1, f2) : cartes d'indice pair dans f1, d'indice impair dans f2 (ordre conservé).\"\"\"\n    pass\n\n\npaquet = melanger(creer_paquet(), 42)\nf1, f2 = distribuer(paquet)\nprint(\"Cartes de J1 :\", [nom_carte(c) for c in contenu_file(f1)])\nprint(\"Taille J1 / J2 :\", f1.taille(), f2.taille())\n", "tests": "\n_p = melanger(creer_paquet(), 1)\n_f1, _f2 = distribuer(_p)\negal(\"J1 a 26 cartes\", lambda: _f1.taille(), 26)\negal(\"J2 a 26 cartes\", lambda: _f2.taille(), 26)\negal(\"J1 reçoit les cartes d'indice pair, dans l'ordre\", lambda: contenu_file(_f1), _p[0::2])\negal(\"J2 reçoit les cartes d'indice impair, dans l'ordre\", lambda: contenu_file(_f2), _p[1::2])\negal(\"avec 4 cartes : 2 + 2\", lambda: [x.taille() for x in distribuer([(2, \"♠\"), (3, \"♠\"), (4, \"♠\"), (5, \"♠\")])], [2, 2])\negal(\"paquet vide : deux files vides\", lambda: [x.est_vide() for x in distribuer([])], [True, True])\n", "aide_code": null, "visuel": null, "indice_html": "<p><code>enumerate(paquet)</code> te donne à la fois l&#x27;indice <code>i</code> et la carte. Le test <code>i % 2 == 0</code> sépare les cartes d&#x27;indice pair des impaires.</p>", "solution": "def distribuer(paquet):\n    \"\"\"Renvoie (f1, f2) : cartes d'indice pair dans f1, d'indice impair dans f2 (ordre conservé).\"\"\"\n    f1 = File()\n    f2 = File()\n    for i, carte in enumerate(paquet):\n        if i % 2 == 0:\n            f1.enfiler(carte)\n        else:\n            f2.enfiler(carte)\n    return f1, f2\n\n\npaquet = melanger(creer_paquet(), 42)\nf1, f2 = distribuer(paquet)\nprint(\"Cartes de J1 :\", [nom_carte(c) for c in contenu_file(f1)])\nprint(\"Taille J1 / J2 :\", f1.taille(), f2.taille())\n", "solution_html": "<span class=\"k\">def</span> <span class=\"f\">distribuer</span>(paquet):\n    <span class=\"s\">&quot;&quot;&quot;Renvoie (f1, f2) : cartes d&#x27;indice pair dans f1, d&#x27;indice impair dans f2 (ordre conservé).&quot;&quot;&quot;</span>\n    f1 = <span class=\"f\">File</span>()\n    f2 = <span class=\"f\">File</span>()\n    <span class=\"k\">for</span> i, <span class=\"f\">carte</span> <span class=\"k\">in</span> <span class=\"b\">enumerate</span>(paquet):\n        <span class=\"k\">if</span> i % <span class=\"n\">2</span> == <span class=\"n\">0</span>:\n            f1.<span class=\"f\">enfiler</span>(carte)\n        <span class=\"k\">else</span>:\n            f2.<span class=\"f\">enfiler</span>(carte)\n    <span class=\"k\">return</span> f1, f2\n\n\npaquet = <span class=\"f\">melanger</span>(<span class=\"f\">creer_paquet</span>(), <span class=\"n\">42</span>)\nf1, f2 = <span class=\"f\">distribuer</span>(<span class=\"f\">paquet</span>)\n<span class=\"b\">print</span>(<span class=\"s\">&quot;Cartes de J1 :&quot;</span>, [<span class=\"f\">nom_carte</span>(c) <span class=\"k\">for</span> c <span class=\"k\">in</span> <span class=\"f\">contenu_file</span>(<span class=\"f\">f1</span>)])\n<span class=\"b\">print</span>(<span class=\"s\">&quot;Taille J1 / J2 :&quot;</span>, f1.<span class=\"f\">taille</span>(), f2.<span class=\"f\">taille</span>())\n", "notes_html": "<p>Les tests vérifient l&#x27;ordre (pas seulement les effectifs) : une distribution « par paquets de 26 » échoue.</p>"}, {"id": "ex3", "kind": "exercice", "titre": "Un tour, sans bataille", "abbr": "E3", "enonce_html": "<p>On construit <code>un_tour</code> en deux temps : ici, le cas <strong>simple</strong>, sans égalité. Tu géreras la bataille dans l&#x27;exercice suivant.</p>\n<p>Écris <code>un_tour_simple(f1, f2)</code> qui joue un tour et renvoie <code>1</code> si J1 remporte le tour, <code>2</code> sinon. <strong>On suppose ici que les deux cartes défilées n&#x27;ont jamais la même valeur</strong> (donc jamais de bataille à gérer).</p>\n<p>Plan :</p>\n<ol><li>chaque joueur défile une carte (<code>f1.defiler()</code>, <code>f2.defiler()</code>) ;</li><li>compare les deux valeurs (<code>carte[0]</code>) ;</li><li>le gagnant enfile <strong>sa propre carte d&#x27;abord</strong>, puis celle de l&#x27;adversaire ;</li><li>renvoie <code>1</code> ou <code>2</code>.</li></ol>\n<p>Tu peux t&#x27;aider de <code>fabrique([...])</code> et <code>contenu_file(f)</code> pour tester à la main.</p>", "starter": "def un_tour_simple(f1, f2):\n    \"\"\"Joue un tour (SANS bataille : les deux cartes ont des valeurs différentes).\n    Renvoie 1 si J1 gagne le tour, 2 sinon.\"\"\"\n    pass\n\n\n# Essai : J1 a 10♠ ; J2 a 5♦\nf1 = fabrique([(10, \"♠\")])\nf2 = fabrique([(5, \"♦\")])\nprint(un_tour_simple(f1, f2))\nprint([nom_carte(c) for c in contenu_file(f1)])\nprint([nom_carte(c) for c in contenu_file(f2)])\n", "tests": "\n_a, _b = fabrique([(10, \"♠\"), (2, \"♥\")]), fabrique([(5, \"♦\"), (9, \"♣\")])\negal(\"J1 gagne (10 > 5) -> renvoie 1\", lambda: un_tour_simple(_a, _b), 1)\negal(\"... J1 enfile SA carte (10♠) puis celle de J2 (5♦)\", lambda: contenu_file(_a), [(2, \"♥\"), (10, \"♠\"), (5, \"♦\")])\negal(\"... J2 garde sa carte restante\", lambda: contenu_file(_b), [(9, \"♣\")])\n\n_a, _b = fabrique([(3, \"♠\"), (8, \"♠\")]), fabrique([(9, \"♥\"), (2, \"♣\")])\negal(\"J2 gagne (9 > 3) -> renvoie 2\", lambda: un_tour_simple(_a, _b), 2)\negal(\"... J2 enfile SA carte (9♥) puis celle de J1 (3♠)\", lambda: contenu_file(_b), [(2, \"♣\"), (9, \"♥\"), (3, \"♠\")])\negal(\"... J1 garde sa carte restante\", lambda: contenu_file(_a), [(8, \"♠\")])\n\n_a, _b = fabrique([(14, \"♠\")]), fabrique([(2, \"♦\")])\negal(\"l'As (14) bat le 2\", lambda: un_tour_simple(_a, _b), 1)\n_a, _b = fabrique([(2, \"♠\")]), fabrique([(14, \"♦\")])\negal(\"le 2 perd contre l'As\", lambda: un_tour_simple(_a, _b), 2)\n", "aide_code": null, "visuel": null, "indice_html": "<p>Pas de boucle nécessaire ici : une seule comparaison suffit. <code>f1.defiler()</code> puis <code>f2.defiler()</code>, tu compares <code>c1[0]</code> et <code>c2[0]</code>, et le gagnant enfile <strong>sa</strong> carte avant celle de l&#x27;adversaire.</p>", "solution": "def un_tour_simple(f1, f2):\n    \"\"\"Joue un tour (SANS bataille : les deux cartes ont des valeurs différentes).\n    Renvoie 1 si J1 gagne le tour, 2 sinon.\"\"\"\n    c1 = f1.defiler()\n    c2 = f2.defiler()\n    if c1[0] > c2[0]:\n        f1.enfiler(c1)\n        f1.enfiler(c2)\n        return 1\n    else:\n        f2.enfiler(c2)\n        f2.enfiler(c1)\n        return 2\n\n\n# Essai : J1 a 10♠ ; J2 a 5♦\nf1 = fabrique([(10, \"♠\")])\nf2 = fabrique([(5, \"♦\")])\nprint(un_tour_simple(f1, f2))\nprint([nom_carte(c) for c in contenu_file(f1)])\nprint([nom_carte(c) for c in contenu_file(f2)])\n", "solution_html": "<span class=\"k\">def</span> <span class=\"f\">un_tour_simple</span>(f1, f2):\n    <span class=\"s\">&quot;&quot;&quot;Joue un tour (SANS bataille : les deux cartes ont des valeurs différentes).\n    Renvoie 1 si J1 gagne le tour, 2 sinon.&quot;&quot;&quot;</span>\n    c1 = f1.<span class=\"f\">defiler</span>()\n    c2 = f2.<span class=\"f\">defiler</span>()\n    <span class=\"k\">if</span> c1[<span class=\"n\">0</span>] &gt; c2[<span class=\"n\">0</span>]:\n        f1.<span class=\"f\">enfiler</span>(c1)\n        f1.<span class=\"f\">enfiler</span>(c2)\n        <span class=\"k\">return</span> <span class=\"n\">1</span>\n    <span class=\"k\">else</span>:\n        f2.<span class=\"f\">enfiler</span>(c2)\n        f2.<span class=\"f\">enfiler</span>(c1)\n        <span class=\"k\">return</span> <span class=\"n\">2</span>\n\n\n<span class=\"c\"># Essai : J1 a 10♠ ; J2 a 5♦\nf1 = fabrique([(10, &quot;♠&quot;)])\nf2 = fabrique([(5, &quot;♦&quot;)])\nprint(un_tour_simple(f1, f2))\nprint([nom_carte(c) for c in contenu_file(f1)])\nprint([nom_carte(c) for c in contenu_file(f2)])\n</span>", "notes_html": "<p>Étape intermédiaire ajoutée pour isoler la seule difficulté réellement nouvelle (la comparaison + la règle d&#x27;enfilage « sa carte d&#x27;abord ») avant d&#x27;y superposer, dans l&#x27;exercice suivant, la gestion de l&#x27;égalité et de la bataille. Sans cette étape, l&#x27;exercice suivant cumulait trop de difficultés à la fois (boucle, égalité, cas des joueurs à sec, ordre d&#x27;enfilage) pour une classe qui découvre encore la programmation.</p>"}, {"id": "ex4", "kind": "exercice", "titre": "Un tour, avec bataille", "abbr": "E4", "enonce_html": "<p>Tu as déjà écrit <code>un_tour_simple</code>, qui compare deux cartes de valeurs différentes. Ici, tu écris <code>un_tour</code> au complet : <strong>il ne reste qu&#x27;à gérer l&#x27;égalité</strong>, c&#x27;est-à-dire la bataille (voir les règles plus haut). Renvoie <code>1</code> si J1 remporte le tour, <code>2</code> sinon. On suppose que <strong>les deux files ne sont pas vides</strong> quand la fonction est appelée.</p>\n<p>Plan conseillé :</p>\n<ol><li>un <code>pot</code> (liste) qui contient les cartes jouées ;</li><li>une boucle : chaque joueur défile une carte, on les ajoute au pot, on compare les valeurs ;</li><li>en cas d&#x27;égalité, on rejoue — sauf si un joueur n&#x27;a plus de cartes ;</li><li>le gagnant enfile tout le pot : pour chaque paire <code>(carte de J1, carte de J2)</code> du pot, <strong>sa carte d&#x27;abord</strong>, puis celle de l&#x27;adversaire (même règle qu&#x27;à l&#x27;exercice précédent).</li></ol>\n<p>Tu peux t&#x27;aider de <code>fabrique([...])</code> et <code>contenu_file(f)</code> pour tester à la main.</p>", "starter": "def un_tour(f1, f2):\n    \"\"\"Joue un tour (avec bataille éventuelle). Renvoie 1 si J1 gagne le tour, 2 sinon.\"\"\"\n    pass\n\n\n# Essai : J1 a 10♠ puis 2♥ ; J2 a 5♦ puis 9♣\nf1 = fabrique([(10, \"♠\"), (2, \"♥\")])\nf2 = fabrique([(5, \"♦\"), (9, \"♣\")])\nprint(un_tour(f1, f2))\nprint([nom_carte(c) for c in contenu_file(f1)])\nprint([nom_carte(c) for c in contenu_file(f2)])\n", "tests": "\n_a, _b = fabrique([(10, \"♠\"), (2, \"♥\")]), fabrique([(5, \"♦\"), (9, \"♣\")])\negal(\"tour simple : J1 gagne (10 > 5) -> renvoie 1\", lambda: un_tour(_a, _b), 1)\negal(\"... J1 enfile 10♠ puis 5♦ à la queue\", lambda: contenu_file(_a), [(2, \"♥\"), (10, \"♠\"), (5, \"♦\")])\negal(\"... J2 garde 9♣\", lambda: contenu_file(_b), [(9, \"♣\")])\n\n_a, _b = fabrique([(3, \"♠\"), (8, \"♠\")]), fabrique([(9, \"♥\"), (2, \"♣\")])\negal(\"J2 gagne (9 > 3) -> renvoie 2\", lambda: un_tour(_a, _b), 2)\negal(\"... J2 enfile d'abord SA carte (9♥) puis celle de J1 (3♠)\", lambda: contenu_file(_b), [(2, \"♣\"), (9, \"♥\"), (3, \"♠\")])\negal(\"... J1 garde 8♠\", lambda: contenu_file(_a), [(8, \"♠\")])\n\n_a = fabrique([(7, \"♠\"), (12, \"♥\"), (2, \"♣\")])\n_b = fabrique([(7, \"♦\"), (4, \"♠\"), (9, \"♥\")])\negal(\"bataille : J1 gagne au 2e affrontement (12 > 4) -> renvoie 1\", lambda: un_tour(_a, _b), 1)\negal(\"... J1 récupère tout le pot (sa carte d'abord dans chaque paire)\",\n     lambda: contenu_file(_a), [(2, \"♣\"), (7, \"♠\"), (7, \"♦\"), (12, \"♥\"), (4, \"♠\")])\negal(\"... J2 garde 9♥\", lambda: contenu_file(_b), [(9, \"♥\")])\n\n_a = fabrique([(7, \"♠\"), (5, \"♥\")])\n_b = fabrique([(7, \"♦\")])\negal(\"bataille : J2 n'a plus de carte -> J1 gagne le pot (renvoie 1)\", lambda: un_tour(_a, _b), 1)\negal(\"... J1 : 5♥ puis le pot\", lambda: contenu_file(_a), [(5, \"♥\"), (7, \"♠\"), (7, \"♦\")])\negal(\"... J2 n'a plus rien\", lambda: _b.est_vide(), True)\n\n_a = fabrique([(7, \"♠\")])\n_b = fabrique([(7, \"♦\"), (5, \"♥\")])\negal(\"bataille : J1 n'a plus de carte -> J2 gagne le pot (renvoie 2)\", lambda: un_tour(_a, _b), 2)\negal(\"... J2 : 5♥ puis le pot (sa carte 7♦ d'abord)\", lambda: contenu_file(_b), [(5, \"♥\"), (7, \"♦\"), (7, \"♠\")])\n\n_a = fabrique([(5, \"♠\"), (5, \"♥\"), (5, \"♦\"), (2, \"♠\")])\n_b = fabrique([(5, \"♣\"), (5, \"♠\"), (5, \"♥\"), (9, \"♠\")])\negal(\"double bataille : J2 gagne au 4e affrontement -> renvoie 2\", lambda: un_tour(_a, _b), 2)\negal(\"... J2 récupère les 8 cartes du pot, sa carte d'abord dans chaque paire\", lambda: contenu_file(_b),\n     [(5, \"♣\"), (5, \"♠\"), (5, \"♠\"), (5, \"♥\"), (5, \"♥\"), (5, \"♦\"), (9, \"♠\"), (2, \"♠\")])\negal(\"... et J1 n'a plus rien\", lambda: _a.est_vide(), True)\n", "aide_code": null, "visuel": null, "indice_html": "<p>Utilise une liste <code>pot</code> pour accumuler les cartes jouées. La boucle continue tant que les deux cartes défilées sont égales (bataille) : pense à vérifier qu&#x27;aucun des deux joueurs ne s&#x27;est retrouvé sans carte *pendant* la bataille, avant de redéfiler.</p>", "solution": "def un_tour(f1, f2):\n    \"\"\"Joue un tour (avec bataille éventuelle). Renvoie 1 si J1 gagne le tour, 2 sinon.\"\"\"\n    pot = []\n    while True:\n        c1 = f1.defiler()\n        c2 = f2.defiler()\n        pot.append(c1)\n        pot.append(c2)\n        if c1[0] > c2[0]:\n            gagnant = 1\n            break\n        if c2[0] > c1[0]:\n            gagnant = 2\n            break\n        # égalité : bataille\n        if f1.est_vide():\n            gagnant = 2\n            break\n        if f2.est_vide():\n            gagnant = 1\n            break\n    fg = f1 if gagnant == 1 else f2\n    for k in range(0, len(pot), 2):\n        carte1, carte2 = pot[k], pot[k + 1]\n        if gagnant == 1:\n            fg.enfiler(carte1)\n            fg.enfiler(carte2)\n        else:\n            fg.enfiler(carte2)\n            fg.enfiler(carte1)\n    return gagnant\n\n\n# Essai : J1 a 10♠ puis 2♥ ; J2 a 5♦ puis 9♣\nf1 = fabrique([(10, \"♠\"), (2, \"♥\")])\nf2 = fabrique([(5, \"♦\"), (9, \"♣\")])\nprint(un_tour(f1, f2))\nprint([nom_carte(c) for c in contenu_file(f1)])\nprint([nom_carte(c) for c in contenu_file(f2)])\n", "solution_html": "<span class=\"k\">def</span> <span class=\"f\">un_tour</span>(f1, f2):\n    <span class=\"s\">&quot;&quot;&quot;Joue un tour (avec bataille éventuelle). Renvoie 1 si J1 gagne le tour, 2 sinon.&quot;&quot;&quot;</span>\n    pot = []\n    <span class=\"k\">while</span> <span class=\"k\">True</span>:\n        c1 = f1.<span class=\"f\">defiler</span>()\n        c2 = f2.<span class=\"f\">defiler</span>()\n        pot.<span class=\"f\">append</span>(c1)\n        pot.<span class=\"f\">append</span>(c2)\n        <span class=\"k\">if</span> c1[<span class=\"n\">0</span>] &gt; c2[<span class=\"n\">0</span>]:\n            gagnant = <span class=\"n\">1</span>\n            <span class=\"k\">break</span>\n        <span class=\"k\">if</span> c2[<span class=\"n\">0</span>] &gt; c1[<span class=\"n\">0</span>]:\n            gagnant = <span class=\"n\">2</span>\n            <span class=\"k\">break</span>\n        <span class=\"c\"># égalité : bataille\n        if f1.est_vide():\n            gagnant = 2\n            break\n        if f2.est_vide():\n            gagnant = 1\n            break\n    fg = f1 if gagnant == 1 else f2\n    for k in range(0, len(pot), 2):\n        carte1, carte2 = pot[k], pot[k + 1]\n        if gagnant == 1:\n            fg.enfiler(carte1)\n            fg.enfiler(carte2)\n        else:\n            fg.enfiler(carte2)\n            fg.enfiler(carte1)\n    return gagnant\n\n\n# Essai : J1 a 10♠ puis 2♥ ; J2 a 5♦ puis 9♣\nf1 = fabrique([(10, &quot;♠&quot;), (2, &quot;♥&quot;)])\nf2 = fabrique([(5, &quot;♦&quot;), (9, &quot;♣&quot;)])\nprint(un_tour(f1, f2))\nprint([nom_carte(c) for c in contenu_file(f1)])\nprint([nom_carte(c) for c in contenu_file(f2)])\n</span>", "notes_html": "<p>Le cas « joueur sans carte après égalité » est le plus souvent oublié. La priorité J1 puis J2 dans ce cas est un choix d&#x27;énoncé, précisé dans les règles.<br>Les élèves qui défilent une seule carte par joueur dans l&#x27;égalité (au lieu de recommencer un affrontement complet) trouvent des résultats faux : les tests de « bataille » et « double bataille » les attrapent.</p>"}, {"id": "ex5", "kind": "exercice", "titre": "Une partie complète", "abbr": "E5", "enonce_html": "<p>Écris <code>partie(graine, max_tours=1000)</code> qui :</p>\n<ol><li>crée un paquet, le <strong>mélange</strong> avec la <code>graine</code>, le <strong>distribue</strong> ;</li><li>joue des tours <strong>tant qu&#x27;aucun joueur n&#x27;a perdu</strong>, <strong>et</strong> tant que le nombre de tours est inférieur à <code>max_tours</code> ;</li><li>renvoie le couple <code>(gagnant, nb_tours)</code> où <code>gagnant</code> vaut <code>1</code>, <code>2</code>, ou <code>0</code> si la limite de tours a été atteinte sans vainqueur.</li></ol>\n<p>Ta fonction fait appel à <code>distribuer</code> et <code>un_tour</code> que tu as écrites aux exercices précédents.</p>\n<div class=\"adm adm-attention\"><p class=\"adm-titre\">Pourquoi <code>max_tours</code> ?</p><p>Rien ne garantit qu&#x27;une partie se termine : certaines sont très longues et, en théorie, une partie pourrait tourner en boucle (les mêmes cartes qui circulent). Sans ce garde-fou, ta boucle <code>while</code> pourrait ne jamais s&#x27;arrêter. On dit que la <strong>terminaison</strong> n&#x27;est pas garantie : on impose donc un nombre maximal de tours.</p></div>\n<p>Compare tes résultats pour les graines <code>0</code>, <code>1</code>, <code>2</code>… avec ceux de tes voisins : ils doivent être identiques.</p>", "starter": "def partie(graine, max_tours=1000):\n    \"\"\"Joue une partie. Renvoie (gagnant, nb_tours) avec gagnant = 1, 2 ou 0 (limite atteinte).\"\"\"\n    pass\n\n\nfor graine in range(5):\n    print(graine, partie(graine))\n", "tests": "\negal(\"partie(0)\", lambda: partie(0), (1, 189))\negal(\"partie(1)\", lambda: partie(1), (2, 313))\negal(\"partie(2)\", lambda: partie(2), (2, 799))\negal(\"partie(3)\", lambda: partie(3), (1, 478))\negal(\"partie(4)\", lambda: partie(4), (2, 121))\negal(\"partie(0, 10) : limite de 10 tours atteinte -> (0, 10)\", lambda: partie(0, 10), (0, 10))\nvrai(\"le gagnant est 0, 1 ou 2\", lambda: partie(7)[0] in (0, 1, 2))\n", "aide_code": "def distribuer(paquet):\n    \"\"\"Renvoie (f1, f2) : cartes d'indice pair dans f1, d'indice impair dans f2 (ordre conservé).\"\"\"\n    f1 = File()\n    f2 = File()\n    for i, carte in enumerate(paquet):\n        if i % 2 == 0:\n            f1.enfiler(carte)\n        else:\n            f2.enfiler(carte)\n    return f1, f2\n\ndef un_tour(f1, f2):\n    \"\"\"Joue un tour (avec bataille éventuelle). Renvoie 1 si J1 gagne le tour, 2 sinon.\"\"\"\n    pot = []\n    while True:\n        c1 = f1.defiler()\n        c2 = f2.defiler()\n        pot.append(c1)\n        pot.append(c2)\n        if c1[0] > c2[0]:\n            gagnant = 1\n            break\n        if c2[0] > c1[0]:\n            gagnant = 2\n            break\n        # égalité : bataille\n        if f1.est_vide():\n            gagnant = 2\n            break\n        if f2.est_vide():\n            gagnant = 1\n            break\n    fg = f1 if gagnant == 1 else f2\n    for k in range(0, len(pot), 2):\n        carte1, carte2 = pot[k], pot[k + 1]\n        if gagnant == 1:\n            fg.enfiler(carte1)\n            fg.enfiler(carte2)\n        else:\n            fg.enfiler(carte2)\n            fg.enfiler(carte1)\n    return gagnant", "visuel": null, "indice_html": "<p><code>partie</code> ne fait qu&#x27;enchaîner des appels à <code>distribuer</code> puis <code>un_tour</code> en boucle, avec un compteur de tours borné par <code>max_tours</code>. La partie s&#x27;arrête dès que l&#x27;une des deux files est vide.</p>", "solution": "def partie(graine, max_tours=1000):\n    \"\"\"Joue une partie. Renvoie (gagnant, nb_tours) avec gagnant = 1, 2 ou 0 (limite atteinte).\"\"\"\n    paquet = melanger(creer_paquet(), graine)\n    f1, f2 = distribuer(paquet)\n    nb_tours = 0\n    while not f1.est_vide() and not f2.est_vide() and nb_tours < max_tours:\n        un_tour(f1, f2)\n        nb_tours += 1\n    if f1.est_vide():\n        return (2, nb_tours)\n    if f2.est_vide():\n        return (1, nb_tours)\n    return (0, nb_tours)\n\n\nfor graine in range(5):\n    print(graine, partie(graine))\n", "solution_html": "<span class=\"k\">def</span> <span class=\"f\">partie</span>(graine, max_tours=<span class=\"n\">1000</span>):\n    <span class=\"s\">&quot;&quot;&quot;Joue une partie. Renvoie (gagnant, nb_tours) avec gagnant = 1, 2 ou 0 (limite atteinte).&quot;&quot;&quot;</span>\n    paquet = <span class=\"f\">melanger</span>(<span class=\"f\">creer_paquet</span>(), graine)\n    f1, f2 = <span class=\"f\">distribuer</span>(paquet)\n    nb_tours = <span class=\"n\">0</span>\n    <span class=\"k\">while</span> <span class=\"k\">not</span> f1.<span class=\"f\">est_vide</span>() <span class=\"k\">and</span> <span class=\"k\">not</span> f2.<span class=\"f\">est_vide</span>() <span class=\"k\">and</span> nb_tours &lt; max_tours:\n        <span class=\"f\">un_tour</span>(f1, f2)\n        nb_tours += <span class=\"n\">1</span>\n    <span class=\"k\">if</span> f1.<span class=\"f\">est_vide</span>():\n        <span class=\"k\">return</span> (<span class=\"n\">2</span>, nb_tours)\n    <span class=\"k\">if</span> f2.<span class=\"f\">est_vide</span>():\n        <span class=\"k\">return</span> (<span class=\"n\">1</span>, <span class=\"f\">nb_tours</span>)\n    <span class=\"k\">return</span> (<span class=\"n\">0</span>, nb_tours)\n\n\n<span class=\"k\">for</span> <span class=\"f\">graine</span> <span class=\"k\">in</span> <span class=\"b\">range</span>(<span class=\"n\">5</span>):\n    <span class=\"b\">print</span>(graine, <span class=\"f\">partie</span>(graine))\n", "notes_html": "<p>Les résultats sont déterministes grâce à <code>melanger(paquet, graine)</code> : chaque élève doit trouver exactement les mêmes couples <code>(gagnant, nb_tours)</code> pour une graine donnée, ce qui permet la comparaison entre binômes et la vérification rapide par le professeur.<br>Terminaison : la boucle <code>while</code> de <code>partie</code> est finie <strong>grâce à</strong> la condition <code>nb_tours &lt; max_tours</code> (variant : <code>max_tours - nb_tours</code>). Sans elle, on ne peut pas garantir la fin d&#x27;une partie (voir l&#x27;exercice 5).</p>"}, {"id": "ex6", "kind": "exercice", "titre": "Statistiques sur beaucoup de parties", "abbr": "E6", "enonce_html": "<p>Écris <code>statistiques(nb_parties)</code> qui joue les parties de graines <code>0, 1, …, nb_parties - 1</code> (avec <code>max_tours</code> par défaut) et renvoie le quadruplet <code>(victoires_J1, victoires_J2, non_terminees, moyenne_tours)</code> où <code>moyenne_tours</code> est le nombre moyen de tours <strong>des parties terminées</strong>.</p>\n<p>Lance-la avec <code>nb_parties = 200</code> puis réponds en commentaire :</p>\n<ol><li>Le premier joueur est-il avantagé ?</li><li>Combien de parties ne sont pas terminées au bout de 1000 tours ?</li><li>Modifie la valeur par défaut de <code>max_tours</code> : 300, puis 5000. Que deviennent les parties « non terminées » ? Étaient-elles infinies, ou seulement longues ?</li><li>Le nombre de configurations possibles des cartes est fini et le jeu est <strong>déterministe</strong>. Que peux-tu dire d&#x27;une partie qui ne se termine pas ?</li></ol>", "starter": "def statistiques(nb_parties):\n    \"\"\"Renvoie (victoires_J1, victoires_J2, non_terminees, moyenne_tours des parties terminées).\"\"\"\n    pass\n\n\nprint(statistiques(200))\n\n# Mes réponses :\n# 1) ...\n# 2) ...\n# 3) ...\n# 4) ...\n", "tests": "\negal(\"statistiques(30)[:3] (victoires J1, J2, parties non terminées)\", lambda: statistiques(30)[:3], (14, 15, 1))\negal(\"statistiques(30)[3] arrondi à l'unité (tours moyens)\", lambda: round(statistiques(30)[3]), 281)\negal(\"statistiques(0) : aucune partie\", lambda: statistiques(0)[:3], (0, 0, 0))\n", "aide_code": "def distribuer(paquet):\n    \"\"\"Renvoie (f1, f2) : cartes d'indice pair dans f1, d'indice impair dans f2 (ordre conservé).\"\"\"\n    f1 = File()\n    f2 = File()\n    for i, carte in enumerate(paquet):\n        if i % 2 == 0:\n            f1.enfiler(carte)\n        else:\n            f2.enfiler(carte)\n    return f1, f2\n\ndef un_tour(f1, f2):\n    \"\"\"Joue un tour (avec bataille éventuelle). Renvoie 1 si J1 gagne le tour, 2 sinon.\"\"\"\n    pot = []\n    while True:\n        c1 = f1.defiler()\n        c2 = f2.defiler()\n        pot.append(c1)\n        pot.append(c2)\n        if c1[0] > c2[0]:\n            gagnant = 1\n            break\n        if c2[0] > c1[0]:\n            gagnant = 2\n            break\n        # égalité : bataille\n        if f1.est_vide():\n            gagnant = 2\n            break\n        if f2.est_vide():\n            gagnant = 1\n            break\n    fg = f1 if gagnant == 1 else f2\n    for k in range(0, len(pot), 2):\n        carte1, carte2 = pot[k], pot[k + 1]\n        if gagnant == 1:\n            fg.enfiler(carte1)\n            fg.enfiler(carte2)\n        else:\n            fg.enfiler(carte2)\n            fg.enfiler(carte1)\n    return gagnant\n\ndef partie(graine, max_tours=1000):\n    \"\"\"Joue une partie. Renvoie (gagnant, nb_tours) avec gagnant = 1, 2 ou 0 (limite atteinte).\"\"\"\n    paquet = melanger(creer_paquet(), graine)\n    f1, f2 = distribuer(paquet)\n    nb_tours = 0\n    while not f1.est_vide() and not f2.est_vide() and nb_tours < max_tours:\n        un_tour(f1, f2)\n        nb_tours += 1\n    if f1.est_vide():\n        return (2, nb_tours)\n    if f2.est_vide():\n        return (1, nb_tours)\n    return (0, nb_tours)", "visuel": null, "indice_html": "<p><code>statistiques</code> appelle <code>partie(graine)</code> pour chaque graine de <code>0</code> à <code>nb_parties - 1</code>, et classe chaque résultat selon la valeur de <code>gagnant</code> (<code>1</code>, <code>2</code> ou <code>0</code>).</p>", "solution": "def statistiques(nb_parties):\n    \"\"\"Renvoie (victoires_J1, victoires_J2, non_terminees, moyenne_tours des parties terminées).\"\"\"\n    v1 = 0\n    v2 = 0\n    infinies = 0\n    total = 0\n    for graine in range(nb_parties):\n        gagnant, tours = partie(graine)\n        if gagnant == 1:\n            v1 += 1\n            total += tours\n        elif gagnant == 2:\n            v2 += 1\n            total += tours\n        else:\n            infinies += 1\n    terminees = v1 + v2\n    moyenne = total / terminees if terminees > 0 else 0\n    return (v1, v2, infinies, moyenne)\n\n\nprint(statistiques(200))\n\n# Mes réponses :\n# 1) Non : les victoires se répartissent à peu près équitablement (le mélange est aléatoire).\n# 2) Quelques parties seulement (de l'ordre de 1 %).\n# 3) Avec 300 tours beaucoup plus de parties sont « non terminées » ; avec 5000, plus aucune :\n#    elles étaient seulement longues, pas infinies.\n# 4) Il n'y a qu'un nombre fini de configurations possibles : si la partie ne se termine pas, elle repasse\n#    forcément par une configuration déjà vue, puis tourne en boucle indéfiniment (cycle).\n", "solution_html": "<span class=\"k\">def</span> <span class=\"f\">statistiques</span>(nb_parties):\n    <span class=\"s\">&quot;&quot;&quot;Renvoie (victoires_J1, victoires_J2, non_terminees, moyenne_tours des parties terminées).&quot;&quot;&quot;</span>\n    v1 = <span class=\"n\">0</span>\n    v2 = <span class=\"n\">0</span>\n    infinies = <span class=\"n\">0</span>\n    total = <span class=\"n\">0</span>\n    <span class=\"k\">for</span> <span class=\"f\">graine</span> <span class=\"k\">in</span> <span class=\"b\">range</span>(nb_parties):\n        gagnant, tours = <span class=\"f\">partie</span>(graine)\n        <span class=\"k\">if</span> gagnant == <span class=\"n\">1</span>:\n            v1 += <span class=\"n\">1</span>\n            total += tours\n        <span class=\"k\">elif</span> gagnant == <span class=\"n\">2</span>:\n            v2 += <span class=\"n\">1</span>\n            total += tours\n        <span class=\"k\">else</span>:\n            infinies += <span class=\"n\">1</span>\n    terminees = v1 + v2\n    moyenne = total / terminees <span class=\"k\">if</span> terminees &gt; <span class=\"n\">0</span> <span class=\"k\">else</span> <span class=\"n\">0</span>\n    <span class=\"k\">return</span> (v1, v2, infinies, <span class=\"f\">moyenne</span>)\n\n\n<span class=\"b\">print</span>(<span class=\"f\">statistiques</span>(<span class=\"n\">200</span>))\n\n<span class=\"c\"># Mes réponses :\n# 1) Non : les victoires se répartissent à peu près équitablement (le mélange est aléatoire).\n# 2) Quelques parties seulement (de l&#x27;ordre de 1 %).\n# 3) Avec 300 tours beaucoup plus de parties sont « non terminées » ; avec 5000, plus aucune :\n#    elles étaient seulement longues, pas infinies.\n# 4) Il n&#x27;y a qu&#x27;un nombre fini de configurations possibles : si la partie ne se termine pas, elle repasse\n#    forcément par une configuration déjà vue, puis tourne en boucle indéfiniment (cycle).\n</span>", "notes_html": "<p>Avec ces règles (le gagnant range sa carte avant celle de l&#x27;adversaire dans chaque paire), sur les graines 0 à 199 aucune partie ne boucle : la plus longue dure 1444 tours et seules 3 dépassent 1000 tours. Avec <code>max_tours = 300</code>, 86 parties sur 200 sont « non terminées » : bon support pour distinguer « longue » et « infinie ». Une règle de rangement « dans l&#x27;ordre de jeu » (carte de J1 toujours d&#x27;abord) fait au contraire boucler *toutes* les parties : variante intéressante pour le professeur si l&#x27;on veut illustrer un cycle d&#x27;états.<br>Argument théorique : le jeu est déterministe et n&#x27;a qu&#x27;un nombre fini de configurations ; une partie non terminée repasse donc forcément par une configuration déjà vue (cycle).</p>"}, {"id": "defiA", "kind": "defi", "titre": "Défi A – Une file avec deux piles", "abbr": "DA", "enonce_html": "<p>Une file peut être réalisée avec <strong>deux piles</strong> seulement (la classe <code>Pile</code> est fournie).</p>\n<ul><li>On <strong>enfile</strong> en empilant sur la pile <code>entree</code>.</li><li>On <strong>défile</strong> en dépilant la pile <code>sortie</code>. Si <code>sortie</code> est vide, on <strong>transvase d&#x27;abord</strong> tous les éléments de <code>entree</code> dans <code>sortie</code> (l&#x27;ordre est alors inversé : le premier arrivé se retrouve au sommet).</li></ul>\n<p>Écris la classe <code>FileDeuxPiles</code> avec les mêmes méthodes que <code>File</code> : <code>est_vide</code>, <code>enfiler</code>, <code>defiler</code> (<code>IndexError</code> si vide), <code>taille</code>.</p>\n<p><strong>Question</strong> : chaque élément est empilé au plus 2 fois et dépilé au plus 2 fois avant de sortir. Que peux-tu en déduire sur le <strong>coût moyen</strong> (amorti) d&#x27;un <code>enfiler</code> puis d&#x27;un <code>defiler</code> ? Compare avec <code>pop(0)</code>.</p>", "starter": "class FileDeuxPiles:\n    def __init__(self):\n        self.entree = Pile()\n        self.sortie = Pile()\n\n    def est_vide(self):\n        pass\n\n    def enfiler(self, x):\n        pass\n\n    def defiler(self):\n        pass\n\n    def taille(self):\n        pass\n", "tests": "\n_f = FileDeuxPiles()\negal(\"file neuve : vide, taille 0\", lambda: (_f.est_vide(), _f.taille()), (True, 0))\n_f.enfiler(1); _f.enfiler(2); _f.enfiler(3)\negal(\"après 3 enfiler : taille 3\", lambda: _f.taille(), 3)\negal(\"defiler() -> 1 (premier arrivé)\", lambda: _f.defiler(), 1)\n_f.enfiler(4)\negal(\"defiler() -> 2\", lambda: _f.defiler(), 2)\negal(\"defiler() -> 3\", lambda: _f.defiler(), 3)\negal(\"defiler() -> 4\", lambda: _f.defiler(), 4)\negal(\"file vide à nouveau\", lambda: _f.est_vide(), True)\nleve(\"defiler() sur file vide lève IndexError\", lambda: _f.defiler(), IndexError)\ndef _melange():\n    f = FileDeuxPiles()\n    ref = []\n    sortie = []\n    for i in range(40):\n        f.enfiler(i); ref.append(i)\n        if i % 3 == 2:\n            sortie.append((f.defiler(), ref.pop(0)))\n    return all(a == b for a, b in sortie) and f.taille() == len(ref)\nvrai(\"enfiler/defiler entrelacés se comportent comme une file\", _melange)\ndef _usage():\n    _ops[0] = 0\n    g = FileDeuxPiles(); g.enfiler(1); g.defiler()\n    return _ops[0] > 0\nvrai(\"ta file utilise bien des Pile\", _usage, \"Utilise la classe Pile pour stocker les éléments\")\n", "aide_code": null, "visuel": null, "indice_html": "<p><code>enfiler</code> empile sur <code>entree</code>. <code>defiler</code> : si <code>sortie</code> est vide, transvase <strong>tout</strong> <code>entree</code> dans <code>sortie</code> d&#x27;abord (l&#x27;ordre s&#x27;inverse), puis dépile <code>sortie</code>. Le transvasement ne doit se faire que quand <code>sortie</code> est vide, jamais à chaque appel.</p>", "solution": "class FileDeuxPiles:\n    def __init__(self):\n        self.entree = Pile()\n        self.sortie = Pile()\n\n    def est_vide(self):\n        return self.entree.est_vide() and self.sortie.est_vide()\n\n    def enfiler(self, x):\n        self.entree.empiler(x)\n\n    def defiler(self):\n        if self.sortie.est_vide():\n            while not self.entree.est_vide():\n                self.sortie.empiler(self.entree.depiler())\n        if self.sortie.est_vide():\n            raise IndexError(\"defiler : file vide\")\n        return self.sortie.depiler()\n\n    def taille(self):\n        return self.entree.taille() + self.sortie.taille()\n", "solution_html": "<span class=\"k\">class</span> FileDeuxPiles:\n    <span class=\"k\">def</span> <span class=\"f\">__init__</span>(self):\n        self.entree = <span class=\"f\">Pile</span>()\n        self.sortie = <span class=\"f\">Pile</span>()\n\n    <span class=\"k\">def</span> <span class=\"f\">est_vide</span>(self):\n        <span class=\"k\">return</span> self.entree.<span class=\"f\">est_vide</span>() <span class=\"k\">and</span> self.sortie.<span class=\"f\">est_vide</span>()\n\n    <span class=\"k\">def</span> <span class=\"f\">enfiler</span>(self, x):\n        self.entree.<span class=\"f\">empiler</span>(x)\n\n    <span class=\"k\">def</span> <span class=\"f\">defiler</span>(self):\n        <span class=\"k\">if</span> self.sortie.<span class=\"f\">est_vide</span>():\n            <span class=\"k\">while</span> <span class=\"k\">not</span> self.entree.<span class=\"f\">est_vide</span>():\n                self.sortie.<span class=\"f\">empiler</span>(self.entree.<span class=\"f\">depiler</span>())\n        <span class=\"k\">if</span> self.sortie.<span class=\"f\">est_vide</span>():\n            <span class=\"k\">raise</span> <span class=\"f\">IndexError</span>(<span class=\"s\">&quot;defiler : file vide&quot;</span>)\n        <span class=\"k\">return</span> self.sortie.<span class=\"f\">depiler</span>()\n\n    <span class=\"k\">def</span> <span class=\"f\">taille</span>(self):\n        <span class=\"k\">return</span> self.entree.<span class=\"f\">taille</span>() + self.sortie.<span class=\"f\">taille</span>()\n", "notes_html": "<p>Coût amorti : chaque élément subit au plus 2 empilements et 2 dépilements sur sa vie → <code>O(1)</code> amorti par opération, contre <code>O(n)</code> pour <code>pop(0)</code>. Les tests entrelacent enfilages et défilages pour attraper le transvasement fait à chaque défilement (erreur classique qui casse l&#x27;ordre).</p>"}, {"id": "defiB", "kind": "defi", "titre": "Défi B – « 6 qui prend » : les rangées sont des piles", "abbr": "DB", "enonce_html": "<p>Dans <strong>6 qui prend</strong>, quatre <strong>rangées</strong> de cartes (numérotées de 1 à 104) sont posées sur la table. Chaque rangée se comporte comme une <strong>pile</strong> : on ne regarde que sa <strong>dernière</strong> carte (le sommet), et quand la 6ᵉ carte arrive, le joueur <strong>ramasse les 5 cartes</strong>.</p>\n<p>Chaque carte vaut des <strong>têtes de bœuf</strong> (fonction <code>tetes(carte)</code> fournie : 1, 2, 3, 5 ou 7). On veut en ramasser le moins possible !</p>\n<p>Écris <code>placer(rangees, carte)</code> où <code>rangees</code> est une liste de 4 <code>Pile</code>. Règles (version simplifiée) :</p>\n<ol><li>La carte est posée sur la rangée dont le <strong>sommet est le plus grand parmi ceux qui sont inférieurs</strong> à la carte.</li><li>Si <strong>aucun</strong> sommet n&#x27;est inférieur (carte plus petite que tous), le joueur ramasse la <strong>rangée n°0</strong> et la carte devient la première carte de cette rangée (règle simplifiée).</li><li>Si la rangée choisie contient <strong>déjà 5 cartes</strong>, le joueur ramasse ces 5 cartes et la carte devient l&#x27;unique carte de la rangée.</li><li>La fonction renvoie le <strong>total de têtes de bœuf ramassées</strong> (0 si rien n&#x27;est ramassé).</li></ol>\n<p>Chaque rangée contient toujours au moins une carte.</p>", "starter": "def placer(rangees, carte):\n    \"\"\"Place carte dans une des 4 rangées (piles). Renvoie le nombre de têtes de bœuf ramassées.\"\"\"\n    pass\n\n\nrangees = [Pile() for _ in range(4)]\nfor i, c in enumerate([10, 20, 30, 40]):\n    rangees[i].empiler(c)\nprint(placer(rangees, 25), rangees)\n", "tests": "\ndef _r(*lignes):\n    rg = []\n    for l in lignes:\n        p = Pile()\n        for c in l:\n            p.empiler(c)\n        rg.append(p)\n    return rg\ndef _c(rg):\n    return [list(p._elts) for p in rg]\n_rg = _r([10], [20], [30], [40])\negal(\"25 se pose sur la rangée du 20 (plus grand sommet inférieur) : 0 tête\", lambda: placer(_rg, 25), 0)\negal(\"... rangée 1 = [20, 25]\", lambda: _c(_rg), [[10], [20, 25], [30], [40]])\negal(\"55 se pose sur la rangée du 40\", lambda: (placer(_rg, 55), _c(_rg)[3]), (0, [40, 55]))\n_rg = _r([22, 25, 30, 31, 34], [50], [60], [70])\negal(\"35 sur une rangée pleine : on ramasse 22(5)+25(2)+30(3)+31(1)+34(1) = 12 têtes\", lambda: placer(_rg, 35), 12)\negal(\"... la carte 35 devient seule dans la rangée\", lambda: _c(_rg), [[35], [50], [60], [70]])\n_rg = _r([10], [20], [30], [40])\negal(\"carte 5 trop petite : on ramasse la rangée n°0 = [10] -> 3 têtes\", lambda: placer(_rg, 5), 3)\negal(\"... la rangée 0 devient [5]\", lambda: _c(_rg), [[5], [20], [30], [40]])\n_rg = _r([55, 56], [20], [90], [40])\negal(\"carte 57 : sommet 56 le plus grand < 57 (rangée 0), pas pleine : 0 tête\", lambda: placer(_rg, 57), 0)\n_rg = _r([3, 6, 8, 12, 14], [1], [2], [4])\negal(\"14 -> 15 sur rangée pleine (5 cartes) : ramasse 3,6,8,12,14 = 5 têtes\", lambda: placer(_rg, 15), 5)\n", "aide_code": null, "visuel": null, "indice_html": "<p>Cherche d&#x27;abord, parmi les 4 rangées, celle dont le sommet est <strong>le plus grand qui reste inférieur</strong> à la carte jouée. S&#x27;il n&#x27;y en a aucune, ou si la rangée trouvée a déjà 5 cartes, il faut ramasser avant de poser.</p>", "solution": "def placer(rangees, carte):\n    \"\"\"Place carte dans une des 4 rangées (piles). Renvoie le nombre de têtes de bœuf ramassées.\"\"\"\n    choix = -1\n    for i in range(len(rangees)):\n        s = rangees[i].sommet()\n        if s <
