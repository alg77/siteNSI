<script>// App principale — page groupée multi-chapitres. TP_LIST (liste de TP) et EST_PROF sont injectés par le générateur.
(function () {
  "use strict";

  class Engine {
    constructor(workerUrl) {
      this.worker = new Worker(workerUrl, { type: "module" });
      this.pending = new Map();
      this.nextId = 1;
      this.worker.onmessage = (ev) => {
        const d = ev.data;
        const p = this.pending.get(d.id);
        if (!p) return;
        this.pending.delete(d.id);
        if (d.fatal) p.reject(new Error(d.fatal));
        else p.resolve(d.result);
      };
      this.worker.onerror = (ev) => {
        for (const [, p] of this.pending) p.reject(new Error("erreur worker : " + ev.message));
        this.pending.clear();
      };
    }
    request(op, payload) {
      const id = this.nextId++;
      return new Promise((resolve, reject) => {
        this.pending.set(id, { resolve, reject });
        this.worker.postMessage({ id, op, payload: payload || {} });
      });
    }
    ping() { return this.request("__ping__", {}); }
    run(tp, ex, code, chaine, tests, aide, prelude) {
      return this.request("run", { tp, ex, code, chaine, tests, aide: aide || null, prelude });
    }
    call(tp, ex, expr) { return this.request("call", { tp, ex, expr, code: "" }); }
  }

  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function sansAccents(s) {
    return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }
  function nettoyerNom(s) {
    return sansAccents(s || "").replace(/[^A-Za-z0-9]+/g, "").trim();
  }

  const STORE_KEY = "tp-piles-files-v1";
  function chargerStock() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch (e) { return {}; }
  }
  function sauverStock(obj) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(obj)); } catch (e) {}
  }
  function chargerIdentite() {
    try { return JSON.parse(localStorage.getItem("tp-identite-v1") || "{}"); } catch (e) { return {}; }
  }
  function sauverIdentite(obj) {
    try { localStorage.setItem("tp-identite-v1", JSON.stringify(obj)); } catch (e) {}
  }
  function chargerChapitreCourant() {
    try { return localStorage.getItem("tp-piles-files-chapitre-v1") || ""; } catch (e) { return ""; }
  }
  function sauverChapitreCourant(tpId) {
    try { localStorage.setItem("tp-piles-files-chapitre-v1", tpId); } catch (e) {}
  }

  function nomFichier(tp, nom, prenom) {
    const N = nettoyerNom(nom).toUpperCase() || "NOM";
    const P = nettoyerNom(prenom) || "Prenom";
    const Pc = P.charAt(0).toUpperCase() + P.slice(1);
    return N + "-" + Pc + "-TP" + tp.num + "-" + tp.slug + ".py";
  }

  function toast(texte, ko) {
    const t = el("div", "toast" + (ko ? " ko" : ""), esc(texte));
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3200);
  }

  document.addEventListener("DOMContentLoaded", () => {
    const stock = chargerStock();
    const identite = chargerIdentite();
    const etats = {}; // "tpId::exId" -> {editor, el, ex, tp}
    let chapitreActif = null;

    // ----- barre du haut -----
    const barre = document.querySelector(".barre");
    const champNom = barre.querySelector(".ch-nom");
    const champPrenom = barre.querySelector(".ch-prenom");
    const nomFichierEl = barre.querySelector(".nom-fichier");
    const etatPy = barre.querySelector(".etat-python");
    champNom.value = identite.nom || "";
    champPrenom.value = identite.prenom || "";
    function majNomFichier() {
      const tp = TP_LIST.find((t) => t.id === chapitreActif);
      if (tp) nomFichierEl.textContent = nomFichier(tp, champNom.value, champPrenom.value);
    }
    [champNom, champPrenom].forEach((c) =>
      c.addEventListener("input", () => {
        sauverIdentite({ nom: champNom.value, prenom: champPrenom.value });
        majNomFichier();
      })
    );

    // ----- worker (source intégrée : page 100% autonome) -----
    const workerBlob = new Blob([WORKER_SOURCE], { type: "application/javascript" });
    const workerUrl = URL.createObjectURL(workerBlob);
    const engine = new Engine(workerUrl);
    let pret = false;
    engine
      .ping()
      .then(() => {
        pret = true;
        etatPy.classList.add("pret");
        etatPy.querySelector("span").textContent = "Python prêt";
        document.querySelectorAll(".btn-exec").forEach((b) => (b.disabled = false));
      })
      .catch((e) => {
        etatPy.classList.add("erreur");
        etatPy.querySelector("span").textContent = "Python indisponible";
        document.querySelector(".bandeau-reseau-zone").innerHTML =
          '<div class="bandeau-reseau">Le moteur Python n\'a pas pu se charger (réseau bloqué ou hors-ligne ?). ' +
          "Détail : " + esc(e.message) + "</div>";
      });

    function chaineActuelle(tp, avantId) {
      const res = [];
      for (const ex of tp.exercices) {
        if (ex.id === avantId) break;
        if (ex.kind === "exercice") res.push([ex.id, etats[tp.id + "::" + ex.id].editor.getValue()]);
      }
      return res;
    }

    function rendreTests(zone, tests) {
      zone.innerHTML = "";
      if (!tests || !tests.length) return;
      const ok = tests.every((t) => t.ok);
      const resume = el("div", "tests-resume " + (ok ? "ok" : "ko"), (ok ? "✓ " : "✗ ") + tests.filter((t) => t.ok).length + " / " + tests.length + " tests réussis");
      const liste = el("ul", "tests");
      liste.appendChild(resume);
      tests.forEach((t) => {
        const li = el("li", t.ok ? "ok" : "ko");
        li.innerHTML = '<span class="mark">' + (t.ok ? "✓" : "✗") + "</span><span>" + esc(t.label) + (t.detail ? '<span class="detail">' + esc(t.detail) + "</span>" : "") + "</span>";
        liste.appendChild(li);
      });
      zone.appendChild(liste);
    }

    const puceEls = {}; // "tpId::exId" -> element
    function majPuce(tp, ex, statut) {
      const p = puceEls[tp.id + "::" + ex.id];
      if (!p) return;
      p.classList.remove("ok", "ko", "ran", "err");
      if (statut) p.classList.add(statut);
    }

    async function executer(tp, ex) {
      if (!pret) return;
      const cle = tp.id + "::" + ex.id;
      const st = etats[cle];
      const zoneLcd = st.el.querySelector(".lcd pre");
      const lcdVide = st.el.querySelector(".lcd .vide");
      const erreurBox = st.el.querySelector(".erreur-box");
      const avertBox = st.el.querySelector(".avert-box");
      const testsZone = st.el.querySelector(".tests-zone");
      const statutSpan = st.el.querySelector(".statut");
      const boutons = st.el.querySelectorAll(".btn-exec");
      boutons.forEach((b) => (b.disabled = true));
      statutSpan.textContent = "exécution…";
      statutSpan.className = "statut ran";
      st.editor.effacerErreur();
      erreurBox.style.display = "none";
      avertBox.style.display = "none";
      const code = st.editor.getValue();
      const secoursBox = st.el.querySelector(".secours input");
      const aide = secoursBox && secoursBox.checked ? ex.aide_code : null;
      let res;
      try {
        res = await engine.run(tp.id, ex.id, code, chaineActuelle(tp, ex.id), ex.tests, aide, tp.prelude);
      } catch (e) {
        statutSpan.textContent = "erreur interne";
        statutSpan.className = "statut err";
        erreurBox.style.display = "block";
        erreurBox.textContent = "Erreur interne du moteur : " + e.message;
        boutons.forEach((b) => (b.disabled = false));
        return;
      }
      boutons.forEach((b) => (b.disabled = false));
      if (res.interne) {
        statutSpan.textContent = "erreur";
        statutSpan.className = "statut err";
        erreurBox.style.display = "block";
        erreurBox.textContent = "Impossible d'exécuter : " + res.interne;
        majPuce(tp, ex, "err");
        return;
      }
      if (res.avert && res.avert.length) {
        avertBox.style.display = "block";
        avertBox.textContent = res.avert.join(" ");
      }
      if (res.stdout) {
        zoneLcd.textContent = res.stdout + (res.tronque ? "\n… (sortie tronquée)" : "");
        lcdVide.style.display = "none";
        zoneLcd.style.display = "block";
      } else {
        zoneLcd.style.display = "none";
        lcdVide.style.display = "block";
      }
      if (res.erreur) {
        erreurBox.style.display = "block";
        let txt = res.erreur.type + " : " + res.erreur.msg;
        erreurBox.innerHTML = esc(txt);
        if (res.erreur.src) {
          const pre = el("div", "src", esc(res.erreur.src));
          erreurBox.appendChild(pre);
        }
        if (res.erreur.ligne) st.editor.marquerErreur(res.erreur.ligne);
        statutSpan.textContent = "erreur";
        statutSpan.className = "statut err";
        majPuce(tp, ex, "err");
        testsZone.innerHTML = "";
      } else {
        rendreTests(testsZone, res.tests);
        const ok = res.tests && res.tests.every((t) => t.ok);
        if (res.tests && res.tests.length) {
          statutSpan.textContent = ok ? "réussi" : "à revoir";
          statutSpan.className = "statut " + (ok ? "ok" : "ko");
          majPuce(tp, ex, ok ? "ok" : "ko");
        } else {
          statutSpan.textContent = "exécuté";
          statutSpan.className = "statut ran";
          majPuce(tp, ex, "ran");
        }
      }
      stock[cle] = code;
      sauverStock(stock);
    }

    // ----- construction des chapitres -----
    const racine = document.querySelector(".chapitres");
    const nav = document.querySelector(".chapitres-nav");
    const pucesBarre = barre.querySelector(".puces");

    TP_LIST.forEach((tp) => {
      // onglet de navigation
      const onglet = el("button", "onglet-chapitre", '<span class="oc-num">' + tp.num + "</span> " + esc(tp.emoji) + " " + esc(tp.titre_court || tp.titre));
      onglet.dataset.tp = tp.id;
      onglet.style.setProperty("--accent-onglet", tp.accent);
      onglet.addEventListener("click", () => activerChapitre(tp.id));
      nav.appendChild(onglet);

      // contenu du chapitre
      const chap = el("div", "chapitre");
      chap.dataset.tp = tp.id;
      chap.hidden = true;
      chap.style.setProperty("--accent", tp.accent);

      const objectifs = tp.objectifs.map((o) => "<li>" + esc(o) + "</li>").join("");
      const cartouche = el("div", "cartouche");
      cartouche.innerHTML =
        '<div class="bandeau"><div class="tuile">' + esc(tp.emoji) + '</div><div>' +
        '<div class="num">TP2 — Séance ' + tp.num + '</div><h1>' + esc(tp.titre) + '</h1>' +
        '<p class="sous-titre">' + esc(tp.sous_titre) + "</p></div></div>" +
        '<div class="contenu"><span class="duree">⏱ ' + esc(tp.duree) + '</span><ul class="objectifs">' + objectifs + '</ul>' +
        '<div class="enonce">' + tp.intro_html + "</div></div>";
      chap.appendChild(cartouche);

      if (tp.prof_extra_html) {
        chap.appendChild(el("div", "prof-banner", "Mode professeur : corrigés, notes pédagogiques et variante DST visibles pour cette séance."));
      }

      const listeEx = el("div", "exercices");
      tp.exercices.forEach((ex) => {
        const bloc = el("section", "exo" + (ex.kind === "defi" ? " defi" : ""));
        bloc.id = tp.id + "-" + ex.id;
        const tete = el("div", "exo-tete");
        tete.innerHTML =
          '<span class="etiquette">' + (ex.kind === "defi" ? "Défi" : "Exercice") + "</span>" +
          "<h2>" + esc(ex.titre) + '</h2><span class="statut todo">à faire</span>';
        bloc.appendChild(tete);
        bloc.appendChild(el("div", "enonce", ex.enonce_html));
        if (ex.aparte_html) {
          const aparte = el("details", "aparte");
          aparte.open = true;
          aparte.innerHTML = "<summary>" + esc(ex.aparte_titre) + '</summary><div class="enonce">' + ex.aparte_html + "</div>";
          bloc.appendChild(aparte);
        }
        if (ex.indice_html) {
          const indice = el("details", "indice");
          indice.innerHTML = '<summary>💡 Besoin d\'un indice ?</summary><div class="enonce">' + ex.indice_html + "</div>";
          bloc.appendChild(indice);
        }

        const editeurWrap = el("div", "zone-code");
        const editeurDiv = el("div");
        editeurWrap.appendChild(editeurDiv);
        bloc.appendChild(editeurWrap);

        const actions = el("div", "actions-ex");
        const btnExec = el("button", "btn primaire btn-exec", "▶ Exécuter");
        btnExec.disabled = true;
        const btnReset = el("button", "btn discret", "↺ Réinitialiser l'énoncé");
        actions.appendChild(btnExec);
        actions.appendChild(btnReset);
        if (EST_PROF && ex.solution) {
          const btnCorr = el("button", "btn discret", "👁 Charger le corrigé");
          btnCorr.addEventListener("click", () => editeur.setValue(ex.solution));
          actions.appendChild(btnCorr);
        }
        actions.appendChild(el("span", "raccourci", "Ctrl+Entrée pour exécuter"));
        bloc.appendChild(actions);

        if (ex.aide_code) {
          const secours = el("label", "secours");
          secours.innerHTML = '<input type="checkbox"> 🆘 Utiliser une version fournie pour les fonctions précédentes dont j\'ai besoin ici (si je suis bloqué)';
          bloc.appendChild(secours);
        }

        const lcd = el("div", "lcd");
        lcd.innerHTML = '<div class="titre-lcd">Sortie du programme</div><pre style="display:none"></pre><span class="vide">(rien affiché pour l\'instant)</span>';
        bloc.appendChild(lcd);
        const erreurBox = el("div", "erreur-box");
        erreurBox.style.display = "none";
        bloc.appendChild(erreurBox);
        const avertBox = el("div", "avert-box");
        avertBox.style.display = "none";
        bloc.appendChild(avertBox);
        bloc.appendChild(el("div", "tests-zone"));

        if (ex.visuel) {
          const visuelDiv = el("div", "visuel");
          bloc.appendChild(visuelDiv);
          setTimeout(() => window.initVisuel(visuelDiv, engine, tp.id, ex), 0);
        }

        if (EST_PROF && ex.notes_prof) {
          const profBloc = el("details", "prof-bloc");
          profBloc.innerHTML =
            "<summary>Notes pour le professeur</summary>" +
            '<div class="notes">' + ex.notes_html + "</div>" +
            "<p><strong>Corrigé :</strong></p><pre><code>" + ex.solution_html + "</code></pre>";
          bloc.appendChild(profBloc);
        }

        listeEx.appendChild(bloc);

        const cle = tp.id + "::" + ex.id;
        const codeInitial = stock[cle] !== undefined ? stock[cle] : ex.starter;
        const editeur = window.creerEditeur(editeurDiv, codeInitial);
        editeurDiv.addEventListener("keydown", (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
            e.preventDefault();
            executer(tp, ex);
          }
        });
        btnExec.addEventListener("click", () => executer(tp, ex));
        btnReset.addEventListener("click", () => {
          if (confirm("Revenir au code de départ de cet exercice ? Ton code actuel sera perdu.")) {
            editeur.setValue(ex.starter);
            delete stock[cle];
            sauverStock(stock);
          }
        });

        etats[cle] = { editor: editeur, el: bloc, ex, tp };
      });
      chap.appendChild(listeEx);

      if (tp.prof_extra_html) {
        const bloc = el("div", "cartouche");
        bloc.innerHTML = '<div class="contenu">' + tp.prof_extra_html + "</div>";
        chap.appendChild(bloc);
      }

      if (tp.lien_suite) {
        chap.appendChild(el("div", "lien-suite",
          "<p><strong>" + esc(tp.lien_suite.titre) + '</strong></p><p><a href="' + tp.lien_suite.href + '">' + esc(tp.lien_suite.texte) + " →</a></p>"));
      }

      racine.appendChild(chap);
    });

    function activerChapitre(tpId) {
      const tp = TP_LIST.find((t) => t.id === tpId);
      if (!tp) return;
      chapitreActif = tpId;
      document.documentElement.style.setProperty("--accent", tp.accent);
      document.querySelectorAll(".chapitre").forEach((c) => (c.hidden = c.dataset.tp !== tpId));
      document.querySelectorAll(".onglet-chapitre").forEach((o) => o.classList.toggle("actif", o.dataset.tp === tpId));
      // puces : exercices du chapitre actif
      pucesBarre.innerHTML = "";
      tp.exercices.forEach((ex) => {
        const a = el("a", "puce" + (ex.kind === "defi" ? " defi" : ""), esc(ex.abbr));
        a.href = "#" + tp.id + "-" + ex.id;
        a.title = ex.titre;
        const cle = tp.id + "::" + ex.id;
        puceEls[cle] = a;
        pucesBarre.appendChild(a);
      });
      majNomFichier();
      sauverChapitreCourant(tpId);
      window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
    }

    const depart = (location.hash || "").replace("#", "");
    const depTp = TP_LIST.find((t) => t.id === depart || depart.startsWith(t.id + "-"));
    const memoire = chargerChapitreCourant();
    const initial = (depTp && depTp.id) || (TP_LIST.find((t) => t.id === memoire) && memoire) || TP_LIST[0].id;
    activerChapitre(initial);
    if (depart && depart.includes("-")) {
      setTimeout(() => {
        const cible = document.getElementById(depart);
        if (cible) cible.scrollIntoView({ block: "start" });
      }, 50);
    }

    // ----- sauvegarde / chargement (portent sur le chapitre actif) -----
    const btnSauver = document.querySelector(".btn-sauver");
    const btnCharger = document.querySelector(".btn-charger");
    const inputFichier = document.querySelector(".input-fichier");

    btnSauver.addEventListener("click", () => {
      const tp = TP_LIST.find((t) => t.id === chapitreActif);
      const nom = champNom.value.trim(), prenom = champPrenom.value.trim();
      if (!nom || !prenom) {
        toast("Indique ton nom et ton prénom en haut de la page avant d'enregistrer.", true);
        (nom ? champPrenom : champNom).focus();
        return;
      }
      let contenu = "# TP2 — Piles et files — Séance " + tp.num + " : " + tp.titre + "\n# " + nom.toUpperCase() + " " + prenom + "\n\n";
      tp.exercices.forEach((ex) => {
        contenu += "# ===== [" + ex.id + "] " + ex.titre + " =====\n" + etats[tp.id + "::" + ex.id].editor.getValue().replace(/\s+$/, "") + "\n\n";
      });
      const nomF = nomFichier(tp, nom, prenom);
      const blob = new Blob([contenu], { type: "text/x-python" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = nomF;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast("Fichier enregistré : " + nomF);
    });

    btnCharger.addEventListener("click", () => inputFichier.click());
    inputFichier.addEventListener("change", () => {
      const f = inputFichier.files[0];
      if (!f) return;
      const tp = TP_LIST.find((t) => t.id === chapitreActif);
      const reader = new FileReader();
      reader.onload = () => {
        const texte = String(reader.result);
        const re = /#\s*=====\s*\[([a-zA-Z0-9]+)\][^\n]*=====\n([\s\S]*?)(?=\n#\s*=====\s*\[|$)/g;
        let m, trouve = 0;
        while ((m = re.exec(texte))) {
          const id = m[1];
          const cle = tp.id + "::" + id;
          if (etats[cle]) {
            etats[cle].editor.setValue(m[2].replace(/\s+$/, ""));
            trouve++;
          }
        }
        const mNom = texte.match(/^#.*?\n#\s*([A-ZÀ-Ý' -]+)\s+(\S+)/);
        if (mNom) {
          champNom.value = mNom[1].trim();
          champPrenom.value = mNom[2].trim();
          sauverIdentite({ nom: champNom.value, prenom: champPrenom.value });
          majNomFichier();
        }
        toast(trouve ? trouve + " exercice(s) rechargé(s) depuis " + f.name + " (séance " + tp.num + ")" : "Aucun exercice de cette séance reconnu dans ce fichier. Ouvre d'abord la bonne séance.", !trouve);
      };
      reader.readAsText(f, "utf-8");
      inputFichier.value = "";
    });
  });
})();
</script>
</body>
</html>
