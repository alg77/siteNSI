<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TP2 — Piles et files</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>/* Piles et files — TP interactifs.
   Même identité graphique que la plateforme ECE : papier clair, encre bleu nuit, accents
   brique/bleu/vert/ambre, Space Grotesk pour les titres, Inter pour le texte, JetBrains Mono pour le code. */
:root {
  --ink: #1c2541;
  --ink-soft: #3a4470;
  --paper: #fbfaf6;
  --paper-dim: #efece2;
  --card: #ffffff;
  --line: #dcd6c4;
  --blue: #2e6fab;
  --blue-dim: #e7eef6;
  --brick: #b3453d;
  --brick-dim: #f6e6e4;
  --brick-dark: #8a332c;
  --green: #3f8f5f;
  --green-dim: #e5f2ea;
  --amber: #c98a1f;
  --ok: #3f8f5f;
  --ko: #b3453d;
  --warn: #a3691a;
  --code-bg: #1c2541;
  --code-fg: #e9e7dd;
  --accent: #2e6fab;
  --accent-soft: color-mix(in srgb, var(--accent) 12%, white);
  --font-ui: 'Inter', -apple-system, "Segoe UI", system-ui, sans-serif;
  --font-head: 'Space Grotesk', var(--font-ui);
  --font-code: 'JetBrains Mono', ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 84px; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.65 var(--font-ui);
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }

a { color: var(--blue); }
code, kbd { font-family: var(--font-code); font-size: .9em; background: var(--paper-dim); padding: .1em .35em; border-radius: 4px; }
:focus-visible { outline: 2.5px solid var(--brick); outline-offset: 2px; }

/* ---------- barre du haut ---------- */
.barre {
  position: sticky; top: 0; z-index: 20;
  background: var(--ink); color: #fff;
  border-bottom: 1px solid #2f3a63;
  padding: 10px 18px;
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
}
.barre .marque { font: 700 17px var(--font-head); display: flex; align-items: center; gap: 8px; white-space: nowrap; letter-spacing: -.01em; }
.barre .marque .pastille { width: 28px; height: 28px; display: grid; place-items: center; background: var(--accent); border-radius: 6px; font-size: 16px; }
.barre .identite { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.barre label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #cfd3e6; }
.barre input[type=text] {
  width: 148px; padding: 6px 9px; border: 1px solid #3a4470; border-radius: 6px; background: #232d52; color: #fff; font: 14px var(--font-ui);
}
.barre input[type=text]::placeholder { color: #8891bb; }
.barre input[type=text]:focus-visible { outline-color: #fff; }
.barre .nom-fichier { font: 12px var(--font-code); color: #a9b0d6; }
.barre .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.puces { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.puce {
  width: 24px; height: 24px; border-radius: 5px; display: grid; place-items: center;
  font: 700 11px var(--font-head); text-decoration: none; color: #fff;
  background: #33406f; border: 1px solid #46538a;
}
.puce.defi { border-radius: 50%; }
.puce.ran { background: var(--blue); border-color: var(--blue); }
.puce.ok { background: var(--green); border-color: var(--green); }
.puce.ko, .puce.err { background: var(--brick); border-color: var(--brick); }
.puce.dirty { opacity: .6; border-style: dashed; }
.etat-python { font-size: 13px; color: #cfd3e6; display: flex; align-items: center; gap: 6px; }
.etat-python i { width: 9px; height: 9px; border-radius: 50%; background: var(--amber); display: inline-block; }
.etat-python.pret i { background: #6fce97; }
.etat-python.erreur i { background: #e08a83; }

/* ---------- navigation entre chapitres (séances) ---------- */
.chapitres-nav {
  position: sticky; top: 53px; z-index: 19; background: #232d52; border-bottom: 1px solid #3a4470;
  padding: 6px 14px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin;
}
.onglet-chapitre {
  --accent-onglet: var(--accent);
  flex: none; font: 650 13px var(--font-head); cursor: pointer; white-space: nowrap;
  border: 1px solid #3a4470; background: #1c2541; color: #cfd3e6; border-radius: 999px; padding: 6px 14px;
  display: inline-flex; align-items: center; gap: 6px;
}
.onglet-chapitre .oc-num {
  display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%;
  background: #3a4470; color: #fff; font-size: 11px;
}
.onglet-chapitre:hover { background: #2c3763; }
.onglet-chapitre.actif { background: var(--accent-onglet); border-color: var(--accent-onglet); color: #fff; }
.onglet-chapitre.actif .oc-num { background: rgba(255,255,255,.28); }
@media (max-width: 640px) { .chapitres-nav { top: 96px; } }

/* ---------- boutons ---------- */
.btn {
  font: 650 14px var(--font-head); cursor: pointer; letter-spacing: -.005em;
  border: 1px solid var(--line); background: var(--card); color: var(--ink-soft);
  border-radius: 7px; padding: 9px 16px;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover:not(:disabled) { background: var(--paper-dim); }
.btn:active:not(:disabled) { background: var(--line); }
.btn:disabled { opacity: .5; cursor: wait; }
.btn.primaire { background: var(--brick); border-color: var(--brick); color: #fff; }
.btn.primaire:hover:not(:disabled) { background: var(--brick-dark); }
.btn.discret { border-color: transparent; background: transparent; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; color: var(--blue); padding: 6px 4px; }
.btn.discret:hover:not(:disabled) { background: var(--blue-dim); text-decoration: none; }
.barre .btn { border-color: #3a4470; background: #232d52; color: #fff; }
.barre .btn:hover:not(:disabled) { background: #2c3763; }
.barre .btn.primaire { background: var(--brick); border-color: var(--brick); }
.barre .btn.primaire:hover:not(:disabled) { background: var(--brick-dark); }

/* ---------- mise en page ---------- */
.page { max-width: 920px; margin: 0 auto; padding: 26px 16px 80px; }
.cartouche {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 26px;
}
.cartouche .bandeau {
  background: var(--ink); color: #fff; display: flex; gap: 18px; align-items: center; padding: 22px 26px;
}
.cartouche .tuile { font-size: 40px; width: 72px; height: 72px; display: grid; place-items: center; background: rgba(255,255,255,.1); border-radius: 12px; flex: none; }
.cartouche h1 { margin: 0; font: 700 1.9rem/1.2 var(--font-head); letter-spacing: -.02em; }
.cartouche .sous-titre { margin: 5px 0 0; font-size: 1.02rem; color: #cfd3e6; }
.cartouche .num { font: 700 11px var(--font-code); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; opacity: .9; }
.cartouche .contenu { padding: 22px 26px 10px; }
.cartouche .objectifs { margin: 0 0 12px; padding-left: 1.2em; }
.cartouche .objectifs li { margin: 3px 0; }
.cartouche .duree { display: inline-block; background: var(--paper-dim); border: 1px solid var(--line); border-radius: 999px; padding: 2px 13px; font-size: .88rem; margin-bottom: 12px; color: var(--ink-soft); }
@media (max-width: 560px) { .cartouche .tuile { width: 52px; height: 52px; font-size: 26px; } .cartouche h1 { font-size: 1.4rem; } }

/* texte des énoncés */
.enonce > * { max-width: 70ch; }
.enonce > table, .enonce > pre, .enonce > .adm { max-width: none; }
.enonce h2 { font: 700 1.2rem/1.3 var(--font-head); margin: 1.2em 0 .4em; letter-spacing: -.01em; }
.enonce h3 { font: 650 1.02rem/1.3 var(--font-head); margin: 1em 0 .3em; }
.enonce p { margin: .6em 0; }
.enonce ul, .enonce ol { padding-left: 1.4em; }
.enonce li { margin: .25em 0; }
.enonce table { border-collapse: collapse; margin: .8em 0; width: auto; min-width: 60%; font-size: .95rem; }
.enonce th, .enonce td { border-bottom: 1px solid var(--line); padding: 8px 12px; text-align: left; vertical-align: top; }
.enonce th { background: var(--paper-dim); font-family: var(--font-head); font-weight: 650; }
.enonce pre {
  background: var(--paper-dim); border: 1px solid var(--line); border-left: 3px solid var(--blue);
  border-radius: 8px; padding: 12px 16px; overflow-x: auto; font: 13px/1.6 var(--font-code); margin: .8em 0;
}
.enonce pre code { background: none; padding: 0; font-size: inherit; }
.adm { border-radius: 8px; padding: 10px 16px; margin: 1em 0; border: 1px solid; border-left-width: 3px; max-width: 70ch; }
.adm p { margin: .3em 0; }
.adm .adm-titre { font: 650 .95rem var(--font-head); margin: 0 0 .15em; }
.adm-astuce { background: var(--blue-dim); border-color: var(--blue); }
.adm-attention { background: var(--brick-dim); border-color: var(--brick); }
.adm-note { background: var(--green-dim); border-color: var(--green); }

/* indice(s) dépliable(s) et aparté (ex. première rencontre avec la récursivité) */
.exo > .aparte {
  margin: 12px 22px 0; border: 1px solid var(--line); border-radius: 8px; padding: 2px 16px; max-width: 70ch;
}
.exo > .indices { margin: 12px 22px 0; max-width: 70ch; }
.exo > .indices .indice + .indice { margin-top: 8px; }
.exo > .indices .indice {
  border: 1px solid var(--line); border-radius: 8px; padding: 2px 16px;
}
.exo > .indices .indice { border-left: 3px solid var(--amber); background: #fbf6ea; }
.exo > .aparte { border-left: 3px solid var(--blue); background: var(--blue-dim); }
.exo > .indices .indice summary, .exo > .aparte summary {
  cursor: pointer; font: 650 .92rem var(--font-head); padding: 10px 0; list-style: revert;
}
.exo > .indices .indice[open] summary, .exo > .aparte[open] summary { margin-bottom: 2px; }
.exo > .indices .indice .enonce, .exo > .aparte .enonce { padding-bottom: 10px; }
.exo > .indices .indice .enonce > :first-child, .exo > .aparte .enonce > :first-child { margin-top: 0; }
.exo > .indices .indice .enonce > :last-child, .exo > .aparte .enonce > :last-child { margin-bottom: 0; }

/* coloration syntaxique (extraits de code en lecture seule, fond clair) */
.k { color: var(--amber); font-weight: 650; } .s { color: var(--green); } .c { color: var(--ink-soft); font-style: italic; } .n { color: var(--brick); } .b { color: #1f7a6c; } .f { color: var(--blue); }
.enonce .k { color: #8a5f10; font-weight: 650; } .enonce .s { color: #226b46; } .enonce .c { color: var(--ink-soft); opacity: .8; font-style: italic; } .enonce .n { color: var(--brick-dark); } .enonce .b { color: #1f7a6c; } .enonce .f { color: var(--blue); }

/* ---------- exercices ---------- */
.exo {
  background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--accent);
  border-radius: 10px; margin: 24px 0; padding: 0 0 18px;
}
.exo.defi { border-left-style: double; border-left-width: 6px; }
.exo-tete { display: flex; align-items: center; gap: 12px; padding: 16px 22px 6px; flex-wrap: wrap; }
.exo-tete h2 { margin: 0; font: 700 1.2rem var(--font-head); letter-spacing: -.01em; }
.exo-tete .etiquette { background: var(--accent); color: #fff; border-radius: 6px; padding: 2px 10px; font: 650 .82rem var(--font-head); white-space: nowrap; }
.exo.defi .etiquette { background: var(--ink); }
.exo-tete .statut { margin-left: auto; font: 650 .88rem var(--font-head); }
.statut.ok { color: var(--green); } .statut.ko, .statut.err { color: var(--brick); } .statut.ran { color: var(--blue); } .statut.todo { color: var(--ink-soft); font-weight: 500; }
.exo .enonce { padding: 0 22px; }
.chaine-note { padding: 0 22px; font-size: .85rem; color: var(--ink-soft); margin: 6px 0 0; }
.exo .zone-code { padding: 0 22px; margin-top: 12px; }

/* éditeur */
.editeur {
  display: flex; background: var(--code-bg); border-radius: 8px; overflow: hidden; border: 1px solid #2f3a63;
  font: 14px/22px var(--font-code); color: var(--code-fg);
}
.ed-gut { flex: none; width: 44px; padding: 12px 8px 12px 0; text-align: right; color: #5a6491; background: #19203c; overflow: hidden; user-select: none; }
.ed-gut div { height: 22px; }
.ed-gut div.err { background: var(--brick); color: #fff; font-weight: 700; }
.ed-zone { position: relative; flex: 1; min-width: 0; }
.ed-hl, .ed-ta {
  position: absolute; inset: 0; margin: 0; padding: 12px; border: 0; width: 100%; height: 100%;
  font: inherit; line-height: 22px; white-space: pre; tab-size: 4; letter-spacing: 0; word-spacing: 0;
  overflow: auto; overscroll-behavior: contain;
}
.ed-hl { overflow: hidden; pointer-events: none; color: var(--code-fg); }
.ed-ta { background: transparent; color: transparent; caret-color: #fff; resize: none; outline: none; }
.ed-ta::selection { background: #2f3a63; color: transparent; }
.editeur:focus-within { outline: 2.5px solid var(--brick); outline-offset: 1px; }
/* jetons dans l'éditeur (fond sombre, mêmes teintes que l'éditeur CodeMirror de la plateforme ECE) */
.ed-hl .k { color: #e0a63a; font-weight: 650; }
.ed-hl .s { color: #a3d99b; }
.ed-hl .c { color: #7d87ad; font-style: italic; }
.ed-hl .n { color: #e39aa8; }
.ed-hl .b { color: #8fd0c4; }
.ed-hl .f { color: #9fc8e8; }

.actions-ex { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 12px 22px 0; }
.secours { font-size: .88rem; color: var(--ink-soft); display: flex; gap: 6px; align-items: flex-start; padding: 8px 22px 0; max-width: 70ch; }
.secours input { margin-top: 4px; accent-color: var(--brick); }
.raccourci { font-size: .8rem; color: var(--ink-soft); margin-left: auto; }

/* sortie / résultats */
.lcd {
  margin: 14px 22px 0; background: var(--paper-dim); color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px;
  font: 13px/1.55 var(--font-code); padding: 10px 14px; overflow-x: auto;
}
.lcd .titre-lcd { font: 650 11px var(--font-head); letter-spacing: .05em; text-transform: uppercase; opacity: .65; margin-bottom: 4px; }
.lcd pre { margin: 0; white-space: pre-wrap; word-break: break-word; }
.lcd .vide { opacity: .6; font-style: italic; font-family: var(--font-ui); }
.erreur-box {
  margin: 12px 22px 0; border: 1px solid var(--brick); border-left: 3px solid var(--brick); background: var(--brick-dim); color: var(--brick-dark); border-radius: 8px; padding: 8px 14px;
}
.erreur-box .src { font: 13px var(--font-code); background: #fff; border: 1px solid #eccac6; border-radius: 4px; padding: 3px 8px; margin-top: 6px; white-space: pre-wrap; }
.avert-box { margin: 10px 22px 0; border: 1px solid var(--amber); border-left: 3px solid var(--amber); background: #fbf1de; color: #6b4e0f; border-radius: 8px; padding: 6px 14px; font-size: .9rem; }
.tests { list-style: none; margin: 14px 22px 0; padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.tests-resume { padding: 9px 14px; font: 650 .95rem var(--font-head); background: var(--paper-dim); border-bottom: 1px solid var(--line); }
.tests-resume.ok { background: var(--green-dim); color: #205c3c; } .tests-resume.ko { background: var(--brick-dim); color: var(--brick-dark); }
.tests li { padding: 6px 14px; border-top: 1px solid var(--line); display: flex; gap: 10px; font-size: .92rem; }
.tests li:first-child { border-top: 0; }
.tests li .mark { flex: none; width: 1.4em; }
.tests li.ok .mark { color: var(--green); } .tests li.ko .mark { color: var(--brick); }
.tests li .detail { color: var(--ink-soft); font: 13px var(--font-code); display: block; }

/* corrigé (prof) */
.prof-bloc { margin: 14px 22px 0; border: 1px solid var(--blue); border-left: 3px solid var(--blue); background: var(--blue-dim); border-radius: 8px; padding: 9px 14px; }
.prof-bloc summary { cursor: pointer; font: 650 .95rem var(--font-head); color: var(--blue); }
.prof-bloc pre { background: var(--code-bg); color: var(--code-fg); border-radius: 6px; padding: 10px 14px; overflow-x: auto; font: 13px/1.55 var(--font-code); }
.prof-bloc .notes { font-size: .95rem; }
.prof-banner { background: var(--blue-dim); border: 1px solid var(--blue); border-left: 3px solid var(--blue); color: #1d4a70; padding: 9px 14px; border-radius: 8px; margin: 0 0 20px; font-size: .95rem; }

/* lien de passerelle vers une autre ressource */
.lien-suite { margin: 30px 0; background: var(--paper); border: 1px solid var(--line); border-left: 3px solid var(--brick); border-radius: 10px; padding: 16px 20px; }
.lien-suite p { margin: 4px 0 0; }
.lien-suite strong { font-family: var(--font-head); }
.lien-suite a { font-weight: 650; color: var(--brick); }

/* ---------- démos « avant de coder » ---------- */
.demo-avant-code {
  margin: 0 0 26px; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent);
  border-radius: 10px; padding: 20px 24px 22px;
}
.demo-avant-code h3 { margin: 0 0 6px; font: 700 1.15rem var(--font-head); }
.demo-avant-code > p { margin: 0 0 14px; max-width: 72ch; }
.demo-ctrl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 4px 0 14px; }
.demo-ctrl label { display: flex; align-items: center; gap: 6px; font-size: .92rem; }
.demo-ctrl select { font: inherit; padding: 4px 7px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.demo-ctrl strong { font: 650 .9rem var(--font-code); color: var(--ink-soft); }
.demo-avant-code canvas { max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 0 auto; cursor: pointer; }
.dh-msg, .dc-statut, .ds-statut { margin: 10px 2px 0; font-size: .95rem; min-height: 1.4em; color: var(--ink-soft); }
.demo-layout { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: start; }
@media (max-width: 640px) { .demo-layout { grid-template-columns: 1fr; } }
.ds-liste { background: var(--paper-dim); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: .85rem; overflow-x: auto; white-space: nowrap; }
.demo-cartes { display: grid; grid-template-columns: 1fr; gap: 10px; }
.demo-cartes > div { background: var(--paper-dim); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
.dc-label { font: 650 .95rem var(--font-head); margin-bottom: 6px; }
.dc-label .dc-compte { font: 400 .85rem var(--font-code); color: var(--ink-soft); }
.dc-file { display: flex; gap: 5px; flex-wrap: wrap; min-height: 2.2em; align-items: center; }
.dc-carte {
  display: inline-block; font: 650 .85rem var(--font-code); background: #fff; border: 1px solid var(--ink);
  border-radius: 5px; padding: 4px 7px; color: var(--ink);
}
.dc-carte.rouge { color: var(--brick); }
.dc-plus, .dc-vide { font-size: .85rem; color: var(--ink-soft); font-style: italic; }

/* ---------- visuels ---------- */
.visuel { margin: 14px 22px 0; border: 1px solid var(--line); border-radius: 10px; background: var(--card); overflow: hidden; }
.visuel .v-tete { background: var(--ink); color: #fff; padding: 7px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: .9rem; }
.visuel .v-tete strong { font: 650 1rem var(--font-head); }
.visuel .v-info { margin-left: auto; font: 13px var(--font-code); color: #cfd3e6; }
.visuel .v-corps { padding: 10px 12px; }
.visuel canvas { width: 100%; height: auto; display: block; border-radius: 6px; }
.visuel .v-ctrl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 12px 12px; font-size: .9rem; }
.visuel .v-ctrl label { display: flex; align-items: center; gap: 6px; }
.visuel select, .visuel input[type=number] { font: inherit; padding: 4px 7px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.visuel input[type=number] { width: 72px; }
.visuel .msg { padding: 0 14px 10px; font-size: .92rem; }
.visuel .msg.err { color: var(--brick); font-weight: 650; }
.v-double { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 720px) { .v-double { grid-template-columns: 1fr; } }
.v-double h4 { margin: 0 0 4px; font: 650 .95rem var(--font-head); }
.v-double .stat { font: 13px var(--font-code); margin-top: 4px; min-height: 2.6em; color: var(--ink-soft); }
.v-double .stat.err { color: var(--brick); font-family: var(--font-ui); font-weight: 650; }
.snake-cadre { background: var(--paper-dim); padding: 10px; }
.snake-score { font: 700 15px var(--font-code); }
.dpad { display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(2, 42px); gap: 4px; }
.dpad button { font: 700 15px var(--font-head); border: 1px solid var(--line); background: #fff; border-radius: 8px; cursor: pointer; line-height: 1.1; }

.attente { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--ink-soft); border-top-color: transparent; border-radius: 50%; animation: tourne .8s linear infinite; vertical-align: -2px; }
@keyframes tourne { to { transform: rotate(360deg); } }

<script>// Éditeur de code : textarea transparente par-dessus une couche de surlignage, gouttière avec numéros de ligne.
(function () {
  const MOTS_CLES = new Set("False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield".split(" "));
  const CONSTRUITS = new Set("abs all any bool dict enumerate float format int len list max min print range repr round set sorted str sum tuple type zip isinstance super object".split(" "));
  const TOKEN_RE = /(#.*$)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_][A-Za-z0-9_]*\b)|(\()/gm;

  function echapper(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function colorer(code) {
    let out = "";
    let pos = 0;
    let dernierNomIdx = -1;
    let morceaux = [];
    TOKEN_RE.lastIndex = 0;
    let m;
    while ((m = TOKEN_RE.exec(code))) {
      morceaux.push(echapper(code.slice(pos, m.index)));
      pos = TOKEN_RE.lastIndex;
      if (m[1] !== undefined) {
        morceaux.push('<span class="c">' + echapper(m[1]) + "</span>");
        dernierNomIdx = -1;
      } else if (m[2] !== undefined) {
        morceaux.push('<span class="s">' + echapper(m[2]) + "</span>");
        dernierNomIdx = -1;
      } else if (m[3] !== undefined) {
        morceaux.push('<span class="n">' + echapper(m[3]) + "</span>");
        dernierNomIdx = -1;
      } else if (m[4] !== undefined) {
        const w = m[4];
        if (MOTS_CLES.has(w)) {
          morceaux.push('<span class="k">' + w + "</span>");
          dernierNomIdx = -1;
        } else if (CONSTRUITS.has(w)) {
          morceaux.push('<span class="b">' + w + "</span>");
          dernierNomIdx = -1;
        } else {
          morceaux.push(w);
          dernierNomIdx = morceaux.length - 1;
        }
      } else if (m[5] !== undefined) {
        if (dernierNomIdx >= 0) {
          morceaux[dernierNomIdx] = '<span class="f">' + morceaux[dernierNomIdx] + "</span>";
        }
        morceaux.push("(");
        dernierNomIdx = -1;
      }
    }
    morceaux.push(echapper(code.slice(pos)));
    return morceaux.join("");
  }

  function creerEditeur(conteneur, codeInitial, options) {
    options = options || {};
    conteneur.classList.add("editeur");
    conteneur.innerHTML =
      '<div class="ed-gut"></div><div class="ed-zone"><pre class="ed-hl"></pre>' +
      '<textarea class="ed-ta" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off"></textarea></div>';
    const gut = conteneur.querySelector(".ed-gut");
    const hl = conteneur.querySelector(".ed-hl");
    const ta = conteneur.querySelector(".ed-ta");
    ta.value = codeInitial;

    function majGouttiere() {
      const n = ta.value.split("\n").length;
      let html = "";
      for (let i = 1; i <= n; i++) html += "<div>" + i + "</div>";
      gut.innerHTML = html;
    }
    function majHighlight() {
      let v = ta.value;
      if (v.endsWith("\n")) v += " ";
      hl.innerHTML = colorer(v);
    }
    function majTout() {
      majGouttiere();
      majHighlight();
    }
    function syncScroll() {
      hl.scrollTop = ta.scrollTop;
      hl.scrollLeft = ta.scrollLeft;
      gut.scrollTop = ta.scrollTop;
    }
    ta.addEventListener("input", () => {
      majTout();
      effacerErreur();
      if (options.onchange) options.onchange(ta.value);
    });
    ta.addEventListener("scroll", syncScroll);
    ta.addEventListener("keydown", (e) => {
      if (e.key === "Tab") {
        e.preventDefault();
        const s = ta.selectionStart,
          f = ta.selectionEnd;
        ta.value = ta.value.slice(0, s) + "    " + ta.value.slice(f);
        ta.selectionStart = ta.selectionEnd = s + 4;
        majTout();
        if (options.onchange) options.onchange(ta.value);
      } else if (e.key === "Enter") {
        const s = ta.selectionStart;
        const avant = ta.value.slice(0, s);
        const ligne = avant.slice(avant.lastIndexOf("\n") + 1);
        const indent = (ligne.match(/^\s*/) || [""])[0];
        const plus = /:\s*$/.test(ligne) ? "    " : "";
        if (indent || plus) {
          e.preventDefault();
          const ins = "\n" + indent + plus;
          ta.value = ta.value.slice(0, s) + ins + ta.value.slice(ta.selectionEnd);
          ta.selectionStart = ta.selectionEnd = s + ins.length;
          majTout();
          if (options.onchange) options.onchange(ta.value);
        }
      }
    });

    function marquerErreur(ligne) {
      effacerErreur();
      const d = gut.children[ligne - 1];
      if (d) d.classList.add("err");
    }
    function effacerErreur() {
      Array.from(gut.children).forEach((d) => d.classList.remove("err"));
    }

    majTout();
    return {
      getValue: () => ta.value,
      setValue: (v) => {
        ta.value = v;
        majTout();
      },
      focus: () => ta.focus(),
      marquerErreur,
      effacerErreur,
      el: ta,
    };
  }

  window.creerEditeur = creerEditeur;
  window._colorerPython = colorer;
})();
</script>
<script>// Animations liées à certains exercices. Appelées par app.js via initVisuel(container, engine, ex).
(function () {
  const COULEURS_DISQUES = ["#b3453d", "#c98a1f", "#3f8f5f", "#2e6fab", "#8a332c", "#1f7a6c", "#3a4470", "#a3691a", "#205c3c", "#1d4a70"];
  const FN_HANOI = { ex3: "hanoi", defiB: "hanoi_iteratif" };
  const FN_SNAKE = { ex4: "avancer", defi: "avancer_tore" };

  // ---------------------------------------------------------------- HANOÏ
  function initHanoiVisuel(conteneur, engine, tpId, ex) {
    const fn = FN_HANOI[ex.id] || "hanoi";
    conteneur.innerHTML =
      '<div class="v-tete"><strong>🗼 Animation</strong>' +
      '<label>n = <input type="number" class="hn-n" min="1" max="8" value="4" style="width:52px"></label>' +
      '<button class="btn discret hn-go">▶ Lancer</button>' +
      '<span class="v-info hn-info"></span></div><div class="v-corps"><canvas class="hn-cv" width="640" height="260"></canvas></div>' +
      '<div class="msg hn-msg"></div>';
    const cv = conteneur.querySelector(".hn-cv");
    const ctx = cv.getContext("2d");
    const msg = conteneur.querySelector(".hn-msg");
    const info = conteneur.querySelector(".hn-info");
    let anim = null;

    function dessiner(etats, n) {
      const W = cv.width, H = cv.height;
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = "#efece2";
      ctx.fillRect(0, 0, W, H);
      const baseY = H - 30;
      const pegX = [W * 0.2, W * 0.5, W * 0.8];
      const maxW = W * 0.27;
      ctx.fillStyle = "#7d87ad";
      ctx.fillRect(20, baseY, W - 40, 8);
      ["A", "B", "C"].forEach((nom, i) => {
        ctx.fillStyle = "#1c2541";
        ctx.fillRect(pegX[i] - 4, baseY - 150, 8, 150);
        ctx.font = "13px monospace";
        ctx.fillStyle = "#1c2541";
        ctx.textAlign = "center";
        ctx.fillText(nom, pegX[i], baseY + 24);
        const pile = etats[nom] || [];
        pile.forEach((d, k) => {
          const w = 26 + (d / n) * maxW;
          const h = 16;
          const y = baseY - 8 - (k + 1) * (h + 3);
          ctx.fillStyle = COULEURS_DISQUES[(d - 1) % COULEURS_DISQUES.length];
          ctx.strokeStyle = "#1c2541";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.roundRect(pegX[i] - w / 2, y, w, h, 4);
          ctx.fill();
          ctx.stroke();
        });
      });
    }

    async function lancer() {
      if (anim) clearInterval(anim);
      const n = Math.max(1, Math.min(8, parseInt(conteneur.querySelector(".hn-n").value) || 4));
      msg.textContent = "";
      msg.className = "msg hn-msg";
      info.textContent = "calcul…";
      const expr = "(" + fn + "(" + n + ", 0, 2, 1, init_tours(" + n + ")), _etat_hanoi())[-1]";
      let res;
      try {
        res = await engine.call(tpId, ex.id, expr);
      } catch (e) {
        msg.textContent = "Erreur : " + e.message;
        msg.className = "msg hn-msg err";
        info.textContent = "";
        return;
      }
      if (!res || res.pas_ns) {
        msg.textContent = "Exécute d'abord ton code (bouton « Exécuter »).";
        msg.className = "msg hn-msg err";
        info.textContent = "";
        return;
      }
      if (res.erreur) {
        msg.textContent = res.erreur.type + " : " + res.erreur.msg;
        msg.className = "msg hn-msg err";
        info.textContent = "";
        return;
      }
      const etat = res.val;
      if (!etat || !etat.events) {
        msg.textContent = "Pas d'information d'animation disponible.";
        info.textContent = "";
        return;
      }
      const etats = { A: [], B: [], C: [] };
      for (let d = n; d >= 1; d--) etats.A.push(d);
      dessiner(etats, n);
      let i = 0;
      const events = etat.events;
      info.textContent = "0 / " + events.length + " coups";
      const delai = Math.max(35, 700 - events.length * 4);
      anim = setInterval(() => {
        if (i >= events.length) {
          clearInterval(anim);
          info.textContent = events.length + " coups joués";
          return;
        }
        const genre = events[i][0], peg = events[i][1], disque = events[i][2];
        if (genre === "+") etats[peg].push(disque);
        else etats[peg].pop();
        dessiner(etats, n);
        i++;
        info.textContent = i + " / " + events.length + " coups";
      }, delai);
    }
    conteneur.querySelector(".hn-go").addEventListener("click", lancer);
    dessiner({ A: [4, 3, 2, 1], B: [], C: [] }, 4);
  }

  // ---------------------------------------------------------------- SNAKE
  function initSnakeVisuel(conteneur, engine, tpId, ex) {
    const fn = FN_SNAKE[ex.id] || "avancer";
    conteneur.innerHTML =
      '<div class="v-tete"><strong>🐍 Joue avec ta fonction</strong>' +
      '<span class="v-info sk-score">score : 0</span></div>' +
      '<div class="v-corps snake-cadre"><canvas class="sk-cv" width="400" height="400"></canvas></div>' +
      '<div class="v-ctrl"><button class="btn primaire sk-go">▶ Nouvelle partie</button>' +
      '<div class="dpad">' +
      '<button class="haut" data-d="haut">Z<small>▲</small></button><button class="gauche" data-d="gauche">Q<small>◀</small></button>' +
      '<button class="bas" data-d="bas">S<small>▼</small></button><button class="droite" data-d="droite">D<small>▶</small></button></div>' +
      '<span class="raccourci">clique dans la grille puis utilise Z Q S D (les flèches marchent aussi)</span></div>' +
      '<div class="msg sk-msg"></div>';
    const cv = conteneur.querySelector(".sk-cv");
    const ctx = cv.getContext("2d");
    const scoreEl = conteneur.querySelector(".sk-score");
    const msg = conteneur.querySelector(".sk-msg");
    const L = 16, H = 16;
    let boucle = null, dirCourante = "droite", enCours = false;

    function dessiner(etat) {
      const cs = cv.width / etat.l;
      ctx.fillStyle = "#efece2";
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = "#3f8f5f";
      etat.corps.forEach(function (c) { ctx.fillRect(c[0] * cs + 1, c[1] * cs + 1, cs - 2, cs - 2); });
      if (etat.corps.length) {
        const t = etat.corps[etat.corps.length - 1];
        ctx.fillStyle = "#1c2541";
        ctx.fillRect(t[0] * cs + 1, t[1] * cs + 1, cs - 2, cs - 2);
      }
      if (etat.pomme) {
        ctx.fillStyle = "#b3453d";
        ctx.beginPath();
        ctx.arc(etat.pomme[0] * cs + cs / 2, etat.pomme[1] * cs + cs / 2, cs * 0.38, 0, 7);
        ctx.fill();
      }
      scoreEl.textContent = "score : " + etat.score;
      if (etat.statut !== "ok") {
        clearInterval(boucle);
        enCours = false;
        if (etat.statut === "mort") {
          msg.textContent = "Perdu ! Score final : " + etat.score;
          msg.className = "msg sk-msg err";
        } else if (etat.statut === "erreur") {
          msg.textContent = "Erreur : " + etat.message;
          msg.className = "msg sk-msg err";
        } else if (etat.statut === "gagne") {
          msg.textContent = "Grille remplie, bravo !";
          msg.className = "msg sk-msg";
        }
      }
    }

    async function tick() {
      let res;
      try {
        res = await engine.call(tpId, ex.id, "_jeu_pas('" + dirCourante + "')");
      } catch (e) {
        clearInterval(boucle);
        enCours = false;
        msg.textContent = "Erreur : " + e.message;
        msg.className = "msg sk-msg err";
        return;
      }
      dessiner(res.val || res);
    }

    async function nouvellePartie() {
      if (boucle) clearInterval(boucle);
      msg.textContent = "";
      dirCourante = "droite";
      const graine = Math.floor(Math.random() * 100000);
      const expr = "_jeu_nouveau(" + L + ", " + H + ", " + graine + ", '" + fn + "')";
      let res;
      try {
        res = await engine.call(tpId, ex.id, expr);
      } catch (e) {
        msg.textContent = "Erreur : " + e.message;
        msg.className = "msg sk-msg err";
        return;
      }
      if (!res || res.pas_ns) {
        msg.textContent = "Exécute d'abord ton code (bouton « Exécuter »).";
        msg.className = "msg sk-msg err";
        return;
      }
      dessiner(res.val || res);
      enCours = true;
      boucle = setInterval(tick, 160);
    }

    function tourner(d) {
      if (!enCours) return;
      dirCourante = d;
    }
    conteneur.querySelectorAll(".dpad button").forEach(function (b) { b.addEventListener("click", function () { tourner(b.dataset.d); }); });
    cv.tabIndex = 0;
    cv.addEventListener("keydown", function (e) {
      const map = { ArrowUp: "haut", ArrowDown: "bas", ArrowLeft: "gauche", ArrowRight: "droite", z: "haut", s: "bas", q: "gauche", d: "droite" };
      if (map[e.key]) {
        e.preventDefault();
        tourner(map[e.key]);
      }
    });
    conteneur.querySelector(".sk-go").addEventListener("click", nouvellePartie);
    ctx.fillStyle = "#efece2";
    ctx.fillRect(0, 0, cv.width, cv.height);
  }

  // ---------------------------------------------------------------- LABYRINTHE
  function initMazeVisuel(conteneur, engine, tpId, ex, algos) {
    const double = algos.length > 1;
    let panneaux = "";
    const titres = { pile: "Pile (profondeur)", file: "File (largeur)" };
    algos.forEach(function (a) {
      panneaux +=
        '<div><h4>' + titres[a] + '</h4><canvas class="mz-cv" data-a="' + a + '" width="360" height="360"></canvas>' +
        '<div class="stat" data-a="' + a + '"></div></div>';
    });
    conteneur.innerHTML =
      '<div class="v-tete"><strong>🧭 Parcours</strong>' +
      '<label>taille <select class="mz-taille"><option value="15,11">petit</option><option value="21,15" selected>moyen</option><option value="31,21">grand</option></select></label>' +
      '<label>boucles <select class="mz-boucles"><option value="0">aucune</option><option value="0.15">un peu</option><option value="0.3" selected>quelques-unes</option></select></label>' +
      '<button class="btn primaire mz-go">▶ Nouveau labyrinthe</button></div>' +
      '<div class="v-corps"><div class="' + (double ? "v-double" : "") + '">' + panneaux + "</div></div>" +
      '<div class="msg mz-msg"></div>';
    const msg = conteneur.querySelector(".mz-msg");
    let anims = [];

    function dessinerGrille(ctx, grille, cs) {
      ctx.fillStyle = "#efece2";
      ctx.fillRect(0, 0, grille[0].length * cs, grille.length * cs);
      for (let y = 0; y < grille.length; y++) {
        for (let x = 0; x < grille[y].length; x++) {
          if (grille[y][x] === "#") {
            ctx.fillStyle = "#1c2541";
            ctx.fillRect(x * cs, y * cs, cs, cs);
          }
        }
      }
    }

    async function lancer() {
      anims.forEach(function (a) { clearInterval(a); });
      anims = [];
      msg.textContent = "";
      const taille = conteneur.querySelector(".mz-taille").value.split(",").map(Number);
      const largeur = taille[0], hauteur = taille[1];
      const boucles = parseFloat(conteneur.querySelector(".mz-boucles").value);
      const graine = Math.floor(Math.random() * 100000);
      const algosJs = "[" + algos.map(function (a) { return "'" + a + "'"; }).join(",") + "]";
      const expr = "_lab_compare(" + algosJs + ", " + largeur + ", " + hauteur + ", " + graine + ", " + boucles + ", True)";
      let res;
      try {
        res = await engine.call(tpId, ex.id, expr);
      } catch (e) {
        msg.textContent = "Erreur : " + e.message;
        msg.className = "msg mz-msg err";
        return;
      }
      if (!res || res.pas_ns) {
        msg.textContent = "Exécute d'abord ton code (bouton « Exécuter »).";
        msg.className = "msg mz-msg err";
        return;
      }
      if (res.erreur) {
        msg.textContent = res.erreur.type + " : " + res.erreur.msg;
        msg.className = "msg mz-msg err";
        return;
      }
      const data = res.val;
      const grille = data.grille;
      const cs = Math.floor(360 / Math.max(grille.length, grille[0].length));
      algos.forEach(function (a) {
        const cv = conteneur.querySelector('.mz-cv[data-a="' + a + '"]');
        const statEl = conteneur.querySelector('.stat[data-a="' + a + '"]');
        cv.width = grille[0].length * cs;
        cv.height = grille.length * cs;
        const ctx = cv.getContext("2d");
        dessinerGrille(ctx, grille, cs);
        const r = data.res[a];
        if (!r) return;
        if (r.erreur) {
          statEl.textContent = r.erreur;
          statEl.className = "stat err";
          return;
        }
        const visites = r.visites;
        let i = 0;
        const delai = Math.max(6, Math.floor(900 / visites.length));
        const anim = setInterval(function () {
          if (i >= visites.length) {
            clearInterval(anim);
            if (r.chemin && r.chemin.length) {
              ctx.strokeStyle = "#b3453d";
              ctx.lineWidth = Math.max(2, cs * 0.3);
              ctx.beginPath();
              r.chemin.forEach(function (c, k) {
                const cx = c[0] * cs + cs / 2, cy = c[1] * cs + cs / 2;
                if (k === 0) ctx.moveTo(cx, cy);
                else ctx.lineTo(cx, cy);
              });
              ctx.stroke();
              statEl.textContent = visites.length + " cases explorées · chemin de " + (r.chemin.length - 1) + " pas";
            } else {
              statEl.textContent = visites.length + " cases explorées · arrivée non atteinte";
            }
            statEl.className = "stat";
            return;
          }
          const c = visites[i];
          ctx.fillStyle = "#9fc8e8";
          ctx.fillRect(c[0] * cs + 1, c[1] * cs + 1, cs - 2, cs - 2);
          i++;
        }, delai);
        anims.push(anim);
      });
      const d = data.depart, a2 = data.arrivee;
      algos.forEach(function (a) {
        const cv = conteneur.querySelector('.mz-cv[data-a="' + a + '"]');
        const ctx = cv.getContext("2d");
        ctx.fillStyle = "#3f8f5f";
        ctx.fillRect(d[0] * cs + 3, d[1] * cs + 3, cs - 6, cs - 6);
        ctx.fillStyle = "#c98a1f";
        ctx.fillRect(a2[0] * cs + 3, a2[1] * cs + 3, cs - 6, cs - 6);
      });
    }
    conteneur.querySelector(".mz-go").addEventListener("click", lancer);
  }

  window.initVisuel = function (conteneur, engine, tpId, ex) {
    if (ex.visuel === "hanoi") initHanoiVisuel(conteneur, engine, tpId, ex);
    else if (ex.visuel === "snake") initSnakeVisuel(conteneur, engine, tpId, ex);
    else if (ex.visuel === "maze_pile") initMazeVisuel(conteneur, engine, tpId, ex, ["pile"]);
    else if (ex.visuel === "maze_both") initMazeVisuel(conteneur, engine, tpId, ex, ["pile", "file"]);
  };
})();
</script>
<script>// Démos « avant de coder » : purement JS (aucun appel à Pyodide), pour comprendre les règles
// avant d'écrire la moindre ligne de Python. Placées en tête de TP, avant les exercices.
(function () {
  // ================================================================== HANOÏ
  function initDemoHanoi(conteneur) {
    conteneur.innerHTML =
      '<h3>🗼 À toi de jouer</h3>' +
      '<p>Clique sur une tour de départ, puis sur une tour d\'arrivée. Objectif : tout transférer sur la tour C, un seul disque à la fois, jamais un grand disque sur un plus petit.</p>' +
      '<div class="demo-ctrl"><label>Disques <select class="dh-n"><option>3</option><option>4</option><option selected>5</option></select></label>' +
      '<button class="btn discret dh-reset">↺ Recommencer</button><strong class="dh-count">0 déplacement</strong></div>' +
      '<canvas class="dh-cv" width="640" height="260"></canvas>' +
      '<p class="dh-msg" role="status"></p>';
    const cv = conteneur.querySelector(".dh-cv");
    const ctx = cv.getContext("2d");
    const msg = conteneur.querySelector(".dh-msg");
    const compteurEl = conteneur.querySelector(".dh-count");
    const COULEURS = ["#b3453d", "#c98a1f", "#3f8f5f", "#2e6fab", "#8a332c", "#1f7a6c", "#3a4470", "#a3691a", "#205c3c", "#1d4a70"];
    let tours, n, selection, compteur;

    function init() {
      n = parseInt(conteneur.querySelector(".dh-n").value);
      tours = [[], [], []];
      for (let d = n; d >= 1; d--) tours[0].push(d);
      selection = null;
      compteur = 0;
      compteurEl.textContent = "0 déplacement";
      msg.textContent = "Clique sur une tour de départ.";
      dessiner();
    }

    function dessiner() {
      const W = cv.width, H = cv.height;
      ctx.fillStyle = "#efece2";
      ctx.fillRect(0, 0, W, H);
      const baseY = H - 30;
      const pegX = [W * 0.2, W * 0.5, W * 0.8];
      const maxW = W * 0.27;
      ctx.fillStyle = "#7d87ad";
      ctx.fillRect(20, baseY, W - 40, 8);
      ["A", "B", "C"].forEach((nom, i) => {
        ctx.fillStyle = selection === i ? "#b3453d" : "#1c2541";
        ctx.fillRect(pegX[i] - (selection === i ? 6 : 4), baseY - 150, selection === i ? 12 : 8, 150);
        ctx.font = "14px 'Space Grotesk', sans-serif";
        ctx.fillStyle = "#1c2541";
        ctx.textAlign = "center";
        ctx.fillText(nom, pegX[i], baseY + 24);
        tours[i].forEach((d, k) => {
          const w = 26 + (d / n) * maxW;
          const h = 16;
          const y = baseY - 8 - (k + 1) * (h + 3);
          ctx.fillStyle = COULEURS[(d - 1) % COULEURS.length];
          ctx.strokeStyle = "#1c2541";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.roundRect(pegX[i] - w / 2, y, w, h, 4);
          ctx.fill();
          ctx.stroke();
        });
      });
    }

    function clicSur(i) {
      if (selection === null) {
        if (tours[i].length === 0) {
          msg.textContent = "Cette tour est vide : choisis-en une avec au moins un disque.";
          return;
        }
        selection = i;
        msg.textContent = "Maintenant, clique sur la tour d'arrivée.";
        dessiner();
        return;
      }
      if (i === selection) {
        selection = null;
        msg.textContent = "Sélection annulée. Clique sur une tour de départ.";
        dessiner();
        return;
      }
      const depart = selection;
      selection = null;
      const disque = tours[depart][tours[depart].length - 1];
      const sommetArrivee = tours[i][tours[i].length - 1];
      if (sommetArrivee !== undefined && sommetArrivee < disque) {
        msg.textContent = "Coup interdit : on ne pose pas un disque sur un plus petit.";
        dessiner();
        return;
      }
      tours[i].push(tours[depart].pop());
      compteur++;
      compteurEl.textContent = compteur + (compteur > 1 ? " déplacements" : " déplacement");
      dessiner();
      if (tours[2].length === n) {
        msg.textContent = "🎉 Terminé en " + compteur + " déplacements ! Peux-tu faire mieux ? (minimum possible : " + (2 ** n - 1) + ")";
      } else {
        msg.textContent = "Clique sur une tour de départ.";
      }
    }

    cv.addEventListener("click", (ev) => {
      const rect = cv.getBoundingClientRect();
      const x = (ev.clientX - rect.left) * (cv.width / rect.width);
      const zone = Math.floor(x / (cv.width / 3));
      clicSur(Math.max(0, Math.min(2, zone)));
    });
    conteneur.querySelector(".dh-reset").addEventListener("click", init);
    conteneur.querySelector(".dh-n").addEventListener("change", init);
    init();
  }

  // ================================================================== BATAILLE
  function initDemoBataille(conteneur) {
    conteneur.innerHTML =
      '<h3>🃏 Regarde une partie avant de coder</h3>' +
      '<p>Alice et Bob jouent chacun la carte du dessus de leur file. Le gagnant récupère les deux cartes — <strong>la sienne d\'abord</strong> — à la queue de sa file.</p>' +
      '<div class="demo-cartes"><div><div class="dc-label">Alice <span class="dc-compte alice"></span></div><div class="dc-file alice"></div></div>' +
      '<div><div class="dc-label">Bob <span class="dc-compte bob"></span></div><div class="dc-file bob"></div></div></div>' +
      '<p class="dc-statut" role="status"></p>' +
      '<div class="demo-ctrl"><button class="btn primaire dc-step">▶ Jouer un tour</button>' +
      '<button class="btn discret dc-auto">▶▶ Partie automatique</button><button class="btn discret dc-pause" disabled>⏸ Pause</button>' +
      '<button class="btn discret dc-egalite">🎲 Provoquer une égalité</button><button class="btn discret dc-reset">↺ Mélanger, recommencer</button></div>';
    const statut = conteneur.querySelector(".dc-statut");
    const compteAlice = conteneur.querySelector(".dc-compte.alice");
    const compteBob = conteneur.querySelector(".dc-compte.bob");
    const fileAliceEl = conteneur.querySelector(".dc-file.alice");
    const fileBobEl = conteneur.querySelector(".dc-file.bob");
    const NOMS = { 11: "V", 12: "D", 13: "R", 14: "As" };
    let alice, bob, auto, tours;

    function nomCarte(c) {
      return (NOMS[c[0]] || c[0]) + c[1];
    }
    function nouveauPaquet(graine) {
      const coul = ["♠", "♥", "♦", "♣"];
      let p = [];
      for (const c of coul) for (let v = 2; v <= 14; v++) p.push([v, c]);
      let s = graine;
      const rnd = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
      for (let i = p.length - 1; i > 0; i--) {
        const j = Math.floor(rnd() * (i + 1));
        const tmp = p[i]; p[i] = p[j]; p[j] = tmp;
      }
      return p;
    }
    function init() {
      const p = nouveauPaquet(Date.now() % 100000);
      alice = p.filter((_, i) => i % 2 === 0);
      bob = p.filter((_, i) => i % 2 === 1);
      tours = 0;
      if (auto) { clearInterval(auto); auto = null; }
      conteneur.querySelector(".dc-pause").disabled = true;
      statut.textContent = "Prêt. Clique sur « Jouer un tour ».";
      dessiner();
    }
    function dessiner() {
      compteAlice.textContent = "(" + alice.length + " cartes)";
      compteBob.textContent = "(" + bob.length + " cartes)";
      const rendu = (f) => f.slice(0, 8).map((c) => '<span class="dc-carte' + (c[1] === "♥" || c[1] === "♦" ? " rouge" : "") + '">' + nomCarte(c) + "</span>").join("") + (f.length > 8 ? '<span class="dc-plus">+' + (f.length - 8) + "</span>" : "");
      fileAliceEl.innerHTML = alice.length ? rendu(alice) : '<span class="dc-vide">(vide)</span>';
      fileBobEl.innerHTML = bob.length ? rendu(bob) : '<span class="dc-vide">(vide)</span>';
    }
    function unTour() {
      if (alice.length === 0 || bob.length === 0) {
        arreter();
        statut.textContent = alice.length === 0 ? "Bob remporte la partie ! Alice n'a plus de carte." : "Alice remporte la partie ! Bob n'a plus de carte.";
        return;
      }
      const pot = [];
      let recit = [];
      let gagnant = null;
      while (gagnant === null) {
        const ca = alice.shift(), cb = bob.shift();
        pot.push(ca, cb);
        recit.push(nomCarte(ca) + " vs " + nomCarte(cb));
        if (ca[0] > cb[0]) gagnant = "alice";
        else if (cb[0] > ca[0]) gagnant = "bob";
        else if (alice.length === 0) gagnant = "bob";
        else if (bob.length === 0) gagnant = "alice";
      }
      tours++;
      const dst = gagnant === "alice" ? alice : bob;
      for (let k = 0; k < pot.length; k += 2) {
        if (gagnant === "alice") dst.push(pot[k], pot[k + 1]);
        else dst.push(pot[k + 1], pot[k]);
      }
      const bataille = recit.length > 1;
      statut.textContent = "Tour " + tours + " — " + recit.join(" → puis, à égalité, ") + " : " + (gagnant === "alice" ? "Alice" : "Bob") + " remporte" + (bataille ? " la bataille" : " le tour") + " (" + pot.length + " carte" + (pot.length > 1 ? "s" : "") + ").";
      dessiner();
      if (alice.length === 0 || bob.length === 0) {
        arreter();
        statut.textContent += " Partie terminée !";
      }
      if (tours >= 1000) {
        arreter();
        statut.textContent = "Arrêt après 1000 tours (cette partie tourne en boucle) — c'est justement le sujet de l'exercice 4 du TP.";
      }
    }
    function provoquerEgalite() {
      if (alice.length === 0 || bob.length === 0) return;
      const valeur = alice[0][0];
      const idx = bob.findIndex((c) => c[0] === valeur);
      if (idx > 0) {
        const tmp = bob[0]; bob[0] = bob[idx]; bob[idx] = tmp;
      } else {
        bob.unshift([valeur, bob[0][1] === "♠" ? "♥" : "♠"]);
      }
      statut.textContent = "Prochain tour truqué pour provoquer une égalité — clique sur « Jouer un tour ».";
      dessiner();
    }
    function arreter() {
      if (auto) { clearInterval(auto); auto = null; }
      conteneur.querySelector(".dc-pause").disabled = true;
    }
    conteneur.querySelector(".dc-step").addEventListener("click", unTour);
    conteneur.querySelector(".dc-egalite").addEventListener("click", provoquerEgalite);
    conteneur.querySelector(".dc-reset").addEventListener("click", init);
    conteneur.querySelector(".dc-auto").addEventListener("click", () => {
      if (auto) return;
      conteneur.querySelector(".dc-pause").disabled = false;
      auto = setInterval(unTour, 450);
    });
    conteneur.querySelector(".dc-pause").addEventListener("click", arreter);
    init();
  }

  // ================================================================== SNAKE
  function initDemoSnake(conteneur) {
    conteneur.innerHTML =
      '<h3>🐍 Une tête arrive. Que devient la queue ?</h3>' +
      '<p>Le serpent avance tout droit. Observe la liste qui représente son corps : elle est affichée <strong>de la queue vers la tête</strong>, exactement comme tu la manipuleras en Python.</p>' +
      '<div class="demo-layout"><canvas class="ds-cv" width="320" height="320"></canvas>' +
      '<div><div class="ds-liste"></div><p class="ds-statut" role="status"></p>' +
      '<div class="demo-ctrl"><button class="btn primaire ds-step">▶ Un déplacement</button>' +
      '<button class="btn discret ds-auto">▶▶ Lecture</button><button class="btn discret ds-pause" disabled>⏸ Pause</button>' +
      '<button class="btn discret ds-pomme">🍎 Scénario « pomme mangée »</button><button class="btn discret ds-reset">↺ Recommencer</button></div></div></div>';
    const cv = conteneur.querySelector(".ds-cv");
    const ctx = cv.getContext("2d");
    const listeEl = conteneur.querySelector(".ds-liste");
    const statut = conteneur.querySelector(".ds-statut");
    const N = 10, CS = cv.width / N;
    let corps, pomme, auto;

    function init() {
      corps = [[2, 4], [3, 4], [4, 4]];
      pomme = null;
      if (auto) { clearInterval(auto); auto = null; }
      conteneur.querySelector(".ds-pause").disabled = true;
      statut.textContent = "Prêt. Clique sur « Un déplacement ».";
      dessiner();
    }
    function dessiner(supprime) {
      ctx.fillStyle = "#efece2";
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.strokeStyle = "#dcd6c4";
      for (let i = 0; i <= N; i++) {
        ctx.beginPath(); ctx.moveTo(i * CS, 0); ctx.lineTo(i * CS, cv.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * CS); ctx.lineTo(cv.width, i * CS); ctx.stroke();
      }
      if (supprime) {
        ctx.fillStyle = "#f6e6e4";
        ctx.fillRect(supprime[0] * CS + 1, supprime[1] * CS + 1, CS - 2, CS - 2);
        ctx.fillStyle = "#b3453d";
        ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("×", supprime[0] * CS + CS / 2, supprime[1] * CS + CS / 2);
      }
      corps.forEach((c, i) => {
        ctx.fillStyle = i === corps.length - 1 ? "#1c2541" : "#3f8f5f";
        ctx.fillRect(c[0] * CS + 1, c[1] * CS + 1, CS - 2, CS - 2);
      });
      if (corps.length) {
        const t = corps[corps.length - 1];
        ctx.fillStyle = "#fff"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("T", t[0] * CS + CS / 2, t[1] * CS + CS / 2);
      }
      if (pomme) {
        ctx.fillStyle = "#b3453d";
        ctx.beginPath(); ctx.arc(pomme[0] * CS + CS / 2, pomme[1] * CS + CS / 2, CS * 0.32, 0, 7); ctx.fill();
      }
      listeEl.innerHTML = "<code>corps = [" + corps.map((c) => "(" + c[0] + "," + c[1] + ")").join(", ") + "]</code>";
    }
    function step() {
      const hx = corps[corps.length - 1][0], hy = corps[corps.length - 1][1];
      const nt = [hx + 1, hy];
      if (nt[0] >= N) {
        statut.textContent = "Mur atteint (x = " + nt[0] + " ≥ " + N + ") : dans ton code, ce sera la condition de mort.";
        arreter();
        return;
      }
      const mange = pomme && nt[0] === pomme[0] && nt[1] === pomme[1];
      corps.push(nt);
      let supprime = null;
      if (!mange) {
        supprime = corps.shift();
      } else {
        pomme = null;
      }
      dessiner(supprime);
      statut.textContent = mange
        ? "Pomme mangée : on enfile la tête, mais on NE défile PAS la queue — le serpent grandit d'une case."
        : "Avance normale : on enfile la nouvelle tête ET on défile la queue — la taille ne change pas.";
    }
    function scenarioPomme() {
      init();
      const hx = corps[corps.length - 1][0], hy = corps[corps.length - 1][1];
      pomme = [hx + 1, hy];
      dessiner();
      statut.textContent = "Une pomme est placée juste devant la tête. Prédis ce que devient la liste, puis clique sur « Un déplacement ».";
    }
    function arreter() {
      if (auto) { clearInterval(auto); auto = null; }
      conteneur.querySelector(".ds-pause").disabled = true;
    }
    conteneur.querySelector(".ds-step").addEventListener("click", step);
    conteneur.querySelector(".ds-reset").addEventListener("click", init);
    conteneur.querySelector(".ds-pomme").addEventListener("click", scenarioPomme);
    conteneur.querySelector(".ds-auto").addEventListener("click", () => {
      if (auto) return;
      conteneur.querySelector(".ds-pause").disabled = false;
      auto = setInterval(step, 500);
    });
    conteneur.querySelector(".ds-pause").addEventListener("click", arreter);
    init();
  }

  window.initDemoTP = function (conteneur, type) {
    if (type === "hanoi") initDemoHanoi(conteneur);
    else if (type === "bataille") initDemoBataille(conteneur);
    else if (type === "snake") initDemoSnake(conteneur);
  };
})();
</script>
<script>
const TP_LIST = [{"id": "tp1", "num": 1, "slug": "hanoi", "titre": "Les tours de Hanoï", "titre_court": "Tours de Hanoï", "sous_titre": "Piles : interface, récursivité, animation", "duree": "1 h 30 – 2 h", "emoji": "🗼", "accent": "#2e6fab", "objectifs": ["Manipuler une pile uniquement par son interface (`empiler`, `depiler`, `sommet`, `est_vide`).", "Modéliser un problème avec plusieurs piles et respecter des contraintes de coups.", "Écrire un algorithme récursif et le relier à la pile d'appels.", "Implémenter une pile (défi) et dérécursiver un algorithme avec une pile explicite (défi)."], "intro_html": "<h2>Rappel : la pile (LIFO)</h2>\n<p>Une <strong>pile</strong> est une structure de données dans laquelle on ne peut agir que sur le <strong>sommet</strong> : le dernier élément arrivé est le premier à sortir (*Last In, First Out*). Pense à une pile d&#x27;assiettes.</p>\n<table><thead><tr><th>Opération</th><th>Effet</th></tr></thead><tbody><tr><td><code>p = Pile()</code></td><td>crée une pile vide</td></tr><tr><td><code>p.est_vide()</code></td><td>renvoie <code>True</code> si la pile est vide</td></tr><tr><td><code>p.empiler(x)</code></td><td>pose <code>x</code> au sommet</td></tr><tr><td><code>p.depiler()</code></td><td>retire le sommet <strong>et le renvoie</strong> (erreur si la pile est vide)</td></tr><tr><td><code>p.sommet()</code></td><td>renvoie le sommet <strong>sans le retirer</strong></td></tr><tr><td><code>p.taille()</code></td><td>nombre d&#x27;éléments</td></tr></tbody></table>\n<div class=\"adm adm-astuce\"><p class=\"adm-titre\">Interface et implémentation</p><p>Dans ce TP, la classe <code>Pile</code> est <strong>déjà écrite</strong> : tu l&#x27;utilises sans savoir comment elle est codée. C&#x27;est tout l&#x27;intérêt d&#x27;une *interface*. Tu écriras ta propre version dans le défi A.</p></div>\n<p>Trois outils te sont fournis pour le jeu : <code>init_tours(n)</code> crée les trois tours <code>A</code>, <code>B</code>, <code>C</code> avec <code>n</code> disques sur <code>A</code> ; <code>contenu(p)</code> renvoie le contenu d&#x27;une pile <strong>pour l&#x27;afficher</strong> (du bas vers le sommet) ; <code>nb_coups_effectues()</code> compte les disques déplacés.</p>", "prelude": "\n_journal = []\n_ops = [0]\n_init = [None]\n_MAX_JOURNAL = 60000\n\n\nclass Pile:\n    \"\"\"Pile (LIFO). Interface : est_vide, empiler, depiler, sommet, taille.\"\"\"\n\n    def __init__(self, nom=\"\"):\n        self._elts = []\n        self.nom = nom\n\n    def est_vide(self):\n        return len(self._elts) == 0\n\n    def empiler(self, x):\n        _ops[0] += 1\n        self._elts.append(x)\n        if self.nom and len(_journal) < _MAX_JOURNAL:\n            _journal.append((\"+\", self.nom, x))\n\n    def depiler(self):\n        if len(self._elts) == 0:\n            raise IndexError(\"depiler : la pile est vide\")\n        _ops[0] += 1\n        x = self._elts.pop()\n        if self.nom and len(_journal) < _MAX_JOURNAL:\n            _journal.append((\"-\", self.nom, x))\n        return x\n\n    def sommet(self):\n        if len(self._elts) == 0:\n            raise IndexError(\"sommet : la pile est vide\")\n        return self._elts[-1]\n\n    def taille(self):\n        return len(self._elts)\n\n    def __repr__(self):\n        if not self._elts:\n            return \"Pile(vide)\"\n        return \"Pile(\" + \", \".join(repr(x) for x in self._elts) + \" <- sommet)\"\n\n\ndef init_tours(n):\n    \"\"\"Renvoie la liste [A, B, C] de trois piles ; les n disques (n en bas, 1 au sommet) sont sur A.\"\"\"\n    tours = [Pile(\"A\"), Pile(\"B\"), Pile(\"C\")]\n    for d in range(n, 0, -1):\n        tours[0].empiler(d)\n    _journal.clear()\n    _init[0] = n\n    return tours\n\n\ndef contenu(pile):\n    \"\"\"Contenu d'une pile sous forme de liste (bas -> sommet). Pour l'affichage et les tests uniquement.\"\"\"\n    return list(pile._elts)\n\n\ndef nb_coups_effectues():\n    \"\"\"Nombre de disques déplacés depuis le dernier init_tours.\"\"\"\n    return len(_journal) // 2\n\n\ndef _etat_hanoi():\n    if _init[0] is None:\n        return None\n    return {\"n\": _init[0], \"events\": [list(e) for e in _journal]}\n", "exercices": [{"id": "warmup", "kind": "exercice", "titre": "Échauffement : une liste, pas encore une pile !", "abbr": "E1", "enonce_html": "<p>Avant de commencer sur les piles, on s&#x27;assure que manipuler une <strong>liste Python normale</strong> est bien à l&#x27;aise pour toi. Rien de nouveau ici : de l&#x27;indexation, une boucle, et <code>.append()</code>.</p>\n<p>Écris trois fonctions :</p>\n<ul><li><code>dernier_element(liste)</code> renvoie le dernier élément de <code>liste</code> (on garantit qu&#x27;elle n&#x27;est jamais vide) ;</li><li><code>somme(liste)</code> renvoie la somme de tous les éléments de <code>liste</code> (utilise une boucle <code>for</code>, pas <code>sum()</code>) ;</li><li><code>ajoute_deux_fois(liste, x)</code> ajoute <code>x</code> à la fin de <code>liste</code>, <strong>deux fois de suite</strong>, et ne renvoie rien.</li></ul>\n<div class=\"adm adm-astuce\"><p class=\"adm-titre\">Rappel</p><p>Le dernier élément d&#x27;une liste <code>l</code> est <code>l[-1]</code> ou, de façon équivalente, <code>l[len(l) - 1]</code>. Pour ajouter un élément à la fin, on utilise <code>l.append(x)</code>.</p></div>", "starter": "def dernier_element(liste):\n    \"\"\"Renvoie le dernier élément de liste (non vide).\"\"\"\n    pass\n\n\ndef somme(liste):\n    \"\"\"Renvoie la somme des éléments de liste, avec une boucle for.\"\"\"\n    pass\n\n\ndef ajoute_deux_fois(liste, x):\n    \"\"\"Ajoute x à la fin de liste, deux fois de suite. Ne renvoie rien.\"\"\"\n    pass\n\n\nprint(dernier_element([3, 7, 1]))\nprint(somme([3, 7, 1]))\nl = [1, 2]\najoute_deux_fois(l, 9)\nprint(l)\n", "tests": "\negal(\"dernier_element([3, 7, 1]) == 1\", lambda: dernier_element([3, 7, 1]), 1)\negal(\"dernier_element([42]) == 42\", lambda: dernier_element([42]), 42)\negal(\"dernier_element([5, 5, 5, 9]) == 9\", lambda: dernier_element([5, 5, 5, 9]), 9)\negal(\"somme([3, 7, 1]) == 11\", lambda: somme([3, 7, 1]), 11)\negal(\"somme([]) == 0\", lambda: somme([]), 0)\negal(\"somme([10]) == 10\", lambda: somme([10]), 10)\negal(\"somme([1, -1, 2, -2]) == 0\", lambda: somme([1, -1, 2, -2]), 0)\n_l = [1, 2]\negal(\"ajoute_deux_fois ne renvoie rien (None)\", lambda: ajoute_deux_fois(_l, 9), None)\negal(\"... et la liste devient [1, 2, 9, 9]\", lambda: _l, [1, 2, 9, 9])\n_l2 = []\najoute_deux_fois(_l2, \"a\")\negal(\"marche aussi sur une liste vide au départ\", lambda: _l2, [\"a\", \"a\"])\n", "aide_code": null, "visuel": null, "indices_html": ["<p><code>dernier_element</code> tient en une ligne : <code>return liste[-1]</code>. Pour <code>somme</code>, initialise <code>total = 0</code> avant la boucle, puis <code>total = total + x</code> (ou <code>total += x</code>) à chaque tour. Pour <code>ajoute_deux_fois</code>, deux lignes <code>liste.append(x)</code> suffisent.</p>"]}, {"id": "ex1", "kind": "exercice", "titre": "Prendre la pile en main", "abbr": "E2", "enonce_html": "<p><strong>Partie A – Prédire.</strong> Avant d&#x27;exécuter, écris sur ton brouillon ce que le programme affiche. Puis vérifie.</p>\n<p><strong>Partie B – Écrire.</strong> Complète les deux fonctions ci-dessous <strong>en utilisant une <code>Pile</code></strong> (pas de <code>[::-1]</code>, pas de <code>reverse()</code>, pas de <code>pop()</code> de liste).</p>\n<ul><li><code>inverser(liste)</code> renvoie une <strong>nouvelle</strong> liste avec les éléments dans l&#x27;ordre inverse.</li><li><code>est_palindrome(mot)</code> renvoie <code>True</code> si <code>mot</code> se lit de la même façon dans les deux sens.</li></ul>\n<div class=\"adm adm-astuce\"><p class=\"adm-titre\">Idée</p><p>Empile tous les éléments : à la sortie, ils reviennent dans l&#x27;ordre inverse.</p></div>", "starter": "# --- Partie A : prédire, puis exécuter pour vérifier ---\np = Pile()\np.empiler(4)\np.empiler(7)\np.empiler(1)\nprint(p.depiler())\nprint(p.sommet())\np.empiler(9)\nprint(p.depiler(), p.depiler())\nprint(p.est_vide())\n# Ma prévision : ...\n\n\n# --- Partie B : à compléter ---\ndef inverser(liste):\n    \"\"\"Renvoie une nouvelle liste : les éléments de liste dans l'ordre inverse.\"\"\"\n    pass\n\n\ndef est_palindrome(mot):\n    \"\"\"Renvoie True si mot est un palindrome (ex. 'radar'), False sinon.\"\"\"\n    pass\n", "tests": "\negal(\"inverser([1, 2, 3]) == [3, 2, 1]\", lambda: inverser([1, 2, 3]), [3, 2, 1])\negal(\"inverser([]) == []\", lambda: inverser([]), [])\negal(\"inverser(['a', 'b']) == ['b', 'a']\", lambda: inverser(['a', 'b']), ['b', 'a'])\n_l = [5, 6, 7]\ninverser(_l)\nvrai(\"inverser ne modifie pas la liste d'origine\", lambda: _l == [5, 6, 7])\ndef _usage(f, arg):\n    _ops[0] = 0\n    f(arg)\n    return _ops[0]\nvrai(\"inverser utilise bien une Pile (empiler/depiler)\", lambda: _usage(inverser, [1, 2, 3]) >= 6,\n     \"Aucune opération de pile détectée : utilise Pile()\")\negal(\"est_palindrome('radar')\", lambda: est_palindrome(\"radar\"), True)\negal(\"est_palindrome('kayak')\", lambda: est_palindrome(\"kayak\"), True)\negal(\"est_palindrome('python')\", lambda: est_palindrome(\"python\"), False)\negal(\"est_palindrome('abca')\", lambda: est_palindrome(\"abca\"), False)\negal(\"est_palindrome('') (mot vide)\", lambda: est_palindrome(\"\"), True)\n", "aide_code": null, "visuel": null, "indices_html": ["<p>Pour <code>inverser</code>, empile tous les éléments de la liste dans une <code>Pile</code>, puis dépile-les un par un en les ajoutant à une nouvelle liste : ils ressortent dans l&#x27;ordre inverse. <code>est_palindrome</code> utilise exactement la même idée : compare chaque caractère du mot avec ce que la pile te redonne.</p>"]}, {"id": "ex2", "kind": "exercice", "titre": "Déplacer un disque", "abbr": "E3", "enonce_html": "<p>Trois tours <code>A</code>, <code>B</code>, <code>C</code> (indices <code>0</code>, <code>1</code>, <code>2</code> dans la liste <code>tours</code>). Un disque porte un nombre : plus il est grand, plus le disque est large. <strong>Règle : on ne pose jamais un disque sur un disque plus petit.</strong></p>\n<p>Écris <code>deplacer(tours, i, j)</code> qui déplace le disque du sommet de <code>tours[i]</code> vers <code>tours[j]</code> <strong>si le coup est légal</strong> :</p>\n<ul><li>elle renvoie <code>True</code> si le déplacement a été effectué ;</li><li>elle renvoie <code>False</code> <strong>sans rien modifier</strong> si le coup est interdit (tour de départ vide, disque posé sur un plus petit, ou <code>i == j</code>).</li></ul>\n<div class=\"adm adm-attention\"><p class=\"adm-titre\">Attention</p><p>Vérifie que le coup est légal <strong>avant</strong> de dépiler : un disque dépilé puis rejeté est un disque perdu.</p></div>\n<p>Le programme de test en bas du code te permet d&#x27;essayer à la main.</p>", "starter": "def deplacer(tours, i, j):\n    \"\"\"Déplace le disque du sommet de tours[i] vers tours[j] si c'est légal.\n    Renvoie True si le déplacement a eu lieu, False sinon (rien n'est modifié).\"\"\"\n    pass\n\n\n# Essais\ntours = init_tours(3)\nprint(contenu(tours[0]), contenu(tours[1]), contenu(tours[2]))\nprint(deplacer(tours, 0, 1))   # légal ?\nprint(deplacer(tours, 0, 1))   # légal ?\nprint(contenu(tours[0]), contenu(tours[1]), contenu(tours[2]))\n", "tests": "\ndef _etat(t):\n    return [contenu(t[0]), contenu(t[1]), contenu(t[2])]\n_t = init_tours(3)\negal(\"1er coup légal : deplacer(tours, 0, 1) renvoie True\", lambda: deplacer(_t, 0, 1), True)\negal(\"le disque 1 est passé sur B\", lambda: _etat(_t), [[3, 2], [1], []])\negal(\"disque 2 sur disque 1 : renvoie False\", lambda: deplacer(_t, 0, 1), False)\negal(\"... et rien n'a bougé\", lambda: _etat(_t), [[3, 2], [1], []])\negal(\"départ vide : deplacer(tours, 2, 0) renvoie False\", lambda: deplacer(_t, 2, 0), False)\negal(\"disque 1 sur disque 2 : renvoie True\", lambda: deplacer(_t, 1, 0), True)\negal(\"... état final\", lambda: _etat(_t), [[3, 2, 1], [], []])\negal(\"i == j : renvoie False et rien ne bouge\", lambda: (deplacer(_t, 0, 0), _etat(_t)), (False, [[3, 2, 1], [], []]))\n", "aide_code": null, "visuel": null, "indices_html": ["<p>Récupère le disque du sommet avec <code>sommet()</code> (sans le retirer) *avant* de décider si le coup est légal. Ce n&#x27;est que si tu décides d&#x27;effectuer le déplacement que tu appelles <code>depiler()</code> puis <code>empiler()</code>.</p>"]}, {"id": "ex3", "kind": "exercice", "titre": "La récursivité entre en scène", "abbr": "E4", "enonce_html": "<p>Ta fonction <code>deplacer</code> de l&#x27;exercice 2 est disponible ici automatiquement.</p>\n<p><strong>Idée récursive.</strong> Pour déplacer <code>n</code> disques de la tour <code>source</code> vers la tour <code>cible</code> en s&#x27;aidant de la tour <code>aux</code> :</p>\n<ol><li>déplacer <code>n - 1</code> disques de <code>source</code> vers <code>aux</code> (en s&#x27;aidant de <code>cible</code>) ;</li><li>déplacer le plus grand disque de <code>source</code> vers <code>cible</code> ;</li><li>déplacer <code>n - 1</code> disques de <code>aux</code> vers <code>cible</code> (en s&#x27;aidant de <code>source</code>).</li></ol>\n<p>Écris <code>hanoi(n, source, cible, aux, tours)</code>. Quel est le <strong>cas de base</strong> ?</p>\n<p>Quand ton programme fonctionne, <strong>l&#x27;animation</strong> se lance toute seule sous le code. Change la valeur de <code>n</code> et observe.</p>\n<div class=\"adm adm-astuce\"><p class=\"adm-titre\">La pile d&#x27;appels</p><p>À chaque appel récursif, Python empile un « cadre » dans la <strong>pile d&#x27;appels</strong>. C&#x27;est encore une pile : celle du langage lui-même !</p></div>", "starter": "def hanoi(n, source, cible, aux, tours):\n    \"\"\"Déplace n disques de tours[source] vers tours[cible] en s'aidant de tours[aux].\"\"\"\n    pass\n\n\nn = 3\ntours = init_tours(n)\nhanoi(n, 0, 2, 1, tours)\nprint(\"Tour C :\", contenu(tours[2]))     # doit afficher [3, 2, 1]\nprint(\"Coups joués :\", nb_coups_effectues())\n", "tests": "\ndef _jouer(n):\n    t = init_tours(n)\n    hanoi(n, 0, 2, 1, t)\n    return [contenu(t[0]), contenu(t[1]), contenu(t[2])], nb_coups_effectues()\nfor _n in range(0, 6):\n    egal(\"n = %d : tous les disques sont sur la tour C, dans le bon ordre\" % _n,\n         lambda _n=_n: _jouer(_n)[0], [[], [], list(range(_n, 0, -1))])\nfor _n in (1, 2, 3, 4, 5):\n    egal(\"n = %d : %d coups exactement\" % (_n, 2 ** _n - 1), lambda _n=_n: _jouer(_n)[1], 2 ** _n - 1)\n", "aide_code": "def deplacer(tours, i, j):\n    \"\"\"Déplace le disque du sommet de tours[i] vers tours[j] si c'est légal.\n    Renvoie True si le déplacement a eu lieu, False sinon (rien n'est modifié).\"\"\"\n    if i == j or tours[i].est_vide():\n        return False\n    disque = tours[i].sommet()\n    if not tours[j].est_vide() and tours[j].sommet() < disque:\n        return False\n    tours[j].empiler(tours[i].depiler())\n    return True", "visuel": "hanoi", "indices_html": ["<p>Le cas de base est <code>n == 0</code> : il n&#x27;y a alors aucun disque à déplacer, la fonction ne fait rien (<code>return</code>). Pour le reste, traduis directement les 3 étapes de l&#x27;idée récursive de l&#x27;énoncé, dans l&#x27;ordre : d&#x27;abord l&#x27;appel récursif sur <code>n - 1</code>, puis <code>deplacer</code>, puis le second appel récursif.</p>", "<p>Fais bien attention à l&#x27;ordre des paramètres <code>aux</code>/<code>cible</code> dans chacun des deux appels récursifs — ils ne sont <strong>pas</strong> les mêmes dans les deux appels :</p>\n<pre><code><span class=\"f\">hanoi</span>(n - <span class=\"n\">1</span>, source, aux, cible, tours)     <span class=\"c\"># d&#x27;abord vers aux, en s&#x27;aidant de cible\ndeplacer(tours, source, cible)\nhanoi(n - 1, aux, cible, source, tours)     # puis de aux vers cible, en s&#x27;aidant de source</span></code></pre>\n<p>Si tu obtiens le bon nombre de coups mais les disques ne sont pas sur la bonne tour, c&#x27;est presque toujours une inversion ici.</p>"], "aparte_titre": "🌀 Qu'est-ce que la récursivité ?", "aparte_html": "<p>Une fonction <strong>récursive</strong> est une fonction qui <strong>s&#x27;appelle elle-même</strong> pour résoudre un problème plus petit. Il lui faut toujours un <strong>cas de base</strong> (une situation où elle s&#x27;arrête sans se rappeler), sinon elle ne s&#x27;arrête jamais.</p>\n<pre><code><span class=\"k\">def</span> <span class=\"f\">compte_a_rebours</span>(n):\n    <span class=\"k\">if</span> n == <span class=\"n\">0</span>:                 <span class=\"c\"># cas de base : on s&#x27;arrête\n        print(&quot;Décollage !&quot;)\n        return\n    print(n)\n    compte_a_rebours(n - 1)    # appel récursif, sur un problème plus petit (n-1)\n\ncompte_a_rebours(3)   # affiche 3, 2, 1, puis Décollage !</span></code></pre>\n<p>À chaque appel, Python empile un nouveau « cadre » dans sa <strong>pile d&#x27;appels</strong> (encore une pile !) : <code>compte_a_rebours(3)</code> attend le résultat de <code>compte_a_rebours(2)</code>, qui attend celui de <code>compte_a_rebours(1)</code>, etc. Quand le cas de base est atteint, les appels se terminent les uns après les autres, dans l&#x27;ordre inverse de leur démarrage.</p>\n<p>Pour Hanoï : déplacer <code>n</code> disques se ramène à déplacer <code>n - 1</code> disques (récursif), déplacer le plus grand disque, puis déplacer à nouveau les <code>n - 1</code> petits (récursif). Le cas de base est <code>n == 0</code> : il n&#x27;y a alors rien à faire.</p>\n<div class=\"adm adm-attention\"><p class=\"adm-titre\">Sans cas de base</p><p>Une fonction récursive sans cas de base — ou qui ne se rapproche jamais de celui-ci — ne s&#x27;arrête jamais : Python finit par lever une erreur <code>RecursionError</code>.</p></div>"}, {"id": "ex4", "kind": "exercice", "titre": "Combien de coups ?", "abbr": "E5", "enonce_html": "<p>Sans jouer la partie, on peut <strong>compter</strong> les coups. Soit <code>T(n)</code> le nombre minimal de coups pour <code>n</code> disques.</p>\n<ol><li>Justifie, avec l&#x27;idée récursive de l&#x27;exercice 3, que <code>T(n) = 2 × T(n − 1) + 1</code> et donne <code>T(0)</code>.</li><li>Écris <strong>récursivement</strong> <code>nb_coups(n)</code>.</li><li>Exécute le programme : complète le tableau et <strong>conjecture</strong> une formule pour <code>T(n)</code>.</li><li>Un moine déplace un disque par seconde. Combien d&#x27;années lui faut-il pour <code>n = 64</code> disques ? (Utilise <code>print</code> avec <code>nb_coups(64)</code>.)</li></ol>\n<div class=\"adm adm-astuce\"><p class=\"adm-titre\">Pour aller plus loin</p><p>Prouve ta conjecture par récurrence. Tu peux aussi comparer avec <code>nb_coups_effectues()</code> de l&#x27;exercice précédent.</p></div>", "starter": "def nb_coups(n):\n    \"\"\"Nombre minimal de coups pour déplacer n disques (sans les jouer).\"\"\"\n    pass\n\n\nfor n in range(0, 11):\n    print(n, nb_coups(n))\n\n# Question 4 : le moine\n# print(...)\n", "tests": "\negal(\"nb_coups(0) == 0\", lambda: nb_coups(0), 0)\negal(\"nb_coups(1) == 1\", lambda: nb_coups(1), 1)\negal(\"nb_coups(2) == 3\", lambda: nb_coups(2), 3)\negal(\"nb_coups(3) == 7\", lambda: nb_coups(3), 7)\negal(\"nb_coups(10) == 1023\", lambda: nb_coups(10), 1023)\negal(\"nb_coups(20) == 1048575\", lambda: nb_coups(20), 1048575)\n", "aide_code": null, "visuel": null, "indices_html": ["<p>Le cas de base est <code>T(0) = 0</code> (aucun coup pour 0 disque). Ensuite, traduis directement la relation de récurrence de l&#x27;énoncé : <code>T(n) = 2 × T(n-1) + 1</code>. Pour la question du moine, divise <code>nb_coups(64)</code> par le nombre de secondes dans une année (<code>3600 * 24 * 365</code>).</p>"]}, {"id": "defiA", "kind": "defi", "titre": "Défi A – Écrire sa propre classe Pile", "abbr": "DA", "enonce_html": "<p>Jusqu&#x27;ici, la classe <code>Pile</code> t&#x27;était fournie. Écris la tienne, <strong>avec une liste Python</strong> comme stockage.</p>\n<p>Contraintes :</p>\n<ul><li><code>Pile()</code> crée une pile vide ; <strong>deux piles ne doivent pas partager la même liste</strong> ;</li><li><code>depiler()</code> et <code>sommet()</code> lèvent <code>IndexError</code> sur une pile vide ;</li><li><code>taille()</code> renvoie le nombre d&#x27;éléments.</li></ul>\n<p>Ta classe doit passer tous les tests. Ensuite, réponds à l&#x27;oral : quel est le coût de <code>empiler</code> et <code>depiler</code> ? Pourquoi choisir la <strong>fin</strong> de la liste comme sommet ?</p>", "starter": "class Pile:\n    def __init__(self):\n        pass\n\n    def est_vide(self):\n        pass\n\n    def empiler(self, x):\n        pass\n\n    def depiler(self):\n        pass\n\n    def sommet(self):\n        pass\n\n    def taille(self):\n        pass\n", "tests": "\np = Pile()\negal(\"une pile neuve est vide\", lambda: p.est_vide(), True)\negal(\"sa taille est 0\", lambda: p.taille(), 0)\np.empiler(1); p.empiler(2); p.empiler(3)\negal(\"après 3 empiler : pas vide\", lambda: p.est_vide(), False)\negal(\"taille 3\", lambda: p.taille(), 3)\negal(\"sommet() renvoie 3 (dernier empilé)\", lambda: p.sommet(), 3)\negal(\"sommet() ne retire rien : taille 3\", lambda: p.taille(), 3)\negal(\"depiler() renvoie 3\", lambda: p.depiler(), 3)\negal(\"depiler() renvoie 2\", lambda: p.depiler(), 2)\negal(\"depiler() renvoie 1\", lambda: p.depiler(), 1)\negal(\"la pile est de nouveau vide\", lambda: p.est_vide(), True)\nleve(\"depiler() sur pile vide lève IndexError\", lambda: p.depiler(), IndexError)\nleve(\"sommet() sur pile vide lève IndexError\", lambda: p.sommet(), IndexError)\n_a, _b = Pile(), Pile()\n_a.empiler(\"x\")\negal(\"deux piles sont indépendantes\", lambda: _b.est_vide(), True)\n", "aide_code": null, "visuel": null, "indices_html": ["<p>Utilise une simple liste Python (<code>self.elements = []</code>) comme stockage interne. Le piège classique : écrire <code>elements = []</c
