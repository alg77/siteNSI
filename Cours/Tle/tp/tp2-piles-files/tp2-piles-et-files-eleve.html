ode> au niveau de la classe (et non dans <code>__init__</code>) — toutes les piles partageraient alors la même liste !</p>", "<p>Squelette complet :</p>\n<pre><code><span class=\"k\">class</span> Pile:\n    <span class=\"k\">def</span> <span class=\"f\">__init__</span>(self):\n        self.elements = []          <span class=\"c\"># une liste PAR pile, créée à chaque instanciation\n\n    def est_vide(self):\n        return len(self.elements) == 0\n\n    def empiler(self, x):\n        self.elements.append(x)\n\n    def depiler(self):\n        if self.est_vide():\n            raise IndexError(&quot;depiler : pile vide&quot;)\n        return self.elements.pop()\n\n    def sommet(self):\n        if self.est_vide():\n            raise IndexError(&quot;sommet : pile vide&quot;)\n        return self.elements[-1]\n\n    def taille(self):\n        return len(self.elements)</span></code></pre>"]}, {"id": "defiB", "kind": "defi", "titre": "Défi B – Hanoï sans récursivité", "abbr": "DB", "enonce_html": "<p>Toute fonction récursive peut être écrite avec une <strong>pile explicite</strong> qui remplace la pile d&#x27;appels.</p>\n<p>Écris <code>hanoi_iteratif(n, source, cible, aux, tours)</code> <strong>sans aucun appel récursif</strong>. Tu utiliseras une <code>Pile</code> de <strong>tâches</strong> : chaque tâche est un tuple <code>(k, s, c, a)</code> qui signifie « déplacer <code>k</code> disques de <code>s</code> vers <code>c</code> en s&#x27;aidant de <code>a</code> ».</p>\n<p>Principe :</p>\n<ol><li>on empile la tâche <code>(n, source, cible, aux)</code> ;</li><li>tant que la pile n&#x27;est pas vide : on dépile une tâche ;\n   - si <code>k == 0</code>, rien à faire ; si <code>k == 1</code>, on déplace un disque avec <code>deplacer</code> ;\n   - sinon on <strong>remplace</strong> la tâche par trois tâches plus petites.</li></ol>\n<div class=\"adm adm-attention\"><p class=\"adm-titre\">Attention à l&#x27;ordre</p><p>La pile est LIFO : la tâche qui doit être exécutée <strong>en premier</strong> doit être empilée <strong>en dernier</strong>.</p></div>", "starter": "def hanoi_iteratif(n, source, cible, aux, tours):\n    \"\"\"Même résultat que hanoi, sans récursivité (pile de tâches).\"\"\"\n    pass\n\n\nn = 4\ntours = init_tours(n)\nhanoi_iteratif(n, 0, 2, 1, tours)\nprint(contenu(tours[2]), nb_coups_effectues())\n", "tests": "\ndef _jouer(n):\n    t = init_tours(n)\n    hanoi_iteratif(n, 0, 2, 1, t)\n    return [contenu(t[0]), contenu(t[1]), contenu(t[2])], nb_coups_effectues()\nfor _n in (1, 2, 3, 4, 5, 6):\n    egal(\"n = %d : disques bien rangés sur C\" % _n, lambda _n=_n: _jouer(_n)[0], [[], [], list(range(_n, 0, -1))])\n    egal(\"n = %d : %d coups\" % (_n, 2 ** _n - 1), lambda _n=_n: _jouer(_n)[1], 2 ** _n - 1)\nvrai(\"la fonction ne s'appelle pas elle-même (pas de récursivité)\",\n     lambda: \"hanoi_iteratif\" not in hanoi_iteratif.__code__.co_names,\n     \"Ton code contient encore un appel récursif à hanoi_iteratif\")\nvrai(\"une Pile de tâches est bien utilisée\", lambda: (_ops.__setitem__(0, 0), hanoi_iteratif(3, 0, 2, 1, init_tours(3)), _ops[0] > 17)[2],\n     \"Utilise une Pile pour stocker les tâches\")\n", "aide_code": "def deplacer(tours, i, j):\n    \"\"\"Déplace le disque du sommet de tours[i] vers tours[j] si c'est légal.\n    Renvoie True si le déplacement a eu lieu, False sinon (rien n'est modifié).\"\"\"\n    if i == j or tours[i].est_vide():\n        return False\n    disque = tours[i].sommet()\n    if not tours[j].est_vide() and tours[j].sommet() < disque:\n        return False\n    tours[j].empiler(tours[i].depiler())\n    return True", "visuel": "hanoi", "indices_html": ["<p>Décompose le problème en trois tâches, comme dans la version récursive, mais empile-les dans l&#x27;ordre inverse de leur exécution : la dernière à exécuter doit être empilée en premier (puisqu&#x27;une pile ressort les éléments dans l&#x27;ordre inverse de leur arrivée).</p>", "<p>Concrètement, dans le cas <code>else</code> (<code>k &gt;= 2</code>), empile dans cet ordre précis :</p>\n<pre><code>taches.<span class=\"f\">empiler</span>((k - <span class=\"n\">1</span>, a, c, s))   <span class=\"c\"># 3e étape (déplacer les k-1 petits, de aux vers cible) : au FOND de la pile\ntaches.empiler((1, s, c, a))       # 2e étape (déplacer le grand disque)\ntaches.empiler((k - 1, s, a, c))   # 1re étape (déplacer les k-1 petits, de source vers aux) : au SOMMET</span></code></pre>\n<p>La 1ʳᵉ tâche empilée ici est la <strong>dernière</strong> à s&#x27;exécuter ; la dernière empilée (<code>(k-1, s, a, c)</code>) est dépilée — donc exécutée — en tout premier.</p>"]}], "demo": "hanoi", "lien_suite": {"titre": "🖨️ Pour aller plus loin", "texte": "Passe à l'atelier maker : conçois et imprime en 3D ta propre tour de Hanoï (ressource NSI Maker)", "href": "../nsi-maker/index.html#defi"}}, {"id": "tp2", "num": 2, "slug": "parentheses", "titre": "Le bon parenthésage", "titre_court": "Parenthésage", "sous_titre": "Piles : vérifier `()`, `[]`, `{}` et les balises HTML", "duree": "1 h", "emoji": "🧩", "accent": "#3f8f5f", "objectifs": ["Comprendre pourquoi un simple compteur ne suffit plus dès que l'on a plusieurs types de parenthèses.", "Utiliser une pile pour vérifier l'imbrication correcte de délimiteurs.", "Localiser une erreur (position) et traiter des cas limites (chaîne vide, fermante en trop, ouvrante oubliée).", "Réinvestir la pile pour les balises HTML et l'évaluation d'une expression en notation polonaise inverse."], "intro_html": "<h2>Le problème</h2>\n<p>Ton éditeur de code souligne en rouge une parenthèse oubliée ; le navigateur affiche mal une page dont une balise n&#x27;est pas fermée… Dans tous les cas, un programme vérifie que les délimiteurs sont <strong>bien parenthésés</strong> : chaque ouvrante est fermée par la fermante <strong>du même type</strong>, dans le bon ordre.</p>\n<table><thead><tr><th>Chaîne</th><th>Bien parenthésée ?</th></tr></thead><tbody><tr><td><code>&quot;(a + b) * [c - {d}]&quot;</code></td><td>oui</td></tr><tr><td><code>&quot;(]&quot;</code></td><td>non : mauvais type</td></tr><tr><td><code>&quot;([)]&quot;</code></td><td>non : mauvais <strong>ordre</strong> (les paires se chevauchent)</td></tr><tr><td><code>&quot;((&quot;</code></td><td>non : ouvrantes jamais fermées</td></tr><tr><td><code>&quot;))(&quot;</code></td><td>non : fermantes trop tôt</td></tr><tr><td><code>&quot;&quot;</code></td><td>oui (rien à vérifier)</td></tr></tbody></table>\n<p>La classe <code>Pile</code> est fournie (mêmes méthodes qu&#x27;au TP1 : <code>est_vide</code>, <code>empiler</code>, <code>depiler</code>, <code>sommet</code>, <code>taille</code>).</p>", "prelude": "\nimport re\n\n_ops = [0]\n\n\nclass Pile:\n    \"\"\"Pile (LIFO). Interface : est_vide, empiler, depiler, sommet, taille.\"\"\"\n\n    def __init__(self):\n        self._elts = []\n\n    def est_vide(self):\n        return len(self._elts) == 0\n\n    def empiler(self, x):\n        _ops[0] += 1\n        self._elts.append(x)\n\n    def depiler(self):\n        if len(self._elts) == 0:\n            raise IndexError(\"depiler : la pile est vide\")\n        _ops[0] += 1\n        return self._elts.pop()\n\n    def sommet(self):\n        if len(self._elts) == 0:\n            raise IndexError(\"sommet : la pile est vide\")\n        return self._elts[-1]\n\n    def taille(self):\n        return len(self._elts)\n\n    def __repr__(self):\n        if not self._elts:\n            return \"Pile(vide)\"\n        return \"Pile(\" + \", \".join(repr(x) for x in self._elts) + \" <- sommet)\"\n\n\n_AUTOFERMANTES = (\"br\", \"img\", \"hr\", \"meta\", \"link\", \"input\")\n\n\ndef extraire_balises(texte):\n    \"\"\"Liste des balises HTML de texte, dans l'ordre : (\"ouvrante\", nom) ou (\"fermante\", nom).\n    Les balises auto-fermantes (<br>, <img ...>, <hr/>...) sont ignorées.\"\"\"\n    res = []\n    for m in re.finditer(r\"<\\s*(/?)\\s*([a-zA-Z][a-zA-Z0-9]*)[^>]*?(/?)\\s*>\", texte):\n        ferm, nom, auto = m.group(1), m.group(2).lower(), m.group(3)\n        if auto or nom in _AUTOFERMANTES:\n            continue\n        res.append((\"fermante\" if ferm else \"ouvrante\", nom))\n    return res\n", "exercices": [{"id": "ex1", "kind": "exercice", "titre": "Un compteur suffit… pour un seul type", "abbr": "E1", "enonce_html": "<p>On commence simple : la chaîne ne contient que des parenthèses <strong>rondes</strong> <code>(</code> et <code>)</code> (et éventuellement d&#x27;autres caractères à ignorer).</p>\n<p>Idée : un <strong>compteur</strong> <code>c</code> qui augmente à chaque <code>(</code> et diminue à chaque <code>)</code>.<br>La chaîne est bien parenthésée si le compteur <strong>ne devient jamais négatif</strong> et <strong>vaut 0 à la fin</strong>.</p>\n<p>Écris <code>parentheses_equilibrees(chaine)</code>.</p>\n<div class=\"adm adm-astuce\"><p class=\"adm-titre\">Pour réfléchir</p><p>Exécute <code>parentheses_equilibrees(&quot;([)]&quot;)</code> <strong>en adaptant</strong> ton idée aux crochets (un compteur par type). Que renvoie-t-elle ? Pourquoi ce n&#x27;est pas satisfaisant ? Note ta réponse en commentaire : c&#x27;est la raison d&#x27;être de l&#x27;exercice suivant.</p></div>", "starter": "def parentheses_equilibrees(chaine):\n    \"\"\"True si les parenthèses rondes de chaine sont bien équilibrées, False sinon.\"\"\"\n    pass\n\n\nprint(parentheses_equilibrees(\"(()())\"))\nprint(parentheses_equilibrees(\"())(\"))\n\n# Ma réponse à la question « pour réfléchir » :\n# ...\n", "tests": "\n_cas = [(\"\", True), (\"()\", True), (\"(())\", True), (\"()()\", True), (\"(()())\", True), (\"a(b)c\", True),\n        (\"(()\", False), (\"())\", False), (\")(\", False), (\"((a)\", False), (\"))((\", False), (\"(\", False)]\nfor _s, _att in _cas:\n    egal(\"parentheses_equilibrees(%r)\" % _s, lambda _s=_s: parentheses_equilibrees(_s), _att)\n", "aide_code": null, "visuel": null, "indices_html": ["<p>Le compteur ne fait qu&#x27;une addition/soustraction : il ne garde aucune trace de *quel type* d&#x27;ouvrante attend d&#x27;être fermée. C&#x27;est exactement pour ça qu&#x27;il se trompe sur <code>&quot;([)]&quot;</code>.</p>"]}, {"id": "ex2", "kind": "exercice", "titre": "Avec une pile : `()`, `[]`, `{}`", "abbr": "E2", "enonce_html": "<p>Écris <code>est_bien_parenthese(chaine)</code> qui gère les trois types de délimiteurs. Les autres caractères sont ignorés.</p>\n<p><strong>Algorithme</strong> (à comprendre avant de coder) :</p>\n<ol><li>on parcourt la chaîne caractère par caractère, avec une pile initialement vide ;</li><li><strong>ouvrante</strong> → on l&#x27;empile ;</li><li><strong>fermante</strong> → si la pile est vide, ou si le sommet n&#x27;est pas l&#x27;ouvrante correspondante : <code>False</code> ; sinon on dépile ;</li><li>à la fin, la chaîne est correcte <strong>si et seulement si</strong> la pile est vide.</li></ol>\n<p>Le dictionnaire <code>PAIRES</code> donne, pour chaque fermante, l&#x27;ouvrante attendue.</p>\n<p><strong>Avant de coder</strong>, recopie et complète sur ton brouillon la trace de <code>&quot;([)]&quot;</code> :</p>\n<table><thead><tr><th>caractère</th><th>action</th><th>pile après</th></tr></thead><tbody><tr><td><code>(</code></td><td>empiler</td><td><code>(</code></td></tr><tr><td><code>[</code></td><td>...</td><td>...</td></tr><tr><td><code>)</code></td><td>...</td><td>...</td></tr></tbody></table>", "starter": "OUVRANTES = \"([{\"\nFERMANTES = \")]}\"\nPAIRES = {\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}\n\n\ndef est_bien_parenthese(chaine):\n    \"\"\"True si chaine est bien parenthésée (types et ordre corrects), False sinon.\"\"\"\n    pass\n\n\nfor essai in [\"{[()]}\", \"([)]\", \"\", \")(\", \"a(b[c]d)e\"]:\n    print(repr(essai), est_bien_parenthese(essai))\n", "tests": "\n_cas = [(\"\", True), (\"()\", True), (\"()[]{}\", True), (\"{[()]}\", True), (\"a(b[c]{d}e)f\", True), (\"([{}])\", True),\n        (\"([)]\", False), (\"(]\", False), (\"(()\", False), (\"())\", False), (\")(\", False), (\"]\", False),\n        (\"{[}\", False), (\"((]]\", False), (\"[(])\", False), (\"(((\", False)]\nfor _s, _att in _cas:\n    egal(\"est_bien_parenthese(%r)\" % _s, lambda _s=_s: est_bien_parenthese(_s), _att)\ndef _usage(s):\n    _ops[0] = 0\n    est_bien_parenthese(s)\n    return _ops[0]\nvrai(\"la fonction utilise bien une Pile\", lambda: _usage(\"([{}])\") >= 6, \"Aucune opération de pile : utilise Pile()\")\n", "aide_code": null, "visuel": null, "indices_html": ["<p>Suis l&#x27;algorithme pas à pas : ouvrante → <code>empiler</code> ; fermante → si la pile est vide <strong>ou</strong> si <code>depiler()</code> ne correspond pas (via <code>PAIRES</code>), renvoie <code>False</code> immédiatement. À la fin de la boucle, la chaîne n&#x27;est correcte que si la pile est <strong>vide</strong>.</p>"]}, {"id": "ex3", "kind": "exercice", "titre": "Où est l'erreur ?", "abbr": "E3", "enonce_html": "<p>Dire « c&#x27;est faux » ne suffit pas : un éditeur doit <strong>montrer où</strong>. Écris <code>premiere_erreur(chaine)</code> qui renvoie :</p>\n<ul><li><code>-1</code> si la chaîne est bien parenthésée ;</li><li>sinon l&#x27;<strong>indice</strong> (position dans la chaîne, en commençant à 0) du caractère fautif :</li></ul>\n<p>Exemples : <code>premiere_erreur(&quot;(]&quot;)</code> → <code>1</code> ; <code>premiere_erreur(&quot;(()&quot;)</code> → <code>0</code> ; <code>premiere_erreur(&quot;())&quot;)</code> → <code>2</code>.</p>\n<div class=\"adm adm-astuce\"><p class=\"adm-titre\">Astuce</p><p>Il faut empiler plus que le caractère : empile un <strong>tuple</strong> <code>(caractère, indice)</code>.</p></div>\n<p>Les constantes <code>OUVRANTES</code>, <code>FERMANTES</code>, <code>PAIRES</code> de l&#x27;exercice 2 sont disponibles.</p>", "starter": "def premiere_erreur(chaine):\n    \"\"\"-1 si chaine est bien parenthésée, sinon l'indice du caractère fautif.\"\"\"\n    pass\n\n\nprint(premiere_erreur(\"print(len([1, 2, 3])\"))\nprint(premiere_erreur(\"x = (1 + 2]\"))\n", "tests": "\n_cas = [(\"\", -1), (\"([]{})\", -1), (\"(]\", 1), (\")(\", 0), (\"())\", 2), (\"(()\", 0), (\"((\", 1), (\"a[b(c]d)\", 5),\n        (\"{[()]\", 0), (\"print(len([1, 2, 3])\", 5), (\"x = (1 + 2]\", 10), (\"]\", 0), (\"abc\", -1)]\nfor _s, _att in _cas:\n    egal(\"premiere_erreur(%r) == %d\" % (_s, _att), lambda _s=_s: premiere_erreur(_s), _att)\n", "aide_code": "OUVRANTES = \"([{\"\n\nFERMANTES = \")]}\"\n\nPAIRES = {\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}", "visuel": null, "indices_html": ["<p>Empile des <strong>tuples</strong> <code>(caractère, indice)</code> plutôt que juste le caractère : ça te permet de retrouver la position même après avoir dépilé.</p>", "<p>Structure : même algorithme que l&#x27;exercice 2, mais en gardant l&#x27;indice avec chaque ouvrante empilée.</p>\n<pre><code>p = <span class=\"f\">Pile</span>()\n<span class=\"k\">for</span> i, <span class=\"f\">c</span> <span class=\"k\">in</span> <span class=\"b\">enumerate</span>(chaine):\n    <span class=\"k\">if</span> c <span class=\"k\">in</span> OUVRANTES:\n        p.<span class=\"f\">empiler</span>((c, i))\n    <span class=\"k\">elif</span> c <span class=\"k\">in</span> FERMANTES:\n        <span class=\"k\">if</span> p.<span class=\"f\">est_vide</span>():\n            <span class=\"k\">return</span> i\n        ouvrante, _ = p.<span class=\"f\">depiler</span>()      <span class=\"c\"># on ignore l&#x27;indice de l&#x27;ouvrante ici\n        if ouvrante != PAIRES[c]:\n            return i\nif p.est_vide():\n    return -1\nreturn p.depiler()[1]                  # l&#x27;indice de la dernière ouvrante restée ouverte</span></code></pre>"]}, {"id": "ex4", "kind": "exercice", "titre": "Les balises HTML", "abbr": "E4", "enonce_html": "<p>Une page HTML est correcte si ses balises sont bien <strong>imbriquées</strong> : <code>&lt;b&gt;&lt;i&gt;texte&lt;/i&gt;&lt;/b&gt;</code> est correct, <code>&lt;b&gt;&lt;i&gt;texte&lt;/b&gt;&lt;/i&gt;</code> ne l&#x27;est pas.</p>\n<p>La fonction <code>extraire_balises(texte)</code> est fournie. Elle renvoie la liste des balises dans l&#x27;ordre, sous la forme <code>(&quot;ouvrante&quot;, nom)</code> ou <code>(&quot;fermante&quot;, nom)</code>, en ignorant les balises auto-fermantes (<code>&lt;br&gt;</code>, <code>&lt;img ...&gt;</code>).</p>\n<p>Écris <code>est_html_correct(texte)</code>. C&#x27;est le <strong>même algorithme</strong> que l&#x27;exercice 2, mais on empile des <strong>noms de balises</strong>.</p>", "starter": "print(extraire_balises(\"<p>Bonjour <b>toi</b><br></p>\"))\n\n\ndef est_html_correct(texte):\n    \"\"\"True si les balises de texte sont bien imbriquées, False sinon.\"\"\"\n    pass\n\n\nprint(est_html_correct(\"<ul><li>a</li><li>b</li></ul>\"))\nprint(est_html_correct(\"<div><p>x</div></p>\"))\n", "tests": "\n_cas = [(\"\", True), (\"<p>Bonjour <b>toi</b></p>\", True), (\"<b><i>x</i></b>\", True), (\"<b><i>x</b></i>\", False),\n        (\"<p>un<br>deux</p>\", True), (\"<div><p>x</div>\", False), (\"</p>\", False), (\"<p>\", False),\n        (\"<ul><li>a</li><li>b</li></ul>\", True), (\"<img src='a.png'>\", True), (\"<a href='x'><b>lien</b></a>\", True),\n        (\"<div><p>x</div></p>\", False)]\nfor _s, _att in _cas:\n    egal(\"est_html_correct(%r)\" % _s, lambda _s=_s: est_html_correct(_s), _att)\n", "aide_code": null, "visuel": null, "indices_html": ["<p>C&#x27;est le même algorithme que l&#x27;exercice 2 : seule la nature de ce qu&#x27;on empile change (des noms de balises au lieu de caractères). <code>extraire_balises</code> fait tout le travail de découpage pour toi.</p>"]}, {"id": "defi", "kind": "defi", "titre": "Défi – La notation polonaise inverse", "abbr": "D", "enonce_html": "<p>En <strong>notation polonaise inverse</strong> (NPI, ou postfixée), l&#x27;opérateur suit ses opérandes et <strong>on n&#x27;a plus besoin de parenthèses</strong> : <code>3 4 + 2 *</code> vaut <code>(3 + 4) × 2 = 14</code>. Les vieilles calculatrices HP fonctionnent ainsi.</p>\n<p>Écris <code>evaluer_npi(expression)</code> : les éléments de <code>expression</code> sont séparés par des espaces ; les nombres sont des <strong>entiers</strong> ; les opérateurs sont <code>+</code>, <code>-</code>, <code>*</code>, <code>/</code>.</p>\n<p>Algorithme :</p>\n<ul><li><strong>nombre</strong> → on l&#x27;empile ;</li><li><strong>opérateur</strong> → on dépile <code>b</code>, puis on dépile <code>a</code>, on calcule <code>a opérateur b</code> et on <strong>empile</strong> le résultat ;</li><li>à la fin, il reste un seul élément : le résultat.</li></ul>\n<div class=\"adm adm-attention\"><p class=\"adm-titre\">Attention à l&#x27;ordre</p><p>Le <strong>premier</strong> élément dépilé est l&#x27;opérande de <strong>droite</strong> : <code>7 2 -</code> vaut <code>5</code>, pas <code>-5</code>.</p></div>\n<p><strong>Pour les plus rapides :</strong> écris la conversion d&#x27;une expression infixe (avec parenthèses) en NPI (algorithme *shunting-yard* de Dijkstra) — deux piles ou une pile et une liste de sortie.</p>", "starter": "def evaluer_npi(expression):\n    \"\"\"Évalue une expression en notation polonaise inverse, ex. '3 4 + 2 *' -> 14.\"\"\"\n    pass\n\n\nprint(evaluer_npi(\"3 4 + 2 *\"))\n", "tests": "\n_cas = [(\"3 4 +\", 7), (\"3 4 + 2 *\", 14), (\"7 2 -\", 5), (\"2 7 -\", -5), (\"10 2 /\", 5), (\"5 1 2 + 4 * + 3 -\", 14),\n        (\"2 3 4 * +\", 14), (\"42\", 42), (\"100 5 / 2 /\", 10)]\nfor _s, _att in _cas:\n    egal(\"evaluer_npi(%r) == %r\" % (_s, _att), lambda _s=_s: evaluer_npi(_s), _att)\n", "aide_code": null, "visuel": null, "indices_html": ["<p>Pense à l&#x27;ordre : à chaque opérateur, c&#x27;est le <strong>premier</strong> élément dépilé qui est l&#x27;opérande de droite. <code>7 2 -</code> doit valoir <code>5</code>, pas <code>-5</code> — si tu obtiens <code>-5</code>, inverse <code>a</code> et <code>b</code>.</p>", "<p>Structure :</p>\n<pre><code>p = <span class=\"f\">Pile</span>()\n<span class=\"k\">for</span> jeton <span class=\"k\">in</span> expression.<span class=\"f\">split</span>():\n    <span class=\"k\">if</span> <span class=\"f\">jeton</span> <span class=\"k\">in</span> (<span class=\"s\">&quot;+&quot;</span>, <span class=\"s\">&quot;-&quot;</span>, <span class=\"s\">&quot;*&quot;</span>, <span class=\"s\">&quot;/&quot;</span>):\n        b = p.<span class=\"f\">depiler</span>()        <span class=\"c\"># dépilé en 1er = opérande de DROITE\n        a = p.depiler()        # dépilé en 2nd = opérande de GAUCHE\n        p.empiler(a + b)       # (ou -, *, / selon jeton)\n    else:\n        p.empiler(int(jeton))\nreturn p.depiler()</span></code></pre>"]}]}, {"id": "tp3", "num": 3, "slug": "parc", "titre": "Le parc d'attractions", "titre_court": "Parc d'attractions", "sous_titre": "Files : une file d'attente, pas à pas", "duree": "1 h 30", "emoji": "🎡", "accent": "#1f7a6c", "objectifs": ["Écrire une file (FIFO) avec des fonctions, sans classe.", "Manipuler des visiteurs représentés par des dictionnaires.", "Simuler un embarquement par groupes et faire évoluer un état (la satisfaction) au fil du temps.", "Calculer des statistiques sur une liste de résultats.", "Défi : combiner deux files pour gérer une priorité (visiteurs VIP)."], "intro_html": "<h2>La queue devant une attraction</h2>\n<p>Tu es déjà à l&#x27;aise avec le principe FIFO (*First In, First Out*) : le premier visiteur arrivé dans la queue est le premier à monter dans l&#x27;attraction. C&#x27;est exactement une <strong>file</strong>.</p>\n<p>Dans ce TP, un visiteur est représenté par un <strong>dictionnaire</strong> :</p>\n<pre><code>{<span class=\"s\">&quot;nom&quot;</span>: <span class=\"s\">&quot;Léa&quot;</span>, <span class=\"s\">&quot;arrivee&quot;</span>: <span class=\"n\">12</span>, <span class=\"s\">&quot;satisfaction&quot;</span>: <span class=\"n\">75</span>}</code></pre>\n<p><code>arrivee</code> est l&#x27;heure (en minutes) à laquelle le visiteur a rejoint la queue ; <code>satisfaction</code> est une note de 0 à 100 qui évolue selon le temps d&#x27;attente.</p>\n<div class=\"adm adm-astuce\"><p class=\"adm-titre\">Pourquoi un dictionnaire, et pas une classe ?</p><p>Une classe (<code>class Visiteur:</code>) conviendrait très bien ici — tu la verras plus tard dans l&#x27;année. En attendant, un dictionnaire suffit très bien pour regrouper plusieurs informations liées : il n&#x27;y a besoin de rien d&#x27;autre.</p></div>\n<p>Comme dans les TP précédents, on manipule la file uniquement par son <strong>interface</strong> : <code>est_vide</code>, <code>enfiler</code>, <code>defiler</code>, <code>taille</code>.</p>", "prelude": "\n_ops = [0]\n\n\nclass File:\n    \"\"\"File (FIFO). Interface : est_vide, enfiler, defiler, taille.\"\"\"\n\n    def __init__(self):\n        self._elts = []\n\n    def est_vide(self):\n        return len(self._elts) == 0\n\n    def enfiler(self, x):\n        _ops[0] += 1\n        self._elts.append(x)\n\n    def defiler(self):\n        if len(self._elts) == 0:\n            raise IndexError(\"defiler : la file est vide\")\n        _ops[0] += 1\n        return self._elts.pop(0)\n\n    def taille(self):\n        return len(self._elts)\n\n    def __repr__(self):\n        return \"File(tête -> \" + \", \".join(repr(x) for x in self._elts) + \")\" if self._elts else \"File(vide)\"\n\n\ndef fabrique(elements):\n    \"\"\"Renvoie une file contenant les éléments de la liste (le premier de la liste en tête).\"\"\"\n    f = File()\n    for x in elements:\n        f.enfiler(x)\n    return f\n\n\ndef contenu_file(f):\n    \"\"\"Liste des éléments de f (tête -> queue), sans modifier f. N'utilise que l'interface de la file.\"\"\"\n    res = []\n    for _ in range(f.taille()):\n        x = f.defiler()\n        res.append(x)\n        f.enfiler(x)\n    return res\n", "exercices": [{"id": "ex1", "kind": "exercice", "titre": "Écrire une file d'attente", "abbr": "E1", "enonce_html": "<p>Une classe <code>File</code> est fournie plus loin dans ce TP, mais pour ce premier exercice <strong>tu écris ta propre file</strong>, sans classe : avec des fonctions, comme dans ton cours.</p>\n<p>Une file, c&#x27;est une <strong>liste Python</strong> : la <strong>tête</strong> (le prochain à sortir) est le <strong>premier</strong> élément de la liste (indice 0), la <strong>queue</strong> est la fin.</p>\n<p>Écris cinq fonctions :</p>\n<ul><li><code>fileVide()</code> renvoie une <strong>nouvelle</strong> liste vide ;</li><li><code>estVide(F)</code> renvoie <code>True</code> si <code>F</code> est vide ;</li><li><code>enfiler(F, x)</code> ajoute <code>x</code> à la queue de <code>F</code> (ne renvoie rien) ;</li><li><code>defiler(F)</code> retire et renvoie l&#x27;élément de <strong>tête</strong> ; elle lève <code>IndexError</code> si <code>F</code> est vide ;</li><li><code>taille(F)</code> renvoie le nombre d&#x27;éléments de <code>F</code>.</li></ul>", "starter": "def fileVide():\n    \"\"\"Renvoie une nouvelle file vide.\"\"\"\n    pass\n\n\ndef estVide(F):\n    \"\"\"True si F est vide.\"\"\"\n    pass\n\n\ndef enfiler(F, x):\n    \"\"\"Ajoute x à la queue de F.\"\"\"\n    pass\n\n\ndef defiler(F):\n    \"\"\"Retire et renvoie l'élément de tête de F. Lève IndexError si F est vide.\"\"\"\n    pass\n\n\ndef taille(F):\n    \"\"\"Nombre d'éléments de F.\"\"\"\n    pass\n\n\nF = fileVide()\nenfiler(F, \"Léa\")\nenfiler(F, \"Tom\")\nenfiler(F, \"Zoé\")\nprint(defiler(F))\nprint(taille(F))\n", "tests": "\nF = fileVide()\negal(\"une file neuve est vide\", lambda: estVide(F), True)\negal(\"taille 0\", lambda: taille(F), 0)\nenfiler(F, \"a\"); enfiler(F, \"b\"); enfiler(F, \"c\")\negal(\"après 3 enfiler : pas vide\", lambda: estVide(F), False)\negal(\"taille 3\", lambda: taille(F), 3)\negal(\"defiler(F) renvoie 'a' (premier arrivé)\", lambda: defiler(F), \"a\")\negal(\"taille 2\", lambda: taille(F), 2)\nenfiler(F, \"d\")\negal(\"defiler(F) renvoie 'b'\", lambda: defiler(F), \"b\")\negal(\"defiler(F) renvoie 'c'\", lambda: defiler(F), \"c\")\negal(\"defiler(F) renvoie 'd'\", lambda: defiler(F), \"d\")\negal(\"la file est vide\", lambda: estVide(F), True)\nleve(\"defiler(F) sur file vide lève IndexError\", lambda: defiler(F), IndexError)\n_a, _b = fileVide(), fileVide()\nenfiler(_a, \"x\")\negal(\"deux files sont indépendantes\", lambda: estVide(_b), True)\n", "aide_code": null, "visuel": null, "indices_html": ["<p>Une file, c&#x27;est juste une liste Python : <code>fileVide()</code> renvoie <code>[]</code>, <code>enfiler</code> c&#x27;est <code>.append(x)</code>, <code>defiler</code> c&#x27;est <code>.pop(0)</code> (après avoir vérifié que la file n&#x27;est pas vide).</p>"]}, {"id": "ex2", "kind": "exercice", "titre": "Un visiteur arrive", "abbr": "E2", "enonce_html": "<p>Un visiteur est un <strong>dictionnaire</strong> avec trois clés : <code>&quot;nom&quot;</code>, <code>&quot;arrivee&quot;</code> (l&#x27;heure d&#x27;arrivée, en minutes) et <code>&quot;satisfaction&quot;</code> (un nombre, 75 par défaut).</p>\n<p>Écris <code>creer_visiteur(nom, arrivee, satisfaction=75)</code> qui renvoie ce dictionnaire.</p>\n<p>Ensuite, utilise la classe <code>File</code> (fournie, avec <code>.enfiler(x)</code>, <code>.defiler()</code>, <code>.est_vide()</code>, <code>.taille()</code>) pour créer une file et y ajouter quelques visiteurs.</p>\n<div class=\"adm adm-attention\"><p class=\"adm-titre\">Deux dictionnaires, pas un seul</p><p>Chaque appel à <code>creer_visiteur</code> doit renvoyer un <strong>nouveau</strong> dictionnaire. Si tu modifies le dictionnaire d&#x27;un visiteur, celui d&#x27;un autre visiteur ne doit pas changer.</p></div>", "starter": "def creer_visiteur(nom, arrivee, satisfaction=75):\n    \"\"\"Renvoie un dictionnaire {\"nom\":..., \"arrivee\":..., \"satisfaction\":...}.\"\"\"\n    pass\n\n\nfile = File()\nfile.enfiler(creer_visiteur(\"Léa\", 0))\nfile.enfiler(creer_visiteur(\"Tom\", 3))\nprint(contenu_file(file))\n", "tests": "\nv = creer_visiteur(\"Léa\", 12)\negal(\"nom correct\", lambda: v[\"nom\"], \"Léa\")\negal(\"arrivee correcte\", lambda: v[\"arrivee\"], 12)\negal(\"satisfaction par défaut = 75\", lambda: v[\"satisfaction\"], 75)\nv2 = creer_visiteur(\"Tom\", 5, satisfaction=40)\negal(\"satisfaction précisée = 40\", lambda: v2[\"satisfaction\"], 40)\nv3 = creer_visiteur(\"Léa\", 12)\nv3[\"satisfaction\"] = 0\negal(\"deux visiteurs créés séparément sont deux dictionnaires distincts\", lambda: v[\"satisfaction\"], 75)\n_f = File()\n_f.enfiler(creer_visiteur(\"A\", 0))\n_f.enfiler(creer_visiteur(\"B\", 1))\negal(\"s'utilise bien dans une File\", lambda: [x[\"nom\"] for x in contenu_file(_f)], [\"A\", \"B\"])\n", "aide_code": null, "visuel": null, "indices_html": ["<p><code>creer_visiteur</code> n&#x27;a qu&#x27;une ligne : <code>return {&quot;nom&quot;: nom, &quot;arrivee&quot;: arrivee, &quot;satisfaction&quot;: satisfaction}</code>. Chaque appel construit un dictionnaire tout neuf — aucun risque de partage tant que tu écris <code>{...}</code> à chaque fois (et non une variable globale réutilisée).</p>"]}, {"id": "ex3", "kind": "exercice", "titre": "Embarquement", "abbr": "E3", "enonce_html": "<p>Écris <code>embarquer(file, capacite, heure)</code> qui fait monter jusqu&#x27;à <code>capacite</code> visiteurs dans l&#x27;attraction :</p>\n<ul><li>elle retire les visiteurs <strong>de la tête de la file</strong>, un par un, jusqu&#x27;à en avoir retiré <code>capacite</code>, <strong>ou</strong> jusqu&#x27;à ce que la file soit vide (si elle en contient moins que <code>capacite</code>) ;</li><li>pour chaque visiteur retiré, elle ajoute une clé <code>&quot;attente&quot;</code> à son dictionnaire, valant <code>heure - arrivee</code> ;</li><li>elle renvoie la <strong>liste</strong> des visiteurs embarqués, dans l&#x27;ordre où ils ont été retirés (éventuellement vide, si <code>file</code> était déjà vide).</li></ul>\n<p>La file <code>file</code> doit ressortir de la fonction avec uniquement les visiteurs <strong>non</strong> embarqués (ceux qui restent, elle est donc éventuellement modifiée).</p>", "starter": "def embarquer(file, capacite, heure):\n    \"\"\"Fait embarquer jusqu'à capacite visiteurs de la file. Ajoute la clé \"attente\" à chacun.\n    Renvoie la liste des visiteurs embarqués (dans l'ordre FIFO).\"\"\"\n    pass\n\n\nfile = File()\nfile.enfiler(creer_visiteur(\"Léa\", 0))\nfile.enfiler(creer_visiteur(\"Tom\", 3))\nfile.enfiler(creer_visiteur(\"Zoé\", 5))\nembarques = embarquer(file, 2, 10)\nprint([(v[\"nom\"], v[\"attente\"]) for v in embarques])\nprint(file.taille())\n", "tests": "\n_f = File()\n_f.enfiler(creer_visiteur(\"Léa\", 0))\n_f.enfiler(creer_visiteur(\"Tom\", 3))\n_f.enfiler(creer_visiteur(\"Zoé\", 5))\n_e = embarquer(_f, 2, 10)\negal(\"2 visiteurs embarqués, dans l'ordre FIFO\", lambda: [v[\"nom\"] for v in _e], [\"Léa\", \"Tom\"])\negal(\"attente de Léa = 10 - 0 = 10\", lambda: _e[0][\"attente\"], 10)\negal(\"attente de Tom = 10 - 3 = 7\", lambda: _e[1][\"attente\"], 7)\negal(\"il reste 1 visiteur dans la file\", lambda: _f.taille(), 1)\negal(\"... c'est bien Zoé\", lambda: contenu_file(_f)[0][\"nom\"], \"Zoé\")\n\n_f2 = File()\n_f2.enfiler(creer_visiteur(\"A\", 0))\n_e2 = embarquer(_f2, 5, 20)\negal(\"moins de visiteurs que la capacité : tous embarquent\", lambda: [v[\"nom\"] for v in _e2], [\"A\"])\negal(\"la file est vide ensuite\", lambda: _f2.est_vide(), True)\n\n_f3 = File()\n_e3 = embarquer(_f3, 3, 0)\negal(\"file déjà vide : liste vide, pas d'erreur\", lambda: _e3, [])\n", "aide_code": null, "visuel": null, "indices_html": ["<p>Une boucle <code>while</code> qui s&#x27;arrête sur <strong>deux</strong> conditions à la fois : tant que tu n&#x27;as pas encore embarqué <code>capacite</code> visiteurs <strong>et</strong> que la file n&#x27;est pas vide. Pense à l&#x27;opérateur <code>and</code>.</p>", "<p>Structure possible :</p>\n<pre><code><span class=\"f\">embarques</span> = []\n<span class=\"k\">while</span> <span class=\"b\">len</span>(embarques) &lt; capacite <span class=\"k\">and</span> <span class=\"k\">not</span> file.<span class=\"f\">est_vide</span>():\n    visiteur = file.<span class=\"f\">defiler</span>()\n    visiteur[<span class=\"s\">&quot;attente&quot;</span>] = heure - visiteur[<span class=\"s\">&quot;arrivee&quot;</span>]\n    embarques.<span class=\"f\">append</span>(visiteur)\n<span class=\"k\">return</span> embarques</code></pre>\n<p>Le visiteur retiré par <code>file.defiler()</code> est un dictionnaire : <code>visiteur[&quot;attente&quot;] = ...</code> lui ajoute une nouvelle clé, exactement comme tu ajouterais un élément à une liste.</p>"]}, {"id": "ex4", "kind": "exercice", "titre": "La satisfaction évolue", "abbr": "E4", "enonce_html": "<p>Écris <code>maj_satisfaction(file, embarques)</code> qui fait évoluer la satisfaction de <strong>tous</strong> les visiteurs, embarqués ou non, sans rien renvoyer :</p>\n<ul><li>chaque visiteur <strong>encore dans la file</strong> (donc toujours en train d&#x27;attendre) perd 5 points de satisfaction ;</li><li>chaque visiteur de <code>embarques</code> (ceux qui viennent de monter) gagne 10 points ;</li><li>dans les deux cas, la satisfaction reste <strong>entre 0 et 100</strong> (jamais en dessous, jamais au-dessus).</li></ul>\n<p>La file ne se parcourt pas directement : il faut défiler chaque visiteur, le modifier, puis le réenfiler — exactement comme dans le TP Snake pour vérifier si une case était occupée.</p>", "starter": "def maj_satisfaction(file, embarques):\n    \"\"\"Fait évoluer la satisfaction de tout le monde. Ne renvoie rien.\"\"\"\n    pass\n\n\nfile = File()\nfile.enfiler(creer_visiteur(\"Léa\", 0))\nembarques = [creer_visiteur(\"Tom\", 3)]\nmaj_satisfaction(file, embarques)\nprint(contenu_file(file)[0][\"satisfaction\"])\nprint(embarques[0][\"satisfaction\"])\n", "tests": "\n_f = File()\n_f.enfiler(creer_visiteur(\"Léa\", 0))\n_f.enfiler(creer_visiteur(\"Tom\", 0, satisfaction=2))\n_e = [creer_visiteur(\"Zoé\", 0, satisfaction=95)]\nmaj_satisfaction(_f, _e)\negal(\"Léa (75) perd 5 -> 70\", lambda: contenu_file(_f)[0][\"satisfaction\"], 70)\negal(\"Tom (2) perd 5 mais reste borné à 0\", lambda: contenu_file(_f)[1][\"satisfaction\"], 0)\negal(\"Zoé (95) gagne 10 mais reste bornée à 100\", lambda: _e[0][\"satisfaction\"], 100)\negal(\"l'ordre et la taille de la file ne changent pas\", lambda: [v[\"nom\"] for v in contenu_file(_f)], [\"Léa\", \"Tom\"])\n\n_f2 = File()\n_e2 = []\nmaj_satisfaction(_f2, _e2)\nvrai(\"aucune erreur si les deux sont vides\", lambda: True)\n", "aide_code": null, "visuel": null, "indices_html": ["<p>Pour parcourir la file sans la vider définitivement : <code>for _ in range(file.taille()): v = file.defiler(); ...; file.enfiler(v)</code>. À chaque tour, tu modifies <code>v</code> avant de le réenfiler.</p>", "<p>Structure complète :</p>\n<pre><code><span class=\"k\">for</span> <span class=\"f\">_</span> <span class=\"k\">in</span> <span class=\"b\">range</span>(file.<span class=\"f\">taille</span>()):\n    visiteur = file.<span class=\"f\">defiler</span>()\n    visiteur[<span class=\"s\">&quot;satisfaction&quot;</span>] = <span class=\"b\">max</span>(<span class=\"n\">0</span>, visiteur[<span class=\"s\">&quot;satisfaction&quot;</span>] - <span class=\"n\">5</span>)\n    file.<span class=\"f\">enfiler</span>(visiteur)\n\n<span class=\"k\">for</span> visiteur <span class=\"k\">in</span> embarques:\n    visiteur[<span class=\"s\">&quot;satisfaction&quot;</span>] = <span class=\"b\">min</span>(<span class=\"n\">100</span>, visiteur[<span class=\"s\">&quot;satisfaction&quot;</span>] + <span class=\"n\">10</span>)</code></pre>\n<p>La première boucle tourne exactement <code>file.taille()</code> fois (sa valeur AU DÉPART, avant qu&#x27;on ne commence à réenfiler) : c&#x27;est pour ça qu&#x27;on fige <code>file.taille()</code> dans le <code>range(...)</code> plutôt que de tester <code>not file.est_vide()</code>, qui bouclerait indéfiniment.</p>"]}, {"id": "ex5", "kind": "exercice", "titre": "Statistiques de fin de journée", "abbr": "E5", "enonce_html": "<p>Écris <code>statistiques(sortis)</code> où <code>sortis</code> est une <strong>liste</strong> de visiteurs (des dictionnaires, chacun avec une clé <code>&quot;attente&quot;</code> et une clé <code>&quot;satisfaction&quot;</code>) qui ont fini leur visite. La fonction renvoie le triplet <code>(effectif, attente_moyenne, satisfaction_moyenne)</code>.</p>\n<p>Cas particulier : si <code>sortis</code> est vide, renvoie <code>(0, None, None)</code> (il n&#x27;y a pas de moyenne à calculer).</p>", "starter": "def statistiques(sortis):\n    \"\"\"Renvoie (effectif, attente_moyenne, satisfaction_moyenne). (0, None, None) si sortis est vide.\"\"\"\n    pass\n\n\nsortis = [\n    {\"nom\": \"Léa\", \"attente\": 10, \"satisfaction\": 70},\n    {\"nom\": \"Tom\", \"attente\": 4, \"satisfaction\": 85},\n]\nprint(statistiques(sortis))\n", "tests": "\negal(\"liste vide -> (0, None, None)\", lambda: statistiques([]), (0, None, None))\n_s = [{\"nom\": \"A\", \"attente\": 10, \"satisfaction\": 70}, {\"nom\": \"B\", \"attente\": 4, \"satisfaction\": 85}]\negal(\"effectif = 2\", lambda: statistiques(_s)[0], 2)\negal(\"attente moyenne = (10+4)/2 = 7.0\", lambda: statistiques(_s)[1], 7.0)\negal(\"satisfaction moyenne = (70+85)/2 = 77.5\", lambda: statistiques(_s)[2], 77.5)\n_s1 = [{\"nom\": \"A\", \"attente\": 6, \"satisfaction\": 50}]\negal(\"un seul visiteur : moyennes = ses propres valeurs\", lambda: statistiques(_s1), (1, 6.0, 50.0))\n", "aide_code": null, "visuel": null, "indices_html": ["<p><code>sum(v[&quot;attente&quot;] for v in sortis) / len(sortis)</code> calcule directement une moyenne. Pense à traiter le cas <code>sortis</code> vide <strong>avant</strong> cette division (sinon : <code>ZeroDivisionError</code>).</p>"]}, {"id": "defi", "kind": "defi", "titre": "Défi – Des visiteurs VIP", "abbr": "D", "enonce_html": "<p>Le parc propose un pass VIP : ces visiteurs ont leur <strong>propre file</strong>, et passent devant tout le monde tant qu&#x27;il y en a.</p>\n<p>Écris <code>prochain_visiteur(file_normale, file_vip)</code> qui renvoie <strong>et retire</strong> le prochain visiteur à embarquer :</p>\n<ul><li>s&#x27;il y a au moins un visiteur dans <code>file_vip</code>, c&#x27;est <strong>lui</strong> qui passe (peu importe l&#x27;état de <code>file_normale</code>) ;</li><li>sinon, c&#x27;est le premier de <code>file_normale</code> ;</li><li>si les deux files sont vides, la fonction renvoie <code>None</code> (et ne modifie rien).</li></ul>\n<div class=\"adm adm-astuce\"><p class=\"adm-titre\">Pourquoi deux files plutôt qu&#x27;une seule avec une étiquette VIP ?</p><p>Tu pourrais aussi mettre tout le monde dans une seule file avec une clé <code>&quot;vip&quot;: True/False</code> et chercher le premier VIP en la parcourant — mais ça casserait le principe FIFO (il faudrait chercher au milieu de la file). Deux files séparées, chacune restant FIFO, est plus simple et plus fidèle à ce qui se passe dans un vrai parc (deux files d&#x27;attente physiquement séparées).</p></div>", "starter": "def prochain_visiteur(file_normale, file_vip):\n    \"\"\"Renvoie et retire le prochain visiteur (VIP en priorité). None si les deux files sont vides.\"\"\"\n    pass\n", "tests": "\n_n, _v = File(), File()\negal(\"les deux files sont vides -> None\", lambda: prochain_visiteur(_n, _v), None)\n_n.enfiler(creer_visiteur(\"A\", 0))\n_n.enfiler(creer_visiteur(\"B\", 1))\negal(\"pas de VIP : le premier normal passe\", lambda: prochain_visiteur(_n, _v)[\"nom\"], \"A\")\n_v.enfiler(creer_visiteur(\"V1\", 0))\negal(\"un VIP arrive : il passe avant B\", lambda: prochain_visiteur(_n, _v)[\"nom\"], \"V1\")\negal(\"B est toujours dans la file normale\", lambda: _n.taille(), 1)\negal(\"plus de VIP : B repasse devant\", lambda: prochain_visiteur(_n, _v)[\"nom\"], \"B\")\negal(\"tout est vide maintenant\", lambda: prochain_visiteur(_n, _v), None)\n", "aide_code": null, "visuel": null, "indices_html": ["<p>Trois cas, dans cet ordre précis : <code>file_vip</code> non vide → elle gagne toujours, quoi qu&#x27;il arrive dans <code>file_normale</code>. Sinon <code>file_normale</code> non vide → elle défile. Sinon → <code>None</code>.</p>"]}]}, {"id": "tp4", "num": 4, "slug": "bataille", "titre": "La bataille", "titre_court": "La bataille", "sous_titre": "Files : jeu de cartes, terminaison, statistiques", "duree": "2 h – 2 h 30", "emoji": "🃏", "accent": "#b3453d", "objectifs": ["Implémenter une file (liste Python) et la manipuler par son interface (`enfiler`, `defiler`, `est_vide`).", "Modéliser un jeu avec deux files et écrire une simulation complète.", "Découvrir qu'une boucle `while` peut ne jamais se terminer : notion de **terminaison** et de variant.", "Défis : file avec deux piles ; réutilisation d'une pile dans le jeu « 6 qui prend »."], "intro_html": "<h2>Rappel : la file (FIFO)</h2>\n<p>Une <strong>file</strong> est une structure de données où l&#x27;on <strong>ajoute à un bout</strong> (la queue) et où l&#x27;on <strong>retire à l&#x27;autre</strong> (la tête) : premier arrivé, premier sorti (*First In, First Out*). Comme la file d&#x27;attente d&#x27;une caisse.</p>\n<table><thead><tr><th>Opération</th><th>Effet</th></tr></thead><tbody><tr><td><code>f = File()</code></td><td>crée une file vide</td></tr><tr><td><code>f.est_vide()</code></td><td>renvoie <code>True</code> si la file est vide</td></tr><tr><td><code>f.enfiler(x)</code></td><td>ajoute <code>x</code> à la queue</td></tr><tr><td><code>f.defiler()</code></td><td>retire l&#x27;élément de <strong>tête</strong> et le renvoie (erreur si vide)</td></tr><tr><td><code>f.taille()</code></td><td>nombre d&#x27;éléments</td></tr></tbody></table>\n<h2>Les règles de la bataille (version du TP)</h2>\n<ul><li>Un jeu de 52 cartes est mélangé puis distribué <strong>une carte sur deux</strong> à chaque joueur : chaque joueur a une <strong>file</strong> de 26 cartes.</li><li>À chaque <strong>tour</strong>, les deux joueurs défilent leur carte du dessus. La plus forte gagne (2 &lt; 3 &lt; … &lt; 10 &lt; Valet &lt; Dame &lt; Roi &lt; As).</li><li>Le gagnant <strong>enfile</strong> les cartes gagnées à la queue de sa file : pour chaque <strong>paire</strong> de cartes jouées (une de chaque joueur), il enfile <strong>d&#x27;abord sa propre carte, puis celle de son adversaire</strong>. Les paires sont enfilées dans l&#x27;ordre où elles ont été jouées.</li><li><strong>Égalité (« bataille »)</strong> : les deux cartes vont dans un <strong>pot</strong> ; chaque joueur défile aussitôt une nouvelle carte, et ainsi de suite jusqu&#x27;à ce que l&#x27;une l&#x27;emporte ; le vainqueur enfile <strong>tout le pot</strong> selon la règle ci-dessus. Si, après une égalité, un joueur n&#x27;a plus de carte, il perd le pot (J1 est vérifié en premier).</li><li>La partie s&#x27;arrête quand un joueur n&#x27;a plus de carte.</li></ul>\n<p>Une carte est un tuple <code>(valeur, couleur)</code> : <code>(14, &quot;♠&quot;)</code> est l&#x27;As de pique. Les valeurs vont de 2 à 14 (11 = Valet, 12 = Dame, 13 = Roi, 14 = As).</p>\n<p>Sont fournis : <code>creer_paquet()</code>, <code>melanger(paquet, graine)</code> (mélange <strong>reproductible</strong> : la même <code>graine</code> donne toujours le même mélange), <code>nom_carte(carte)</code>, <code>fabrique(liste)</code> (crée une file contenant les éléments de la liste) et <code>contenu_file(f)</code> (la liste des éléments d&#x27;une file, sans la vider).</p>", "prelude": "\nimport random\n\n_ops = [0]\nVALEURS = list(range(2, 15))\nCOULEURS = [\"♠\", \"♥\", \"♦\", \"♣\"]\n_NOMS = {11: \"V\", 12: \"D\", 13: \"R\", 14: \"As\"}\n\n\ndef creer_paquet():\n    \"\"\"Les 52 cartes, dans l'ordre : chaque carte est (valeur, couleur).\"\"\"\n    return [(v, c) for c in COULEURS for v in VALEURS]\n\n\ndef melanger(paquet, graine):\n    \"\"\"Renvoie une NOUVELLE liste mélangée. Même graine -> même mélange.\"\"\"\n    p = list(paquet)\n    random.Random(graine).shuffle(p)\n    return p\n\n\ndef nom_carte(carte):\n    \"\"\"Ex. (14, '♠') -> 'As♠', (10, '♥') -> '10♥'.\"\"\"\n    v, c = carte\n    return str(_NOMS.get(v, v)) + c\n\n\nclass Pile:\n    \"\"\"Pile (LIFO). Interface : est_vide, empiler, depiler, sommet, taille.\"\"\"\n\n    def __init__(self):\n        self._elts = []\n\n    def est_vide(self):\n        return len(self._elts) == 0\n\n    def empiler(self, x):\n        _ops[0] += 1\n        self._elts.append(x)\n\n    def depiler(self):\n        if len(self._elts) == 0:\n            raise IndexError(\"depiler : la pile est vide\")\n        _ops[0] += 1\n        return self._elts.pop()\n\n    def sommet(self):\n        if len(self._elts) == 0:\n            raise IndexError(\"sommet : la pile est vide\")\n        return self._elts[-1]\n\n    def taille(self):\n        return len(self._elts)\n\n    def __repr__(self):\n        return \"Pile(\" + \", \".join(repr(x) for x in self._elts) + \" <- sommet)\" if self._elts else \"Pile(vide)\"\n\n\nclass File:\n    \"\"\"File (FIFO). Interface : est_vide, enfiler, defiler, taille.\"\"\"\n\n    def __init__(self):\n        self._elts = []\n\n    def est_vide(self):\n        return len(self._elts) == 0\n\n    def enfiler(self, x):\n        self._elts.append(x)\n\n    def defiler(self):\n        if len(self._elts) == 0:\n            raise IndexError(\"defiler : la file est vide\")\n        return self._elts.pop(0)\n\n    def taille(self):\n        return len(self._elts)\n\n    def __repr__(self):\n        return \"File(tête -> \" + \", \".join(repr(x) for x in self._elts) + \")\" if self._elts else \"File(vide)\"\n\n\ndef fabrique(elements):\n    \"\"\"Renvoie une file contenant les éléments de la liste (le premier de la liste en tête).\"\"\"\n    f = File()\n    for x in elements:\n        f.enfiler(x)\n    return f\n\n\ndef contenu_file(f):\n    \"\"\"Liste des éléments de f (tête -> queue), sans modifier f. N'utilise que l'interface de la file.\"\"\"\n    res = []\n    for _ in range(f.taille()):\n        x = f.defiler()\n        res.append(x)\n        f.enfiler(x)\n    return res\n\n\ndef tetes(carte):\n    \"\"\"Nombre de têtes de bœuf d'une carte (jeu « 6 qui prend »).\"\"\"\n    if carte == 55:\n        return 7\n    if carte % 11 == 0:\n        return 5\n    if carte % 10 == 0:\n        return 3\n    if carte % 5 == 0:\n        return 2\n    return 1\n", "exercices": [{"id": "ex1", "kind": "exercice", "titre": "Écrire une file, avec des fonctions", "abbr": "E1", "enonce_html": "<p>Une classe <code>File</code> est fournie plus loin dans ce TP, mais pour ce premier exercice <strong>tu écris ta propre file</strong>, sans classe : avec des fonctions, exactement comme dans ton cours (<code>pileVide</code>, <code>empiler</code>, <code>depiler</code>...). Tu n&#x27;as pas encore vu la programmation orientée objet (<code>class</code>, <code>self</code>) — tu n&#x27;en as pas besoin ici.</p>\n<p>*Tu as déjà écrit une file au TP « Le parc d&#x27;attractions » : cet exercice te fait re-pratiquer la même idée, dans un contexte différent (des cartes plutôt que des visiteurs). Si tu es à l&#x27;aise, tu peux aller vite.*</p>\n<p>Une file, c&#x27;est une <strong>liste Python</strong> : la <strong>tête</strong> de la file est le <strong>premier</strong> élément de la liste (indice 0), la <strong>queue</strong> est la fin.</p>\n<p>Écris cinq fonctions :</p>\n<ul><li><code>fileVide()</code> renvoie une <strong>nouvelle</strong> liste vide (deux appels ne doivent pas renvoyer la même liste) ;</li><li><code>estVide(F)</code> renvoie <code>True</code> si <code>F</code> est vide ;</li><li><code>enfiler(F, x)</code> ajoute <code>x</code> à la queue de <code>F</code> (ne renvoie rien) ;</li><li><code>defiler(F)</code> retire et renvoie l&#x27;élément de <strong>tête</strong> ; elle lève <code>IndexError</code> si <code>F</code> est vide ;</li><li><code>taille(F)</code> renvoie le nombre d&#x27;éléments de <code>F</code>.</li></ul>\n<div class=\"adm adm-astuce\"><p class=\"adm-titre\">Réflexion</p><p><code>liste.pop(0)</code> doit décaler tous les éléments restants. Est-ce grave pour 26 cartes ? Et pour un million d&#x27;éléments ? (Tu verras dans le défi A une autre solution, avec deux piles.)</p></div>", "starter": "def fileVide():\n    \"\"\"Renvoie une nouvelle file vide.\"\"\"\n    pass\n\n\ndef estVide(F):\n    \"\"\"True si F est vide.\"\"\"\n    pass\n\n\ndef enfiler(F, x):\n    \"\"\"Ajoute x à la queue de F.\"\"\"\n    pass\n\n\ndef defiler(F):\n    \"\"\"Retire et renvoie l'élément de tête de F. Lève IndexError si F est vide.\"\"\"\n    pass\n\n\ndef taille(F):\n    \"\"\"Nombre d'éléments de F.\"\"\"\n    pass\n\n\nF = fileVide()\nenfiler(F, \"a\")\nenfiler(F, \"b\")\nenfiler(F, \"c\")\nprint(defiler(F))\nprint(taille(F))\n", "tests": "\nF = fileVide()\negal(\"une file neuve est vide\", lambda: estVide(F), True)\negal(\"taille 0\", lambda: taille(F), 0)\nenfiler(F, 1); enfiler(F, 2); enfiler(F, 3)\negal(\"après 3 enfiler : pas vide\", lambda: estVide(F), False)\negal(\"taille 3\", lambda: taille(F), 3)\negal(\"defiler(F) renvoie 1 (premier arrivé)\", lambda: defiler(F), 1)\negal(\"taille 2\", lambda: taille(F), 2)\nenfiler(F, 4)\negal(\"defiler(F) renvoie 2\", lambda: defiler(F), 2)\negal(\"defiler(F) renvoie 3\", lambda: defiler(F), 3)\negal(\"defiler(F) renvoie 4\", lambda: defiler(F), 4)\negal(\"la file est vide\", lambda: estVide(F), True)\nleve(\"defiler(F) sur file vide lève IndexError\", lambda: defiler(F), IndexError)\n_a, _b = fileVide(), fileVide()\nenfiler(_a, \"x\")\negal(\"deux files sont indépendantes\", lambda: estVide(_b), True)\negal(\"fonctionne avec fabrique/contenu_file (mêmes conventions)\", lambda: (lambda F: [defiler(F) for _ in range(taille(F))])(\n    (lambda F: (enfiler(F, 7), enfiler(F, 8), enfiler(F, 9), F)[-1])(fileVide())), [7, 8, 9])\n", "aide_code": null, "visuel": null, "indices_html": ["<p><code>estVide</code>, <code>enfiler</code>, <code>defiler</code>, <code>taille</code> : chaque fonction est courte (une ou deux lignes). <code>defiler</code> doit vérifier que <code>F</code> n&#x27;est pas vide *avant* d&#x27;appeler <code>F.pop(0)</code>, sinon Python lèverait sa propre erreur au lieu de ton <code>IndexError</code>.</p>"]}, {"id": "ex2", "kind": "exercice", "titre": "Distribuer les cartes", "abbr": "E2", "enonce_html": "<p>Écris <code>distribuer(paquet)</code> qui reçoit une liste de cartes (déjà mélangée) et renvoie <strong>deux files</strong> <code>(f1, f2)</code> : la carte d&#x27;indice pair va à <code>f1</code>, la carte d&#x27;indice impair à <code>f2</code>. Chaque file doit contenir les cartes <strong>dans l&#x27;ordre du paquet</strong> (la première du paquet est en tête de <code>f1</code>).</p>\n<p>Une classe <code>File</code> est fournie pour la suite du TP (mêmes méthodes qu&#x27;à l&#x27;exercice 1, avec <code>.enfiler(x)</code>, <code>.defiler()</code>, <code>.est_vide()</code>, <code>.taille()</code>) : tu peux l&#x27;utiliser sans la connaître en détail, un peu comme tu utilises déjà <code>liste.append(x)</code>.</p>", "starter": "def distribuer(paquet):\n    \"\"\"Renvoie (f1, f2) : cartes d'indice pair dans f1, d'indice impair dans f2 (ordre conservé).\"\"\"\n    pass\n\n\npaquet = melanger(creer_paquet(), 42)\nf1, f2 = distribuer(paquet)\nprint(\"Cartes de J1 :\", [nom_carte(c) for c in contenu_file(f1)])\nprint(\"Taille J1 / J2 :\", f1.taille(), f2.taille())\n", "tests": "\n_p = melanger(creer_paquet(), 1)\n_f1, _f2 = distribuer(_p)\negal(\"J1 a 26 cartes\", lambda: _f1.taille(), 26)\negal(\"J2 a 26 cartes\", lambda: _f2.taille(), 26)\negal(\"J1 reçoit les cartes d'indice pair, dans l'ordre\", lambda: contenu_file(_f1), _p[0::2])\negal(\"J2 reçoit les cartes d'indice impair, dans l'ordre\", lambda: contenu_file(_f2), _p[1::2])\negal(\"avec 4 cartes : 2 + 2\", lambda: [x.taille() for x in distribuer([(2, \"♠\"), (3, \"♠\"), (4, \"♠\"), (5, \"♠\")])], [2, 2])\negal(\"paquet vide : deux files vides\", lambda: [x.est_vide() for x in distribuer([])], [True, True])\n", "aide_code": null, "visuel": null, "indices_html": ["<p><code>enumerate(paquet)</code> te donne à la fois l&#x27;indice <code>i</code> et la carte. Le test <code>i % 2 == 0</code> sépare les cartes d&#x27;indice pair des impaires.</p>"]}, {"id": "ex3", "kind": "exercice", "titre": "Un tour, sans bataille", "abbr": "E3", "enonce_html": "<p>On construit <code>un_tour</code> en deux temps : ici, le cas <strong>simple</strong>, sans égalité. Tu géreras la bataille dans l&#x27;exercice suivant.</p>\n<p>Écris <code>un_tour_simple(f1, f2)</code> qui joue un tour et renvoie <code>1</code> si J1 remporte le tour, <code>2</code> sinon. <strong>On suppose ici que les deux cartes défilées n&#x27;ont jamais la même valeur</strong> (donc jamais de bataille à gérer).</p>\n<p>Plan :</p>\n<ol><li>chaque joueur défile une carte (<code>f1.defiler()</code>, <code>f2.defiler()</code>) ;</li><li>compare les deux valeurs (<code>carte[0]</code>) ;</li><li>le gagnant enfile <strong>sa propre carte d&#x27;abord</strong>, puis celle de l&#x27;adversaire ;</li><li>renvoie <code>1</code> ou <code>2</code>.</li></ol>\n<p>Tu peux t&#x27;aider de <code>fabrique([...])</code> et <code>contenu_file(f)</code> pour tester à la main.</p>", "starter": "def un_tour_simple(f1, f2):\n    \"\"\"Joue un tour (SANS bataille : les deux cartes ont des valeurs différentes).\n    Renvoie 1 si J1 gagne le tour, 2 sinon.\"\"\"\n    pass\n\n\n# Essai : J1 a 10♠ ; J2 a 5♦\nf1 = fabrique([(10, \"♠\")])\nf2 = fabrique([(5, \"♦\")])\nprint(un_tour_simple(f1, f2))\nprint([nom_carte(c) for c in contenu_file(f1)])\nprint([nom_carte(c) for c in contenu_file(f2)])\n", "tests": "\n_a, _b = fabrique([(10, \"♠\"), (2, \"♥\")]), fabrique([(5, \"♦\"), (9, \"♣\")])\negal(\"J1 gagne (10 > 5) -> renvoie 1\", lambda: un_tour_simple(_a, _b), 1)\negal(\"... J1 enfile SA carte (10♠) puis celle de J2 (5♦)\", lambda: contenu_file(_a), [(2, \"♥\"), (10, \"♠\"), (5, \"♦\")])\negal(\"... J2 garde sa carte restante\", lambda: contenu_file(_b), [(9, \"♣\")])\n\n_a, _b = fabrique([(3, \"♠\"), (8, \"♠\")]), fabrique([(9, \"♥\"), (2, \"♣\")])\negal(\"J2 gagne (9 > 3) -> renvoie 2\", lambda: un_tour_simple(_a, _b), 2)\negal(\"... J2 enfile SA carte (9♥) puis celle de J1 (3♠)\", lambda: contenu_file(_b), [(2, \"♣\"), (9, \"♥\"), (3, \"♠\")])\negal(\"... J1 garde sa carte restante\", lambda: contenu_file(_a), [(8, \"♠\")])\n\n_a, _b = fabrique([(14, \"♠\")]), fabrique([(2, \"♦\")])\negal(\"l'As (14) bat le 2\", lambda: un_tour_simple(_a, _b), 1)\n_a, _b = fabrique([(2, \"♠\")]), fabrique([(14, \"♦\")])\negal(\"le 2 perd contre l'As\", lambda: un_tour_simple(_a, _b), 2)\n", "aide_code": null, "visuel": null, "indices_html": ["<p>Pas de boucle nécessaire ici : une seule comparaison suffit. <code>f1.defiler()</code> puis <code>f2.defiler()</code>, tu compares <code>c1[0]</code> et <code>c2[0]</code>, et le gagnant enfile <strong>sa</strong> carte avant celle de l&#x27;adversaire.</p>"]}, {"id": "ex4", "kind": "exercice", "titre": "Un tour, avec bataille", "abbr": "E4", "enonce_html": "<p>Tu as déjà écrit <code>un_tour_simple</code>, qui compare deux cartes de valeurs différentes. Ici, tu écris <code>un_tour</code> au complet : <strong>il ne reste qu&#x27;à gérer l&#x27;égalité</strong>, c&#x27;est-à-dire la bataille (voir les règles plus haut). Renvoie <code>1</code> si J1 remporte le tour, <code>2</code> sinon. On suppose que <strong>les deux files ne sont pas vides</strong> quand la fonction est appelée.</p>\n<p>Plan conseillé :</p>\n<ol><li>un <code>pot</code> (liste) qui contient les cartes jouées ;</li><li>une boucle : chaque joueur défile une carte, on les ajoute au pot, on compare les valeurs ;</li><li>en cas d&#x27;égalité, on rejoue — sauf si un joueur n&#x27;a plus de cartes ;</li><li>le gagnant enfile tout le pot : pour chaque paire <code>(carte de J1, carte de J2)</code> du pot, <strong>sa carte d&#x27;abord</strong>, puis celle de l&#x27;adversaire (même règle qu&#x27;à l&#x27;exercice précédent).</li></ol>\n<p>Tu peux t&#x27;aider de <code>fabrique([...])</code> et <code>contenu_file(f)</code> pour tester à la main.</p>", "starter": "def un_tour(f1, f2):\n    \"\"\"Joue un tour (avec bataille éventuelle). Renvoie 1 si J1 gagne le tour, 2 sinon.\"\"\"\n    pass\n\n\n# Essai : J1 a 10♠ puis 2♥ ; J2 a 5♦ puis 9♣\nf1 = fabrique([(10, \"♠\"), (2, \"♥\")])\nf2 = fabrique([(5, \"♦\"), (9, \"♣\")])\nprint(un_tour(f1, f2))\nprint([nom_carte(c) for c in contenu_file(f1)])\nprint([nom_carte(c) for c in contenu_file(f2)])\n", "tests": "\n_a, _b = fabrique([(10, \"♠\"), (2, \"♥\")]), fabrique([(5, \"♦\"), (9, \"♣\")])\negal(\"tour simple : J1 gagne (10 > 5) -> renvoie 1\", lambda: un_tour(_a, _b), 1)\negal(\"... J1 enfile 10♠ puis 5♦ à la queue\", lambda: contenu_file(_a), [(2, \"♥\"), (10, \"♠\"), (5, \"♦\")])\negal(\"... J2 garde 9♣\", lambda: contenu_file(_b), [(9, \"♣\")])\n\n_a, _b = fabrique([(3, \"♠\"), (8, \"♠\")]), fabrique([(9, \"♥\"), (2, \"♣\")])\negal(\"J2 gagne (9 > 3) -> renvoie 2\", lambda: un_tour(_a, _b), 2)\negal(\"... J2 enfile d'abord SA carte (9♥) puis celle de J1 (3♠)\", lambda: contenu_file(_b), [(2, \"♣\"), (9, \"♥\"), (3, \"♠\")])\negal(\"... J1 garde 8♠\", lambda: contenu_file(_a), [(8, \"♠\")])\n\n_a = fabrique([(7, \"♠\"), (12, \"♥\"), (2, \"♣\")])\n_b = fabrique([(7, \"♦\"), (4, \"♠\"), (9, \"♥\")])\negal(\"bataille : J1 gagne au 2e affrontement (12 > 4) -> renvoie 1\", lambda: un_tour(_a, _b), 1)\negal(\"... J1 récupère tout le pot (sa carte d'abord dans chaque paire)\",\n     lambda: contenu_file(_a), [(2, \"♣\"), (7, \"♠\"), (7, \"♦\"), (12, \"♥\"), (4, \"♠\")])\negal(\"... J2 garde 9♥\", lambda: contenu_file(_b), [(9, \"♥\")])\n\n_a = fabrique([(7, \"♠\"), (5, \"♥\")])\n_b = fabrique([(7, \"♦\")])\negal(\"bataille : J2 n'a plus de carte -> J1 gagne le pot (renvoie 1)\", lambda: un_tour(_a, _b), 1)\negal(\"... J1 : 5♥ puis le pot\", lambda: contenu_file(_a), [(5, \"♥\"), (7, \"♠\"), (7, \"♦\")])\negal(\"... J2 n'a plus rien\", lambda: _b.est_vide(), True)\n\n_a = fabrique([(7, \"♠\")])\n_b = fabrique([(7, \"♦\"), (5, \"♥\")])\negal(\"bataille : J1 n'a plus de carte -> J2 gagne le pot (renvoie 2)\", lambda: un_tour(_a, _b), 2)\negal(\"... J2 : 5♥ puis le pot (sa carte 7♦ d'abord)\", lambda: contenu_file(_b), [(5, \"♥\"), (7, \"♦\"), (7, \"♠\")])\n\n_a = fabrique([(5, \"♠\"), (5, \"♥\"), (5, \"♦\"), (2, \"♠\")])\n_b = fabrique([(5, \"♣\"), (5, \"♠\"), (5, \"♥\"), (9, \"♠\")])\negal(\"double bataille : J2 gagne au 4e affrontement -> renvoie 2\", lambda: un_tour(_a, _b), 2)\negal(\"... J2 récupère les 8 cartes du pot, sa carte d'abord dans chaque paire\", lambda: contenu_file(_b),\n     [(5, \"♣\"), (5, \"♠\"), (5, \"♠\"), (5, \"♥\"), (5, \"♥\"), (5, \"♦\"), (9, \"♠\"), (2, \"♠\")])\negal(\"... et J1 n'a plus rien\", lambda: _a.est_vide(), True)\n", "aide_code": null, "visuel": null, "indices_html": ["<p>Utilise une liste <code>pot</code> pour accumuler les cartes jouées. La boucle continue tant que les deux cartes défilées sont égales (bataille) : pense à vérifier qu&#x27;aucun des deux joueurs ne s&#x27;est retrouvé sans carte *pendant* la bataille, avant de redéfiler.</p>", "<p>Structure possible avec une boucle <code>while True</code> et des <code>break</code> :</p>\n<pre><code>pot = []\n<span class=\"k\">while</span> <span class=\"k\">True</span>:\n    c1, c2 = f1.<span class=\"f\">defiler</span>(), f2.<span class=\"f\">defiler</span>()\n    pot += [c1, c2]\n    <span class=\"k\">if</span> c1[<span class=\"n\">0</span>] != c2[<span class=\"n\">0</span>]:\n        gagnant = <span class=\"n\">1</span> <span class=\"k\">if</span> c1[<span class=\"n\">0</span>] &gt; c2[<span class=\"n\">0</span>] <span class=\"k\">else</span> <span class=\"n\">2</span>\n        <span class=\"k\">break</span>\n    <span class=\"c\"># égalité : il faut rejouer, sauf si un joueur est à sec\n    if f1.est_vide():\n        gagnant = 2; break\n    if f2.est_vide():\n        gagnant = 1; break</span></code></pre>\n<p>Il ne reste ensuite qu&#x27;à faire enfiler tout <code>pot</code> au gagnant, deux par deux, sa carte d&#x27;abord — exactement comme dans <code>un_tour_simple</code>.</p>"]}, {"id": "ex5", "kind": "exercice", "titre": "Une partie complète", "abbr": "E5", "enonce_html": "<p>Écris <code>partie(graine, max_tours=1000)</code> qui :</p>\n<ol><li>crée un paquet, le <strong>mélange</strong> avec la <code>graine</code>, le <strong>distribue</strong> ;</li><li>joue des tours <strong>tant qu&#x27;aucun joueur n&#x27;a perdu</strong>, <strong>et</strong> tant que le nombre de tours est inférieur à <code>max_tours</code> ;</li><li>renvoie le couple <code>(gagnant, nb_tours)</code> où <code>gagnant</code> vaut <code>1</code>, <code>2</code>, ou <code>0</code> si la limite de tours a été atteinte sans vainqueur.</li></ol>\n<p>Ta fonction fait appel à <code>distribuer</code> et <code>un_tour</code> que tu as écrites aux exercices précédents.</p>\n<div class=\"adm adm-attention\"><p class=\"adm-titre\">Pourquoi <code>max_tours</code> ?</p><p>Rien ne garantit qu&#x27;une partie se termine : certaines sont très longues et, en théorie, une partie pourrait tourner en boucle (les mêmes cartes qui circulent). Sans ce garde-fou, ta boucle <code>while</code> pourrait ne jamais s&#x27;arrêter. On dit que la <strong>terminaison</strong> n&#x27;est pas garantie : on impose donc un nombre maximal de tours.</p></div>\n<p>Compare tes résultats pour les graines <code>0</code>, <code>1</code>, <code>2</code>… avec ceux de tes voisins : ils doivent être identiques.</p>", "starter": "def partie(graine, max_tours=1000):\n    \"\"\"Joue une partie. Renvoie (gagnant, nb_tours) avec gagnant = 1, 2 ou 0 (limite atteinte).\"\"\"\n    pass\n\n\nfor graine in range(5):\n    print(graine, partie(graine))\n", "tests": "\negal(\"partie(0)\", lambda: partie(0), (1, 189))\negal(\"partie(1)\", lambda: partie(1), (2, 313))\negal(\"partie(2)\", lambda: partie(2), (2, 799))\negal(\"partie(3)\", lambda: partie(3), (1, 478))\negal(\"partie(4)\", lambda: partie(4), (2, 121))\negal(\"partie(0, 10) : limite de 10 tours atteinte -> (0, 10)\", lambda: partie(0, 10), (0, 10))\nvrai(\"le gagnant est 0, 1 ou 2\", lambda: partie(7)[0] in (0, 1, 2))\n", "aide_code": "def distribuer(paquet):\n    \"\"\"Renvoie (f1, f2) : cartes d'indice pair dans f1, d'indice impair dans f2 (ordre conservé).\"\"\"\n    f1 = File()\n    f2 = File()\n    for i, carte in enumerate(paquet):\n        if i % 2 == 0:\n            f1.enfiler(carte)\n        else:\n            f2.enfiler(carte)\n    return f1, f2\n\ndef un_tour(f1, f2):\n    \"\"\"Joue un tour (avec bataille éventuelle). Renvoie 1 si J1 gagne le tour, 2 sinon.\"\"\"\n    pot = []\n    while True:\n        c1 = f1.defiler()\n        c2 = f2.defiler()\n        pot.append(c1)\n        pot.append(c2)\n        if c1[0] > c2[0]:\n            gagnant = 1\n            break\n        if c2[0] > c1[0]:\n            gagnant = 2\n            break\n        # égalité : bataille\n        if f1.est_vide():\n            gagnant = 2\n            break\n        if f2.est_vide():\n            gagnant = 1\n            break\n    fg = f1 if gagnant == 1 else f2\n    for k in range(0, len(pot), 2):\n        carte1, carte2 = pot[k], pot[k + 1]\n        if gagnant == 1:\n            fg.enfiler(carte1)\n            fg.enfiler(carte2)\n        else:\n            fg.enfiler(carte2)\n            fg.enfiler(carte1)\n    return gagnant", "visuel": null, "indices_html": ["<p><code>partie</code> ne fait qu&#x27;enchaîner des appels à <code>distribuer</code> puis <code>un_tour</code> en boucle, avec un compteur de tours borné par <code>max_tours</code>. La partie s&#x27;arrête dès que l&#x27;une des deux files est vide.</p>", "<p>Structure :</p>\n<pre><code>paquet = <span class=\"f\">melanger</span>(<span class=\"f\">creer_paquet</span>(), graine)\nf1, f2 = <span class=\"f\">distribuer</span>(paquet)\nnb_tours = <span class=\"n\">0</span>\n<span class=\"k\">while</span> <span class=\"k\">not</span> f1.<span class=\"f\">est_vide</span>() <span class=\"k\">and</span> <span class=\"k\">not</span> f2.<span class=\"f\">est_vide</span>() <span class=\"k\">and</span> nb_tours &lt; max_tours:\n    <span class=\"f\">un_tour</span>(f1, f2)\n    nb_tours += <span class=\"n\">1</span>\n<span class=\"k\">if</span> f1.<span class=\"f\">est_vide</span>():\n    <span class=\"k\">return</span> (<span class=\"n\">2</span>, nb_tours)\n<span class=\"k\">if</span> f2.<span class=\"f\">est_vide</span>():\n    <span class=\"k\">return</span> (<span class=\"n\">1</span>, <span class=\"f\">nb_tours</span>)\n<span class=\"k\">return</span> (<span class=\"n\">0</span>, nb_tours)          <span class=\"c\"># limite atteinte, personne n&#x27;a gagné</span></code></pre>"]}, {"id": "ex6", "kind": "exercice", "titre": "Statistiques sur beaucoup de parties", "abbr": "E6", "enonce_html": "<p>Écris <code>statistiques(nb_parties)</code> qui joue les parties de graines <code>0, 1, …, nb_parties - 1</code> (avec <code>max_tours</code> par défaut) et renvoie le quadruplet <code>(victoires_J1, victoires_J2, non_terminees, moyenne_tours)</code> où <code>moyenne_tours</code> est le nombre moyen de tours <strong>des parties terminées</strong>.</p>\n<p>Lance-la avec <code>nb_parties = 200</code> puis réponds en commentaire :</p>\n<ol><li>Le premier joueur est-il avantagé ?</li><li>Combien de parties ne sont pas terminées au bout de 1000 tours ?</li><li>Modifie la valeur par défaut de <code>max_tours</code> : 300, puis 5000. Que deviennent les parties « non terminées » ? Étaient-elles infinies, ou seulement longues ?</li><li>Le nombre de configurations possibles des cartes est fini et le jeu est <strong>déterministe</strong>. Que peux-tu dire d&#x27;une partie qui ne se termine pas ?</li></ol>", "starter": "def statistiques(nb_parties):\n    \"\"\"Renvoie (victoires_J1, victoires_J2, non_terminees, moyenne_tours des parties terminées).\"\"\"\n    pass\n\n\nprint(statistiques(200))\n\n# Mes réponses :\n# 1) ...\n# 2) ...\n# 3) ...\n# 4) ...\n", "tests": "\negal(\"statistiques(30)[:3] (victoires J1, J2, parties non terminées)\", lambda: statistiques(30)[:3], (14, 15, 1))\negal(\"statistiques(30)[3] arrondi à l'unité (tours moyens)\", lambda: round(statistiques(30)[3]), 281)\negal(\"statistiques(0) : aucune partie\", lambda: statistiques(0)[:3], (0, 0, 0))\n", "aide_code": "def distribuer(paquet):\n    \"\"\"Renvoie (f1, f2) : cartes d'indice pair dans f1, d'indice impair dans f2 (ordre conservé).\"\"\"\n    f1 = File()\n    f2 = File()\n    for i, carte in enumerate(paquet):\n        if i % 2 == 0:\n            f1.enfiler(carte)\n        else:\n            f2.enfiler(carte)\n    return f1, f2\n\ndef un_tour(f1, f2):\n    \"\"\"Joue un tour (avec bataille éventuelle). Renvoie 1 si J1 gagne le tour, 2 sinon.\"\"\"\n    pot = []\n    while True:\n        c1 = f1.defiler()\n        c2 = f2.defiler()\n        pot.append(c1)\n        pot.append(c2)\n        if c1[0] > c2[0]:\n            gagnant = 1\n            break\n        if c2[0] > c1[0]:\n            gagnant = 2\n            break\n        # égalité : bataille\n        if f1.est_vide():\n            gagnant = 2\n            break\n        if f2.est_vide():\n            gagnant = 1\n            break\n    fg = f1 if gagnant == 1 else f2\n    for k in range(0, len(pot), 2):\n        carte1, carte2 = pot[k], pot[k + 1]\n        if gagnant == 1:\n            fg.enfiler(carte1)\n            fg.enfiler(carte2)\n        else:\n            fg.enfiler(carte2)\n            fg.enfiler(carte1)\n    return gagnant\n\ndef partie(graine, max_tours=1000):\n    \"\"\"Joue une partie. Renvoie (gagnant, nb_tours) avec gagnant = 1, 2 ou 0 (limite atteinte).\"\"\"\n    paquet = melanger(creer_paquet(), graine)\n    f1, f2 = distribuer(paquet)\n    nb_tours = 0\n    while not f1.est_vide() and not f2.est_vide() and nb_tours < max_tours:\n        un_tour(f1, f2)\n        nb_tours += 1\n    if f1.est_vide():\n        return (2, nb_tours)\n    if f2.est_vide():\n        return (1, nb_tours)\n    return (0, nb_tours)", "visuel": null, "indices_html": ["<p><code>statistiques</code> appelle <code>partie(graine)</code> pour chaque graine de <code>0</code> à <code>nb_parties - 1</code>, et classe chaque résultat selon la valeur de <code>gagnant</code> (<code>1</code>, <code>2</code> ou <code>0</code>).</p>"]}, {"id": "defiA", "kind": "defi", "titre": "Défi A – Une file avec deux piles", "abbr": "DA", "enonce_html": "<p>Une file peut être réalisée avec <strong>deux piles</strong> seulement (la classe <code>Pile</code> est fournie).</p>\n<ul><li>On <strong>enfile</strong> en empilant sur la pile <code>entree</code>.</li><li>On <strong>défile</strong> en dépilant la pile <code>sortie</code>. Si <code>sortie</code> est vide, on <strong>transvase d&#x27;abord</strong> tous les éléments de <code>entree</code> dans <code>sortie</code> (l&#x27;ordre est alors inversé : le premier arrivé se retrouve au sommet).</li></ul>\n<p>Écris la classe <code>FileDeuxPiles</code> avec les mêmes méthodes que <code>File</code> : <code>est_vide</code>, <code>enfiler</code>, <code>defiler</code> (<code>IndexError</code> si vide), <code>taille</code>.</p>\n<p><strong>Question</strong> : chaque élément est empilé au plus 2 fois et dépilé au plus 2 fois avant de sortir. Que peux-tu en déduire sur le <strong>coût moyen</strong> (amorti) d&#x27;un <code>enfiler</code> puis d&#x27;un <code>defiler</code> ? Compare avec <code>pop(0)</code>.</p>", "starter": "class FileDeuxPiles:\n    def __init__(self):\n        self.entree = Pile()\n        self.sortie = Pile()\n\n    def est_vide(self):\n        pass\n\n    def enfiler(self, x):\n        pass\n\n    def defiler(self):\n        pass\n\n    def taille(self):\n        pass\n", "tests": "\n_f = FileDeuxPiles()\negal(\"file neuve : vide, taille 0\", lambda: (_f.est_vide(), _f.taille()), (True, 0))\n_f.enfiler(1); _f.enfiler(2); _f.enfiler(3)\negal(\"après 3 enfiler : taille 3\", lambda: _f.taille(), 3)\negal(\"defiler() -> 1 (premier arrivé)\", lambda: _f.defiler(), 1)\n_f.enfiler(4)\negal(\"defiler() -> 2\", lambda: _f.defiler(), 2)\negal(\"defiler() -> 3\", lambda: _f.defiler(), 3)\negal(\"defiler() -> 4\", lambda: _f.defiler(), 4)\negal(\"file vide à nouveau\", lambda: _f.est_vide(), True)\nleve(\"defiler() sur file vide lève IndexError\", lambda: _f.defiler(), IndexError)\ndef _melange():\n    f = FileDeuxPiles()\n    ref = []\n    sortie = []\n    for i in range(40):\n        f.enfiler(i); ref.append(i)\n        if i % 3 == 2:\n            sortie.append((f.defiler(), ref.pop(0)))\n    return all(a == b for a, b in sortie) and f.taille() == len(ref)\nvrai(\"enfiler/defiler entrelacés se comportent comme une file\", _melange)\ndef _usage():\n    _ops[0] = 0\n    g = FileDeuxPiles(); g.enfiler(1); g.defiler()\n    return _ops[0] > 0\nvrai(\"ta file utilise bien des Pile\", _usage, \"Utilise la classe Pile pour stocker les éléments\")\n", "aide_code": null, "visuel": null, "indices_html": ["<p><code>enfiler</code> empile sur <code>entree</code>. <code>defiler</code> : si <code>sortie</code> est vide, transvase <strong>tout</strong> <code>entree</code> dans <code>sortie</code> d&#x27;abord (l&#x27;ordre s&#x27;inverse), puis dépile <code>sortie</code>. Le transvasement ne doit se faire que quand <code>sortie</code> est vide, jamais à chaque appel.</p>"]}, {"id": "defiB", "kind": "defi", "titre": "Défi B – « 6 qui prend » : les rangées sont des piles", "abbr": "DB", "enonce_html": "<p>Dans <strong>6 qui prend</strong>, quatre <strong>rangées</strong> de cartes (numérotées de 1 à 104) sont posées sur la table. Chaque rangée se comporte comme une <strong>pile</strong> : on ne regarde que sa <strong>dernière</strong> carte (le sommet), et quand la 6ᵉ carte arrive, le joueur <strong>ramasse les 5 cartes</strong>.</p>\n<p>Chaque carte vaut des <strong>têtes de bœuf</strong> (fonction <code>tetes(carte)</code> fournie : 1, 2, 3, 5 ou 7). On veut en ramasser le moins possible !</p>\n<p>Écris <code>placer(rangees, carte)</code> où <code>rangees</code> est une liste de 4 <code>Pile</code>. Règles (version simplifiée) :</p>\n<ol><li>La carte est posée sur la rangée dont le <strong>sommet est le plus grand parmi ceux qui sont inférieurs</strong> à la carte.</li><li>Si <strong>aucun</strong> sommet n&#x27;est inférieur (carte plus petite que tous), le joueur ramasse la <strong>rangée n°0</strong> et la carte devient la première carte de cette rangée (règle simplifiée).</li><li>Si la rangée choisie contient <strong>déjà 5 cartes</strong>, le joueur ramasse ces 5 cartes et la carte devient l&#x27;unique carte de la rangée.</li><li>La fonction renvoie le <strong>total de têtes de bœuf ramassées</strong> (0 si rien n&#x27;est ramassé).</li></ol>\n<p>Chaque rangée contient toujours au moins une carte.</p>", "starter": "def placer(rangees, carte):\n    \"\"\"Place carte dans une des 4 rangées (piles). Renvoie le nombre de têtes de bœuf ramassées.\"\"\"\n    pass\n\n\nrangees = [Pile() for _ in range(4)]\nfor i, c in enumerate([10, 20, 30, 40]):\n    rangees[i].empiler(c)\nprint(placer(rangees, 25), rangees)\n", "tests": "\ndef _r(*lignes):\n    rg = []\n    for l in lignes:\n        p = Pile()\n        for c in l:\n            p.empiler(c)\n        rg.append(p)\n    return rg\ndef _c(rg):\n    return [list(p._elts) for p in rg]\n_rg = _r([10], [20], [30], [40])\negal(\"25 se pose sur la rangée du 20 (plus grand sommet inférieur) : 0 tête\", lambda: placer(_rg, 25), 0)\negal(\"... rangée 1 = [20, 25]\", lambda: _c(_rg), [[10], [20, 25], [30], [40]])\negal(\"55 se pose sur la rangée du 40\", lambda: (placer(_rg, 55), _c(_rg)[3]), (0, [40, 55]))\n_rg = _r([22, 25, 30, 31, 34], [50], [60], [70])\negal(\"35 sur une rangée pleine : on ramasse 22(5)+25(2)+30(3)+31(1)+34(1) = 12 têtes\", lambda: placer(_rg, 35), 12)\negal(\"... la carte 35 devient seule dans la rangée\", lambda: _c(_rg), [[35], [50], [60], [70]])\n_rg = _r([10], [20], [30], [40])\negal(\"carte 5 trop petite : on ramasse la rangée n°0 = [10] -> 3 têtes\", lambda: placer(_rg, 5), 3)\negal(\"... la rangée 0 devient [5]\", lambda: _c(_rg), [[5], [20], [30], [40]])\n_rg = _r([55, 56], [20], [90], [40])\negal(\"carte 57 : sommet 56 le plus grand < 57 (rangée 0), pas pleine : 0 tête\", lambda: placer(_rg, 57), 0)\n_rg = _r([3, 6, 8, 12, 14], [1], [2], [4])\negal(\"14 -> 15 sur rangée pleine (5 cartes) : ramasse 3,6,8,12,14 = 5 têtes\", lambda: placer(_rg, 15), 5)\n", "aide_code": null, "visuel": null, "indices_html": ["<p>Cherche d&#x27;abord, parmi les 4 rangées, celle dont le sommet est <strong>le plus grand qui reste inférieur</strong> à la carte jouée. S&#x27;il n&#x27;y en a aucune, ou si la rangée trouvée a déjà 5 cartes, il faut ramasser avant de poser.</p>", "<p>Structure :</p>\n<pre><code>choix = -<span class=\"n\">1</span>\n<span class=\"k\">for</span> <span class=\"f\">i</span> <span class=\"k\">in</span> <span class=\"b\">range</span>(<span class=\"b\">len</span>(rangees)):\n    s = rangees[i].<span class=\"f\">sommet</span>()\n    <span class=\"k\">if</span> s &lt; <span class=\"f\">carte</span> <span class=\"k\">and</span> (choix == -<span class=\"n\">1</span> <span class=\"k\">or</span> s &gt; rangees[choix].<span class=\"f\">sommet</span>()):\n        choix = i\npoints = <span class=\"n\">0</span>\n<span class=\"k\">if</span> choix == -<span class=\"n\">1</span>:                          <span class=\"c\"># carte plus petite que tous les sommets\n    choix = 0\n    while not rangees[choix].est_vide():\n        points += tetes(rangees[choix].depiler())\nelif rangees[choix].taille() == 5:       # rangée pleine\n    while not rangees[choix].est_vide():\n        points += tetes(rangees[choix].depiler())\nrangees[choix].empiler(carte)\nreturn points</span></code></pre>"]}], "demo": "bataille"}, {"id": "tp5", "num": 5, "slug": "snake", "titre": "Snake", "titre_court": "Snake", "sous_titre": "Files : le corps du serpent est une file", "duree": "1 h 30", "emoji": "🐍", "accent": "#c98a1f", "objectifs": ["Reconnaître une file dans un problème réel : la tête du serpent est **enfilée**, la queue est **défilée**.", "Manipuler une file **uniquement par son interface** : parcourir sans perdre les éléments (`contient`).", "Écrire la fonction centrale d'un jeu et la tester unitairement.", "Jouer avec sa propre fonction : le jeu tourne dans le navigateur."], "intro_html": "<h2>Le corps du serpent est une file</h2>\n<p>Chaque case du corps est représentée par un couple <code>(x, y)</code> : <code>x</code> est la colonne (0 à gauche), <code>y</code> la ligne (0 <strong>en haut</strong>, elle augmente vers le bas).</p>\n<p>À chaque déplacement du serpent :</p>\n<ul><li>la <strong>nouvelle tête</strong> est <strong>enfilée</strong> (elle arrive à la queue de la file) ;</li><li>la <strong>queue</strong> du serpent est <strong>défilée</strong> (elle sort par la tête de la file), <strong>sauf</strong> si le serpent vient de manger une pomme : il grandit d&#x27;une case.</li></ul>\n<p>C&#x27;est exactement le comportement d&#x27;une <strong>file</strong> (FIFO) : la case la plus ancienne est la première à sortir.</p>\n<pre><code>corps = <span class=\"f\">File</span> : [(<span class=\"n\">1</span>,<span class=\"n\">1</span>), (<span class=\"n\">2</span>,<span class=\"n\">1</span>), (<span class=\"n\">3</span>,<span class=\"n\">1</span>)]      ← ordre : queue du serpent → tête du serpent\n                 queue          tête\navancer vers la droite : on <span class=\"f\">enfile</span> (<span class=\"n\">4</span>,<span class=\"n\">1</span>) et <span class=\"f\">on</span> défile (<span class=\"n\">1</span>,<span class=\"n\">1</span>)\ncorps = <span class=\"f\">File</span> : [(<span class=\"n\">2</span>,<span class=\"n\">1</span>), (<span class=\"n\">3</span>,<span class=\"n\">1</span>), (<span class=\"n\">4</span>,<span class=\"n\">1</span>)]</code></pre>\n<p>La classe <code>File</code> est fournie (<code>est_vide</code>, <code>enfiler</code>, <code>defiler</code>, <code>taille</code>) ainsi que <code>fabrique(liste)</code> (crée une file à partir d&#x27;une liste, le 1ᵉʳ élément en tête) et <code>contenu_file(f)</code> (liste des éléments, <strong>sans vider</strong> la file : pour afficher ou tester).</p>\n<div class=\"adm adm-attention\"><p class=\"adm-titre\">Règle du jeu</p><p>Le serpent <strong>meurt</strong> s&#x27;il sort de la grille ou s&#x27;il rentre dans une case de son propre corps (<strong>queue comprise</strong>, pour simplifier).</p></div>", "prelude": "\nimport random\n\n_ops = [0]\n_DIRECTIONS = {\"haut\": (0, -1), \"bas\": (0, 1), \"gauche\": (-1, 0), \"droite\": (1, 0)}\n_OPPOSE = {\"haut\": \"bas\", \"bas\": \"haut\", \"gauche\": \"droite\", \"droite\": \"gauche\"}\n\n\nclass File:\n    \"\"\"File (FIFO). Interface : est_vide, enfiler, defiler, taille.\"\"\"\n\n    def __init__(self):\n        self._elts = []\n\n    def est_vide(self):\n        return len(self._elts) == 0\n\n    def enfiler(self, x):\n        self._elts.append(x)\n\n    def defiler(self):\n        if len(self._elts) == 0:\n            raise IndexError(\"defiler : la file est vide\")\n        return self._elts.pop(0)\n\n    def taille(self):\n        return len(self._elts)\n\n    def __repr__(self):\n        return \"File(tête -> \" + \", \".join(repr(x) for x in self._elts) + \")\" if self._elts else \"File(vide)\"\n\n\ndef fabrique(elements):\n    \"\"\"Renvoie une file contenant les éléments de la liste (le premier de la liste en tête).\"\"\"\n    f = File()\n    for x in elements:\n        f.enfiler(x)\n    return f\n\n\ndef contenu_file(f):\n    \"\"\"Liste des éléments de f (tête -> queue), sans modifier f. N'utilise que l'interface de la file.\"\"\"\n    res = []\n    for _ in range(f.taille()):\n        x = f.defiler()\n        res.append(x)\n        f.enfiler(x)\n    return res\n\n\nclass _Jeu:\n    \"\"\"Moteur du jeu : appelle la fonction de l'élève à chaque pas.\"\"\"\n\n    def __init
